version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-lazylibrarian_server_1
      APP_PORT: 5299
  server:
    image: ghcr.io/linuxserver-playground/lazylibrarian:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DOCKER_MODS: linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/books:/books
