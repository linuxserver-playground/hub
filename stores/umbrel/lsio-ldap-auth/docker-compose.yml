version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-ldap-auth_server_1
      APP_PORT: 8888
  server:
    image: ghcr.io/linuxserver-playground/ldap-auth:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    volumes: []
    ports:
    - 9000:9000
