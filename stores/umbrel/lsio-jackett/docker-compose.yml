version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-jackett_server_1
      APP_PORT: 9117
  server:
    image: ghcr.io/linuxserver-playground/jackett:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      AUTO_UPDATE: 'true'
      RUN_OPTS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
