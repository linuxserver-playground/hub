version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-pairdrop_server_1
      APP_PORT: 3000
  server:
    image: ghcr.io/linuxserver-playground/pairdrop:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      RATE_LIMIT: 'false'
      WS_FALLBACK: 'false'
      RTC_CONFIG: ''
      DEBUG_MODE: 'false'
    volumes: []
