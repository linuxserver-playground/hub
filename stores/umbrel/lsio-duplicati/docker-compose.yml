version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-duplicati_server_1
      APP_PORT: 8200
  server:
    image: ghcr.io/linuxserver-playground/duplicati:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      SETTINGS_ENCRYPTION_KEY: ''
      CLI_ARGS: ''
      DUPLICATI__WEBSERVICE_PASSWORD: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/backups:/backups
    - ${APP_DATA_DIR}/data/source:/source
