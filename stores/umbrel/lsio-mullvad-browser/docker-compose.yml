version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-mullvad-browser_server_1
      APP_PORT: 3000
  server:
    image: ghcr.io/linuxserver-playground/mullvad-browser:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      LOCAL_NET: 192.168.0.0/16
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    cap_add:
    - NET_ADMIN
    ports:
    - 3001:3001
