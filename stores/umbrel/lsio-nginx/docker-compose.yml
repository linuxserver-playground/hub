version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-nginx_server_1
      APP_PORT: 80
  server:
    image: ghcr.io/linuxserver-playground/nginx:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      NGINX_AUTORELOAD: ''
      NGINX_AUTORELOAD_WATCHLIST: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 443:443
