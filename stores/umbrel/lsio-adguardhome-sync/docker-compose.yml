version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-adguardhome-sync_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/linuxserver-playground/adguardhome-sync:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CONFIGFILE: /config/adguardhome-sync.yaml
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
