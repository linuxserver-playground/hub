version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-plex_server_1
      APP_PORT: 32400
  server:
    image: ghcr.io/linuxserver-playground/plex:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      VERSION: docker
      PLEX_CLAIM: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/tv:/tv
    - ${APP_DATA_DIR}/data/movies:/movies
