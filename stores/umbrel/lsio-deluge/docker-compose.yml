version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-deluge_server_1
      APP_PORT: 8112
  server:
    image: ghcr.io/linuxserver-playground/deluge:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DELUGE_LOGLEVEL: error
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    ports:
    - 6881:6881
    - 6881:6881/udp
