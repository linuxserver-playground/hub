version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-calibre_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/linuxserver-playground/calibre:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PASSWORD: ''
      CLI_ARGS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 8181:8181
    - 8081:8081
