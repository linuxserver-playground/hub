version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-ombi_server_1
      APP_PORT: 3579
  server:
    image: ghcr.io/linuxserver-playground/ombi:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      BASE_URL: /
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
