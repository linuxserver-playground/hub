version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-phpmyadmin_server_1
      APP_PORT: 80
  server:
    image: ghcr.io/linuxserver-playground/phpmyadmin:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PMA_ARBITRARY: '1'
      PMA_ABSOLUTE_URI: https://phpmyadmin.example.com
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
