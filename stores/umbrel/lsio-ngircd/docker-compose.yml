version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-ngircd_server_1
      APP_PORT: 6667
  server:
    image: ghcr.io/linuxserver-playground/ngircd:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
