version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-emby_server_1
      APP_PORT: 8096
  server:
    image: ghcr.io/linuxserver-playground/emby:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/data/tvshows:/data/tvshows
    - ${APP_DATA_DIR}/data/data/movies:/data/movies
    - ${APP_DATA_DIR}/data/opt/vc/lib:/opt/vc/lib
