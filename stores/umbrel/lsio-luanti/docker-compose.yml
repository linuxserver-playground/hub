version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-luanti_server_1
      APP_PORT: 30000
  server:
    image: ghcr.io/linuxserver-playground/luanti:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CLI_ARGS: --gameid devtest
    volumes:
    - ${APP_DATA_DIR}/data/config/.minetest:/config/.minetest
