version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-synclounge_server_1
      APP_PORT: 8088
  server:
    image: ghcr.io/linuxserver-playground/synclounge:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      AUTH_LIST: plexuser1,plexuser2,email1,machineid1
    volumes: []
