version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-nzbget_server_1
      APP_PORT: 6789
  server:
    image: ghcr.io/linuxserver-playground/nzbget:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      NZBGET_USER: nzbget
      NZBGET_PASS: tegbzn6789
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
