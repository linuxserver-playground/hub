version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-mysql-workbench_server_1
      APP_PORT: 3000
  server:
    image: ghcr.io/linuxserver-playground/mysql-workbench:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    cap_add:
    - IPC_LOCK
    ports:
    - 3001:3001
