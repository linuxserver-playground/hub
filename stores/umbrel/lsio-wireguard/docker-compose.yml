version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-wireguard_server_1
      APP_PORT: 51820
  server:
    image: ghcr.io/linuxserver-playground/wireguard:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      SERVERURL: wireguard.domain.com
      SERVERPORT: '51820'
      PEERS: '1'
      PEERDNS: auto
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 0.0.0.0/0
      PERSISTENTKEEPALIVE_PEERS: ''
      LOG_CONFS: 'true'
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/lib/modules:/lib/modules
    cap_add:
    - NET_ADMIN
