version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-minisatip_server_1
      APP_PORT: 8875
  server:
    image: ghcr.io/linuxserver-playground/minisatip:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      RUN_OPTS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 554:554
    - 1900:1900/udp
