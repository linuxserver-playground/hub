version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-unifi-network-application_server_1
      APP_PORT: 8443
  server:
    image: ghcr.io/linuxserver-playground/unifi-network-application:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      MONGO_USER: unifi
      MONGO_PASS: ''
      MONGO_HOST: unifi-db
      MONGO_PORT: '27017'
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
      MEM_LIMIT: '1024'
      MEM_STARTUP: '1024'
      MONGO_TLS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 3478:3478/udp
    - 10001:10001/udp
    - 8080:8080
