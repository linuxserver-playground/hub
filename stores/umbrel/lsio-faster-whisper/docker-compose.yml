version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-faster-whisper_server_1
      APP_PORT: 10300
  server:
    image: ghcr.io/linuxserver-playground/faster-whisper:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DEBUG: ''
      LOCAL_ONLY: ''
      WHISPER_BEAM: '1'
      WHISPER_LANG: auto
      WHISPER_MODEL: auto
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
