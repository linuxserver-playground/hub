version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-apprise-api_server_1
      APP_PORT: 8000
  server:
    image: ghcr.io/linuxserver-playground/apprise-api:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APPRISE_ATTACH_SIZE: '0'
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/attachments:/attachments
