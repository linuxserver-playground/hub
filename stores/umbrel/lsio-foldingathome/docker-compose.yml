version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-foldingathome_server_1
      APP_PORT: 7396
  server:
    image: ghcr.io/linuxserver-playground/foldingathome:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
