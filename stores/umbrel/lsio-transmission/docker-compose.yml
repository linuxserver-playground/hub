version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-transmission_server_1
      APP_PORT: 9091
  server:
    image: ghcr.io/linuxserver-playground/transmission:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      TRANSMISSION_WEB_HOME: ''
      USER: ''
      PASS: ''
      WHITELIST: ''
      PEERPORT: ''
      HOST_WHITELIST: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/watch:/watch
    ports:
    - 51413:51413
    - 51413:51413/udp
