version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-openssh-server_server_1
      APP_PORT: 2222
  server:
    image: ghcr.io/linuxserver-playground/openssh-server:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PUBLIC_KEY: yourpublickey
      PUBLIC_KEY_FILE: /path/to/file
      PUBLIC_KEY_DIR: /path/to/directory/containing/_only_/pubkeys
      PUBLIC_KEY_URL: https://github.com/username.keys
      SUDO_ACCESS: 'false'
      PASSWORD_ACCESS: 'false'
      USER_PASSWORD: password
      USER_PASSWORD_FILE: /path/to/file
      USER_NAME: linuxserver.io
      LOG_STDOUT: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
