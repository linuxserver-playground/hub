version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-speedtest-tracker_server_1
      APP_PORT: 80
  server:
    image: ghcr.io/linuxserver-playground/speedtest-tracker:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APP_KEY: ''
      APP_URL: ''
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: ''
      SPEEDTEST_SERVERS: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_DATABASE: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DISPLAY_TIMEZONE: Etc/UTC
      PRUNE_RESULTS_OLDER_THAN: '0'
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
