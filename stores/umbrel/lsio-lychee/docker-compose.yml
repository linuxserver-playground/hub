version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-lychee_server_1
      APP_PORT: 80
  server:
    image: ghcr.io/linuxserver-playground/lychee:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DB_CONNECTION: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      APP_NAME: Lychee
      APP_URL: ''
      TRUSTED_PROXIES: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/pictures:/pictures
