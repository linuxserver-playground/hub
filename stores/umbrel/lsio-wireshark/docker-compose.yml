version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-wireshark_server_1
      APP_PORT: 3001
  server:
    image: ghcr.io/linuxserver-playground/wireshark:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    cap_add:
    - NET_ADMIN
