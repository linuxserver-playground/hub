version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-pydio-cells_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/linuxserver-playground/pydio-cells:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      EXTERNALURL: yourdomain.url
      SERVER_IP: 0.0.0.0
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
