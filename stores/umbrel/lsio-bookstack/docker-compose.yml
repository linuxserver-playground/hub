version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-bookstack_server_1
      APP_PORT: 6875
  server:
    image: ghcr.io/linuxserver-playground/bookstack:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APP_URL: ''
      APP_KEY: ''
      DB_HOST: ''
      DB_PORT: '3306'
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      QUEUE_CONNECTION: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 6875:80
