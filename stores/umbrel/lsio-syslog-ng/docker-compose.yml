version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-syslog-ng_server_1
      APP_PORT: 514
  server:
    image: ghcr.io/linuxserver-playground/syslog-ng:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      LOG_TO_STDOUT: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/var/log:/var/log
    ports:
    - 514:5514/udp
    - 601:6601/tcp
    - 6514:6514/tcp
