version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-tvheadend_server_1
      APP_PORT: 9981
  server:
    image: ghcr.io/linuxserver-playground/tvheadend:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      RUN_OPTS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/recordings:/recordings
    ports:
    - 9982:9982
