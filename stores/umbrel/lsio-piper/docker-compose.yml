version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: lsio-piper_server_1
      APP_PORT: 10200
  server:
    image: ghcr.io/linuxserver-playground/piper:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PIPER_VOICE: en_US-lessac-medium
      LOCAL_ONLY: ''
      PIPER_LENGTH: '1.0'
      PIPER_NOISE: '0.667'
      PIPER_NOISEW: '0.333'
      PIPER_SPEAKER: '0'
      NO_STREAMING: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
