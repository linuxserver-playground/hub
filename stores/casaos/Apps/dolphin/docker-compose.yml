name: dolphin
services:
  dolphin:
    image: ghcr.io/linuxserver-playground/dolphin:latest
    container_name: dolphin
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/dolphin/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Dolphin desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: Dolphin desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: dolphin
  author: LinuxServer.io
  developer: Dolphin
  category: Games
  description:
    en_us: Dolphin Emulator lets you play GameCube and Wii games with various graphical enhancements and other features are available to improve your game experience.
  tagline:
    en_us: Dolphin Emulator lets you play GameCube and Wii games with various graphical enhancements and other features are available to improve your game experience
  title:
    en_us: Dolphin
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dolphin-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dolphin-logo.png
  store_app_id: dolphin
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-dolphin/builds/2609a-ls7/amd64/screenshot.png
  port_map: '3000'
