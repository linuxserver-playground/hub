name: handbrake
services:
  handbrake:
    image: ghcr.io/linuxserver-playground/handbrake:latest
    container_name: handbrake
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/handbrake/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HandBrake desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: HandBrake desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: handbrake
  author: LinuxServer.io
  developer: Handbrake
  category: Media Management
  description:
    en_us: HandBrake is an open-source tool, built by volunteers, for converting video from nearly any format to a selection of modern, widely supported codecs.
  tagline:
    en_us: HandBrake is an open-source tool, built by volunteers, for converting video from nearly any format to a selection of modern, widely supported codecs
  title:
    en_us: Handbrake
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/handbrake-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/handbrake-logo.png
  store_app_id: handbrake
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-handbrake/builds/1.11.2-ls8/amd64/screenshot.png
  port_map: '3000'
