name: librespeed
services:
  librespeed:
    image: ghcr.io/linuxserver-playground/librespeed:latest
    container_name: librespeed
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - PASSWORD=PASSWORD
    - CUSTOM_RESULTS=false
    - DB_TYPE=sqlite
    - DB_NAME=DB_NAME
    - DB_HOSTNAME=DB_HOSTNAME
    - DB_USERNAME=DB_USERNAME
    - DB_PASSWORD=DB_PASSWORD
    - DB_PORT=DB_PORT
    - IPINFO_APIKEY=ACCESS_TOKEN
    volumes:
    - /DATA/AppData/librespeed/config:/config
    ports:
    - 80:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: PASSWORD
        description:
          en_us: Set the password for the results database.
      - container: CUSTOM_RESULTS
        description:
          en_us: (optional) set to true to enable custom results page in /config/www/results/index.php.
      - container: DB_TYPE
        description:
          en_us: Defaults to sqlite, can also be set to mysql or postgresql.
      - container: DB_NAME
        description:
          en_us: Database name. Required for mysql and pgsql.
      - container: DB_HOSTNAME
        description:
          en_us: Database address. Required for mysql and pgsql.
      - container: DB_USERNAME
        description:
          en_us: Database username. Required for mysql and pgsql.
      - container: DB_PASSWORD
        description:
          en_us: Database password. Required for mysql and pgsql.
      - container: DB_PORT
        description:
          en_us: Database port. Required for mysql.
      - container: IPINFO_APIKEY
        description:
          en_us: Access token from ipinfo.io. Required for detailed IP information.
      ports:
      - container: '80'
        description:
          en_us: web gui
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: librespeed
  author: LinuxServer.io
  developer: Librespeed
  category: Monitoring
  description:
    en_us: Librespeed is a very lightweight Speedtest implemented in Javascript, using XMLHttpRequest and Web Workers.
  tagline:
    en_us: Librespeed is a very lightweight Speedtest implemented in Javascript, using XMLHttpRequest and Web Workers
  title:
    en_us: Librespeed
  icon: https://raw.githubusercontent.com/librespeed/speedtest/master/.logo/logo3.png
  thumbnail: https://raw.githubusercontent.com/librespeed/speedtest/master/.logo/logo3.png
  store_app_id: librespeed
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-librespeed/builds/v6.3.1-ls6/amd64/screenshot.png
  port_map: '80'
