name: synclounge
services:
  synclounge:
    image: ghcr.io/linuxserver-playground/synclounge:latest
    container_name: synclounge
    restart: unless-stopped
    environment:
    - AUTH_LIST=plexuser1,plexuser2,email1,machineid1
    ports:
    - 8088:8088
    x-casaos:
      envs:
      - container: AUTH_LIST
        description:
          en_us: If set, only the users defined here and the users of the plex servers defined here will be able to access the server. Use e-mails, plex usernames and/or plex server machine ids, comma separated, no spaces.
      ports:
      - container: '8088'
        description:
          en_us: Web app and server port
      volumes: []
x-casaos:
  architectures:
  - amd64
  - arm64
  main: synclounge
  author: LinuxServer.io
  developer: Synclounge
  category: Media Tools
  description:
    en_us: Synclounge is a third party tool that allows you to watch Plex in sync with your friends/family, wherever you are.
  tagline:
    en_us: Synclounge is a third party tool that allows you to watch Plex in sync with your friends/family, wherever you are
  title:
    en_us: Synclounge
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/synclounge-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/synclounge-banner.png
  store_app_id: synclounge
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-synclounge/builds/5.2.35-ls7/amd64/screenshot.png
  port_map: '8088'
