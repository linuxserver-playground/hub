name: speedtest-tracker
services:
  speedtest-tracker:
    image: ghcr.io/linuxserver-playground/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - APP_KEY=
    - APP_URL=
    - DB_CONNECTION=sqlite
    - SPEEDTEST_SCHEDULE=
    - SPEEDTEST_SERVERS=
    - DB_HOST=
    - DB_PORT=
    - DB_DATABASE=
    - DB_USERNAME=
    - DB_PASSWORD=
    - DISPLAY_TIMEZONE=Etc/UTC
    - PRUNE_RESULTS_OLDER_THAN=0
    volumes:
    - /DATA/AppData/speedtest-tracker/config:/config
    ports:
    - 80:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: APP_KEY
        description:
          en_us: App key used for encrypting stored data. You can generate a key as per https://speedtest-tracker.dev
      - container: APP_URL
        description:
          en_us: The IP:port or URL your application will be accessed on (ie. http://192.168.1.1:6875 or https://bookstack.mydomain.com
      - container: DB_CONNECTION
        description:
          en_us: Set the database type to use. sqlite, pgsql, or mysql
      - container: SPEEDTEST_SCHEDULE
        description:
          en_us: Set the test schedule in cron format. e.g. 0 /6
      - container: SPEEDTEST_SERVERS
        description:
          en_us: A comma-separated list of server IDs to test against. Run docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/speedtest-tracker:latest list-servers to get a list of nearby servers.
      - container: DB_HOST
        description:
          en_us: Database hostname (postgres/mysql).
      - container: DB_PORT
        description:
          en_us: Database port (postgres/mysql).
      - container: DB_DATABASE
        description:
          en_us: Database name (postgres/mysql).
      - container: DB_USERNAME
        description:
          en_us: Database username (postgres/mysql).
      - container: DB_PASSWORD
        description:
          en_us: Database password (postgres/mysql).
      - container: DISPLAY_TIMEZONE
        description:
          en_us: Timezone for the UI.
      - container: PRUNE_RESULTS_OLDER_THAN
        description:
          en_us: Days to keep test results.
      ports:
      - container: '80'
        description:
          en_us: Web UI
      volumes:
      - container: /config
        description:
          en_us: Contains speedtest-tracker config and database, if using sqlite.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: speedtest-tracker
  author: LinuxServer.io
  developer: Speedtest-tracker
  category: Monitoring
  description:
    en_us: Speedtest-tracker is a self-hosted internet performance tracking application that runs speedtest checks against Ookla's Speedtest service.
  tagline:
    en_us: Speedtest-tracker is a self-hosted internet performance tracking application that runs speedtest checks against Ookla's Speedtest service
  title:
    en_us: Speedtest-tracker
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/speedtest-tracker-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/speedtest-tracker-logo.png
  store_app_id: speedtest-tracker
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-speedtest-tracker/builds/v1.15.1-ls6/amd64/screenshot.png
  port_map: '80'
