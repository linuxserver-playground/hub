name: audacity
services:
  audacity:
    image: ghcr.io/linuxserver-playground/audacity:latest
    container_name: audacity
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/audacity/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Audacity desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Audacity desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and images
x-casaos:
  architectures:
  - amd64
  main: audacity
  author: LinuxServer.io
  developer: Audacity
  category: Audio Processing
  description:
    en_us: Audacity is an easy-to-use, multi-track audio editor and recorder. Developed by a group of volunteers as open source.
  tagline:
    en_us: Audacity is an easy-to-use, multi-track audio editor and recorder
  title:
    en_us: Audacity
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audacity-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audacity-logo.png
  store_app_id: audacity
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-audacity/builds/4.0.2-ls8/amd64/screenshot.png
  port_map: '3000'
