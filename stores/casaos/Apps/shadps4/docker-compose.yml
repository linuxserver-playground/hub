name: shadps4
services:
  shadps4:
    image: ghcr.io/linuxserver-playground/shadps4:latest
    container_name: shadps4
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/shadps4/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: shadPS4 desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: shadPS4 desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores all files and games.
x-casaos:
  architectures:
  - amd64
  main: shadps4
  author: LinuxServer.io
  developer: Shadps4
  category: Games
  description:
    en_us: shadPS4 is an early PlayStation 4 emulator for Windows, Linux and macOS written in C++.
  tagline:
    en_us: shadPS4 is an early PlayStation 4 emulator for Windows, Linux and macOS written in C++
  title:
    en_us: Shadps4
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shadps4-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shadps4-logo.png
  store_app_id: shadps4
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-shadps4/builds/shadPS4QtLauncher-2026-11-06-ecc85072dae45c05628934fdb6b3aa036e9f1d4b-ls11/amd64/screenshot.png
  port_map: '3000'
