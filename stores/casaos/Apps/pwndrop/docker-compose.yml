name: pwndrop
services:
  pwndrop:
    image: ghcr.io/linuxserver-playground/pwndrop:latest
    container_name: pwndrop
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - SECRET_PATH=/pwndrop
    volumes:
    - /DATA/AppData/pwndrop/config:/config
    ports:
    - 8080:8080
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: SECRET_PATH
        description:
          en_us: Secret path for admin access. Defaults to /pwndrop. This parameter only takes effect during initial install; it can later be changed in the web gui.
      ports:
      - container: '8080'
        description:
          en_us: web gui
      volumes:
      - container: /config
        description:
          en_us: Contains all relevant configuration and data.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: pwndrop
  author: LinuxServer.io
  developer: Pwndrop
  category: File Sharing
  description:
    en_us: Pwndrop is a self-deployable file hosting service for sending out red teaming payloads or securely sharing your private files over HTTP and WebDAV.
  tagline:
    en_us: Pwndrop is a self-deployable file hosting service for sending out red teaming payloads or securely sharing your private files over HTTP and WebDAV
  title:
    en_us: Pwndrop
  icon: https://raw.githubusercontent.com/kgretzky/pwndrop/master/media/pwndrop-logo-512.png
  thumbnail: https://raw.githubusercontent.com/kgretzky/pwndrop/master/media/pwndrop-logo-512.png
  store_app_id: pwndrop
  index: /pwndrop
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-pwndrop/builds/1.0.1-ls5/amd64/screenshot.png
  port_map: '8080'
