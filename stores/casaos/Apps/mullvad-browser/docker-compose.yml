name: mullvad-browser
services:
  mullvad-browser:
    image: ghcr.io/linuxserver-playground/mullvad-browser:latest
    container_name: mullvad-browser
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - LOCAL_NET=192.168.0.0/16
    volumes:
    - /DATA/AppData/mullvad-browser/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: LOCAL_NET
        description:
          en_us: If using a VPN, set this to your local LAN IP range using CIDR notation. Without it you will be unable to access the web interface. If you have multiple ranges or a complex LAN setup you will need to manage this yourself in the wg0.conf, see the App Setup section for details.
      ports:
      - container: '3000'
        description:
          en_us: Mullvad Browser GUI.
      - container: '3001'
        description:
          en_us: Mullvad Browser GUI HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: mullvad-browser
  author: LinuxServer.io
  developer: Mullvad-browser
  category: Web Browser
  description:
    en_us: The Mullvad Browser is a privacy-focused web browser developed in a collaboration between Mullvad VPN and the Tor Project. It’s designed to minimize tracking and fingerprinting. You could say it’s a Tor Browser to use without the Tor Network. Instead, you can use it with a trustworthy VPN.
  tagline:
    en_us: The Mullvad Browser is a privacy-focused web browser developed in a collaboration between Mullvad VPN and the Tor Project
  title:
    en_us: Mullvad-browser
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mullvad-browser-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mullvad-browser-logo.png
  store_app_id: mullvad-browser
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-mullvad-browser/builds/16.0-ls7/amd64/screenshot.png
  port_map: '3000'
