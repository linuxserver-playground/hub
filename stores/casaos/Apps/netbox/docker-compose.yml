name: netbox
services:
  netbox:
    image: ghcr.io/linuxserver-playground/netbox:latest
    container_name: netbox
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - SUPERUSER_EMAIL=
    - SUPERUSER_PASSWORD=
    - ALLOWED_HOST=
    - DB_NAME=
    - DB_USER=
    - DB_PASSWORD=
    - DB_HOST=
    - DB_PORT=
    - REDIS_HOST=
    - REDIS_PORT=
    - REDIS_USERNAME=
    - REDIS_PASSWORD=
    - REDIS_DB_TASK=
    - REDIS_DB_CACHE=
    - BASE_PATH=
    - CSRF_TRUSTED_ORIGINS=
    - REMOTE_AUTH_ENABLED=
    - REMOTE_AUTH_BACKEND=
    - REMOTE_AUTH_HEADER=
    - REMOTE_AUTH_AUTO_CREATE_USER=
    - REMOTE_AUTH_DEFAULT_GROUPS=
    - REMOTE_AUTH_DEFAULT_PERMISSIONS=
    volumes:
    - /DATA/AppData/netbox/config:/config
    ports:
    - 8000:8000
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: SUPERUSER_EMAIL
        description:
          en_us: Email address for admin account
      - container: SUPERUSER_PASSWORD
        description:
          en_us: Password for admin account
      - container: ALLOWED_HOST
        description:
          en_us: The hostname you will use to access the app (e.g., netbox.example.com)
      - container: DB_NAME
        description:
          en_us: 'Database name (default: netbox)'
      - container: DB_USER
        description:
          en_us: Database user
      - container: DB_PASSWORD
        description:
          en_us: Database password
      - container: DB_HOST
        description:
          en_us: 'Database host (default: postgres)'
      - container: DB_PORT
        description:
          en_us: 'Database port (default: 5432)'
      - container: REDIS_HOST
        description:
          en_us: 'Redis host (default: redis)'
      - container: REDIS_PORT
        description:
          en_us: 'Redis port number (default: 6379)'
      - container: REDIS_USERNAME
        description:
          en_us: 'Redis username (default: none)'
      - container: REDIS_PASSWORD
        description:
          en_us: 'Redis password (default: none)'
      - container: REDIS_DB_TASK
        description:
          en_us: 'Redis database ID for tasks (default: 0)'
      - container: REDIS_DB_CACHE
        description:
          en_us: 'Redis database ID for caching (default: 1)'
      - container: BASE_PATH
        description:
          en_us: 'The path you will use to access the app (i.e., /netbox, default: none)'
      - container: CSRF_TRUSTED_ORIGINS
        description:
          en_us: 'List of comma-separated, single quoted, trusted origins. Must include protocol, and port if applicable (default: [])'
      - container: REMOTE_AUTH_ENABLED
        description:
          en_us: 'Enable remote authentication (default: False)'
      - container: REMOTE_AUTH_BACKEND
        description:
          en_us: 'Python path to the custom Django authentication backend to use for external user authentication (default: netbox.authentication.RemoteUserBackend)'
      - container: REMOTE_AUTH_HEADER
        description:
          en_us: 'Name of the HTTP header which informs NetBox of the currently authenticated user. (default: HTTPREMOTEUSER)'
      - container: REMOTE_AUTH_AUTO_CREATE_USER
        description:
          en_us: 'If true, NetBox will automatically create local accounts for users authenticated via a remote service (default: False)'
      - container: REMOTE_AUTH_DEFAULT_GROUPS
        description:
          en_us: 'The list of groups to assign a new user account when created using remote authentication (default: [])'
      - container: REMOTE_AUTH_DEFAULT_PERMISSIONS
        description:
          en_us: 'A mapping of permissions to assign a new user account when created using remote authentication (default: {})'
      ports:
      - container: '8000'
        description:
          en_us: will map the container's port 8000 to port 8000 on the host
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: netbox
  author: LinuxServer.io
  developer: Netbox
  category: Administration
  description:
    en_us: Netbox is an IP address management (IPAM) and data center infrastructure management (DCIM) tool. Initially conceived by the network engineering team at DigitalOcean, NetBox was developed specifically to address the needs of network and infrastructure engineers. It is intended to function as a domain-specific source of truth for network operations.
  tagline:
    en_us: Netbox is an IP address management (IPAM) and data center infrastructure management (DCIM) tool
  title:
    en_us: Netbox
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/netbox-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/netbox-logo.png
  store_app_id: netbox
  index: /
  scheme: http
  port_map: '8000'
