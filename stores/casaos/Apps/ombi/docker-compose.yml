name: ombi
services:
  ombi:
    image: ghcr.io/linuxserver-playground/ombi:latest
    container_name: ombi
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - BASE_URL=/
    volumes:
    - /DATA/AppData/ombi/config:/config
    ports:
    - 3579:3579
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: BASE_URL
        description:
          en_us: Subfolder can optionally be defined as an env variable for reverse proxies. Keep in mind that once this value is defined, the gui setting for base url no longer works. To use the gui setting, remove this env variable.
      ports:
      - container: '3579'
        description:
          en_us: web gui
      volumes:
      - container: /config
        description:
          en_us: Contains all relevant configuration files.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: ombi
  author: LinuxServer.io
  developer: Ombi
  category: Media Requesters
  description:
    en_us: Ombi allows you to host your own Plex Request and user management system. If you are sharing your Plex server with other users, allow them to request new content using an easy to manage interface! Manage all your requests for Movies and TV with ease, leave notes for the user and get notification when a user requests something. Allow your users to post issues against their requests so you know there is a problem with the audio etc. Even automatically send them weekly newsletters of new content that has been added to your Plex server!
  tagline:
    en_us: Ombi allows you to host your own Plex Request and user management system
  title:
    en_us: Ombi
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ombi.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ombi.png
  store_app_id: ombi
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-ombi/builds/v4.53.10-ls6/amd64/screenshot.png
  port_map: '3579'
