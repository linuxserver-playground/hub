name: bambustudio
services:
  bambustudio:
    image: ghcr.io/linuxserver-playground/bambustudio:latest
    container_name: bambustudio
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DARK_MODE=true
    volumes:
    - /DATA/AppData/bambustudio/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: DARK_MODE
        description:
          en_us: Set this to true to enable dark mode for Bambu Studio.
      ports:
      - container: '3000'
        description:
          en_us: Bambu Studio desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Bambu Studio desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and files.
x-casaos:
  architectures:
  - amd64
  main: bambustudio
  author: LinuxServer.io
  developer: Bambustudio
  category: 3D Printing
  description:
    en_us: Bambu Studio is an open-source, cutting-edge, feature-rich slicing software. It contains project-based workflows, systematically optimized slicing algorithms, and an easy-to-use graphical interface, bringing users an incredibly smooth printing experience.
  tagline:
    en_us: Bambu Studio is an open-source, cutting-edge, feature-rich slicing software
  title:
    en_us: Bambustudio
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bambustudio-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bambustudio-logo.png
  store_app_id: bambustudio
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-bambustudio/builds/v02.09.01.70-ls6/amd64/screenshot.png
  port_map: '3000'
