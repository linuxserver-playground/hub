name: projectsend
services:
  projectsend:
    image: ghcr.io/linuxserver-playground/projectsend:latest
    container_name: projectsend
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/projectsend/config:/config
    - /DATA/AppData/projectsend/data:/data
    ports:
    - 80:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '80'
        description:
          en_us: WebUI
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
      - container: /data
        description:
          en_us: Where to store files to share.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: projectsend
  author: LinuxServer.io
  developer: Projectsend
  category: File Sharing
  description:
    en_us: Projectsend is a self-hosted application that lets you upload files and assign them to specific clients that you create yourself. Secure, private and easy. No more depending on external services or e-mail to send those files.
  tagline:
    en_us: Projectsend is a self-hosted application that lets you upload files and assign them to specific clients that you create yourself
  title:
    en_us: Projectsend
  icon: http://www.projectsend.org/wp-content/themes/projectsend/img/screenshots.png
  thumbnail: http://www.projectsend.org/wp-content/themes/projectsend/img/screenshots.png
  store_app_id: projectsend
  index: /install/make-config.php
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-projectsend/builds/r2098-ls6/amd64/screenshot.png
  port_map: '80'
