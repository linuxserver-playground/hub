name: signal
services:
  signal:
    image: ghcr.io/linuxserver-playground/signal:latest
    container_name: signal
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/signal/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Signal desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: Signal desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: signal
  author: LinuxServer.io
  developer: Signal
  category: Chat
  description:
    en_us: Signal is a messaging app with privacy at its core. It is free and easy to use, with strong end-to-end encryption that keeps your communication completely private.
  tagline:
    en_us: Signal is a messaging app with privacy at its core
  title:
    en_us: Signal
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/signal-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/signal-logo.png
  store_app_id: signal
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-signal/builds/8.35.0-ls11/amd64/screenshot.png
  port_map: '3000'
