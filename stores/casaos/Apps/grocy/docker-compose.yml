name: grocy
services:
  grocy:
    image: ghcr.io/linuxserver-playground/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/grocy/config:/config
    ports:
    - 9283:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '80'
        description:
          en_us: will map the container's port 80 to port 9283 on the host
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: grocy
  author: LinuxServer.io
  developer: Grocy
  category: Recipes
  description:
    en_us: Grocy is an ERP system for your kitchen! Cut down on food waste, and manage your chores with this brilliant utility.
  tagline:
    en_us: Grocy is an ERP system for your kitchen! Cut down on food waste, and manage your chores with this brilliant utility
  title:
    en_us: Grocy
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grocy-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grocy-logo.png
  store_app_id: grocy
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-grocy/builds/v4.7.1-ls9/amd64/screenshot.png
  port_map: '9283'
