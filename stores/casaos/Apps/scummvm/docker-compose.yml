name: scummvm
services:
  scummvm:
    image: ghcr.io/linuxserver-playground/scummvm:latest
    container_name: scummvm
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/scummvm/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HTTP ScummVM desktop gui must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS ScummVM desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: scummvm
  author: LinuxServer.io
  developer: Scummvm
  category: Games
  description:
    en_us: 'ScummVM is a program which allows you to run certain classic graphical adventure and role-playing games, provided you already have their data files. The clever part about this: ScummVM just replaces the executables shipped with the games, allowing you to play them on systems for which they were never designed! ScummVM is a complete rewrite of these games'' executables and is not an emulator.'
  tagline:
    en_us: ScummVM is a program which allows you to run certain classic graphical adventure and role-playing games, provided you already have their data files
  title:
    en_us: Scummvm
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/scummvm-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/scummvm-logo.png
  store_app_id: scummvm
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-scummvm/builds/v2026.4.0-ls6/amd64/screenshot.png
  port_map: '3000'
