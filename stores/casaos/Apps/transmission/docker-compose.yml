name: transmission
services:
  transmission:
    image: ghcr.io/linuxserver-playground/transmission:latest
    container_name: transmission
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - TRANSMISSION_WEB_HOME=
    - USER=
    - PASS=
    - WHITELIST=
    - PEERPORT=
    - HOST_WHITELIST=
    volumes:
    - /DATA/AppData/transmission/config:/config
    - /DATA/AppData/transmission/downloads:/downloads
    - /DATA/AppData/transmission/watch:/watch
    ports:
    - 9091:9091
    - 51413:51413
    - 51413:51413/udp
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: TRANSMISSION_WEB_HOME
        description:
          en_us: Specify the path to an alternative UI folder.
      - container: USER
        description:
          en_us: Specify an optional username for the interface
      - container: PASS
        description:
          en_us: Specify an optional password for the interface
      - container: WHITELIST
        description:
          en_us: Specify an optional list of comma separated ip whitelist. Fills rpc-whitelist setting.
      - container: PEERPORT
        description:
          en_us: Specify an optional port for torrent TCP/UDP connections. Fills peer-port setting.
      - container: HOST_WHITELIST
        description:
          en_us: Specify an optional list of comma separated dns name whitelist. Fills rpc-host-whitelist setting.
      ports:
      - container: '9091'
        description:
          en_us: WebUI
      - container: '51413'
        description:
          en_us: Torrent Port TCP
      - container: '51413'
        description:
          en_us: Torrent Port UDP
      volumes:
      - container: /config
        description:
          en_us: Where transmission should store config files and logs.
      - container: /downloads
        description:
          en_us: Local path for downloads.
      - container: /watch
        description:
          en_us: Watch folder for torrent files.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: transmission
  author: LinuxServer.io
  developer: Transmission
  category: Downloaders
  description:
    en_us: 'Transmission is designed for easy, powerful use. Transmission has the features you want from a BitTorrent client: encryption, a web interface, peer exchange, magnet links, DHT, µTP, UPnP and NAT-PMP port forwarding, webseed support, watch directories, tracker editing, global and per-torrent speed limits, and more.'
  tagline:
    en_us: Transmission is designed for easy, powerful use
  title:
    en_us: Transmission
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/transmission.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/transmission.png
  store_app_id: transmission
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-transmission/builds/4.1.4-r0-ls8/amd64/screenshot.png
  port_map: '9091'
