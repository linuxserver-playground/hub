name: socket-proxy
services:
  socket-proxy:
    image: ghcr.io/linuxserver-playground/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports: []
      volumes: []
x-casaos:
  architectures:
  - amd64
  - arm64
  main: socket-proxy
  author: LinuxServer.io
  developer: Socket-proxy
  category: Docker
  description:
    en_us: The Socket Proxy is a security-enhanced proxy which allows you to apply access rules to the Docker socket, limiting the attack surface for containers such as watchtower or Traefik that need to use it.
  tagline:
    en_us: The Socket Proxy is a security-enhanced proxy which allows you to apply access rules to the Docker socket, limiting the attack surface for containers such as watchtower or Traefik that need to use it
  title:
    en_us: Socket-proxy
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/docker-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/docker-logo.png
  store_app_id: socket-proxy
  index: /
  scheme: http
