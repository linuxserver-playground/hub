name: joplin
services:
  joplin:
    image: ghcr.io/linuxserver-playground/joplin:latest
    container_name: joplin
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/joplin/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Joplin desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Joplin desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and files.
x-casaos:
  architectures:
  - amd64
  main: joplin
  author: LinuxServer.io
  developer: Joplin
  category: Content Management
  description:
    en_us: Joplin is a free, open source note taking and to-do application, which can handle a large number of notes organised into notebooks.
  tagline:
    en_us: Joplin is a free, open source note taking and to-do application, which can handle a large number of notes organised into notebooks
  title:
    en_us: Joplin
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/joplin-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/joplin-logo.png
  store_app_id: joplin
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-joplin/builds/v3.7.22-ls10/amd64/screenshot.png
  port_map: '3000'
