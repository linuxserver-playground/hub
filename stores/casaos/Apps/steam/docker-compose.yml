name: steam
services:
  steam:
    image: ghcr.io/linuxserver-playground/steam:latest
    container_name: steam
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/steam/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Steam desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: Steam desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores all files and games.
x-casaos:
  architectures:
  - amd64
  main: steam
  author: LinuxServer.io
  developer: Steam
  category: Games
  description:
    en_us: Steam is the ultimate destination for playing, discussing, and creating games.
  tagline:
    en_us: Steam is the ultimate destination for playing, discussing, and creating games
  title:
    en_us: Steam
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/steam-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/steam-logo.png
  store_app_id: steam
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-steam/builds/1a1837d1-ls5/amd64/screenshot.png
  port_map: '3000'
