name: kicad
services:
  kicad:
    image: ghcr.io/linuxserver-playground/kicad:latest
    container_name: kicad
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/kicad/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: KiCad desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: KiCad desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and files.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: kicad
  author: LinuxServer.io
  developer: Kicad
  category: 3D Modeling
  description:
    en_us: KiCad - A Cross Platform and Open Source Electronics Design Automation Suite.
  tagline:
    en_us: KiCad - A Cross Platform and Open Source Electronics Design Automation Suite
  title:
    en_us: Kicad
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kicad-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kicad-logo.png
  store_app_id: kicad
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-kicad/builds/10.0.3-r0-ls6/amd64/screenshot.png
  port_map: '3000'
