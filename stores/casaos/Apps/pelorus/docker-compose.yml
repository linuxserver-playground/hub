name: pelorus
services:
  pelorus:
    image: ghcr.io/linuxserver-playground/pelorus:latest
    container_name: pelorus
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/pelorus/config:/config
    ports:
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3001'
        description:
          en_us: Pelorus split plane GUI HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: pelorus
  author: LinuxServer.io
  developer: Pelorus
  category: Remote Desktop
  description:
    en_us: Pelorus is an AI navigator for Selkies-powered Linux desktops. Pelorus runs a FastAPI server that gives an LLM agent (Ollama, OpenAI-compatible, or Gemini) control over mouse, keyboard, screenshot, and window management via the Pixelflux computer-use backend, a Linux accessibility tree (AT-SPI), and optional KWin D-Bus integration.
  tagline:
    en_us: Pelorus is an AI navigator for Selkies-powered Linux desktops
  title:
    en_us: Pelorus
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pelorus-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pelorus-logo.png
  store_app_id: pelorus
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-pelorus/builds/0.2.4-ls6/amd64/screenshot.png
  port_map: '3001'
