name: brave
services:
  brave:
    image: ghcr.io/linuxserver-playground/brave:latest
    container_name: brave
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/brave/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Brave desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: Brave desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: brave
  author: LinuxServer.io
  developer: Brave
  category: Web Browser
  description:
    en_us: The Brave browser is a fast, private and secure web browser for PC, Mac and mobile.
  tagline:
    en_us: The Brave browser is a fast, private and secure web browser for PC, Mac and mobile
  title:
    en_us: Brave
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
  store_app_id: brave
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-brave/builds/1.99.55-ls5/amd64/screenshot.png
  port_map: '3000'
