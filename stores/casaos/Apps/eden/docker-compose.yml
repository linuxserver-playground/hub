name: eden
services:
  eden:
    image: ghcr.io/linuxserver-playground/eden:latest
    container_name: eden
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/eden/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Eden desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: Eden desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: eden
  author: LinuxServer.io
  developer: Eden
  category: Games
  description:
    en_us: Eden is an experimental open-source emulator for the Nintendo Switch, built with performance and stability in mind.
  tagline:
    en_us: Eden is an experimental open-source emulator for the Nintendo Switch, built with performance and stability in mind
  title:
    en_us: Eden
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/eden-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/eden-logo.png
  store_app_id: eden
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-eden/builds/v0.2.1-ls9/amd64/screenshot.png
  port_map: '3000'
