name: dokuwiki
services:
  dokuwiki:
    image: ghcr.io/linuxserver-playground/dokuwiki:latest
    container_name: dokuwiki
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/dokuwiki/config:/config
    ports:
    - 80:80
    - 443:443
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '80'
        description:
          en_us: Application HTTP Port
      - container: '443'
        description:
          en_us: '#optional Application HTTPS Port'
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: dokuwiki
  author: LinuxServer.io
  developer: Dokuwiki
  category: Content Management
  description:
    en_us: Dokuwiki is a simple to use and highly versatile Open Source wiki software that doesn't require a database. It is loved by users for its clean and readable syntax. The ease of maintenance, backup and integration makes it an administrator's favorite. Built in access controls and authentication connectors make DokuWiki especially useful in the enterprise context and the large number of plugins contributed by its vibrant community allow for a broad range of use cases beyond a traditional wiki.
  tagline:
    en_us: Dokuwiki is a simple to use and highly versatile Open Source wiki software that doesn't require a database
  title:
    en_us: Dokuwiki
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dokuwiki-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dokuwiki-icon.png
  store_app_id: dokuwiki
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-dokuwiki/builds/2026-07-14c-ls6/amd64/screenshot.png
  port_map: '80'
