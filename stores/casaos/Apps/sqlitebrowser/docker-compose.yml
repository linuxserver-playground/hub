name: sqlitebrowser
services:
  sqlitebrowser:
    image: ghcr.io/linuxserver-playground/sqlitebrowser:latest
    container_name: sqlitebrowser
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/sqlitebrowser/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Sqlitebrowser desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Sqlitebrowser desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and potentially dump files.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: sqlitebrowser
  author: LinuxServer.io
  developer: Sqlitebrowser
  category: Databases
  description:
    en_us: DB Browser for SQLite is a high quality, visual, open source tool to create, design, and edit database files compatible with SQLite.
  tagline:
    en_us: DB Browser for SQLite is a high quality, visual, open source tool to create, design, and edit database files compatible with SQLite
  title:
    en_us: Sqlitebrowser
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sqlitebrowser-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sqlitebrowser-banner.png
  store_app_id: sqlitebrowser
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-sqlitebrowser/builds/3.13.1-r1-ls6/amd64/screenshot.png
  port_map: '3000'
