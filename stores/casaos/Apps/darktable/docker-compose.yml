name: darktable
services:
  darktable:
    image: ghcr.io/linuxserver-playground/darktable:latest
    container_name: darktable
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/darktable/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Darktable desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Darktable desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and images
x-casaos:
  architectures:
  - amd64
  - arm64
  main: darktable
  author: LinuxServer.io
  developer: Darktable
  category: Photos
  description:
    en_us: darktable is an open source photography workflow application and raw developer. A virtual lighttable and darkroom for photographers. It manages your digital negatives in a database, lets you view them through a zoomable lighttable and enables you to develop raw images and enhance them.
  tagline:
    en_us: darktable is an open source photography workflow application and raw developer
  title:
    en_us: Darktable
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/darktable-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/darktable-logo.png
  store_app_id: darktable
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-darktable/builds/5.6.2-1-ls7/amd64/screenshot.png
  port_map: '3000'
