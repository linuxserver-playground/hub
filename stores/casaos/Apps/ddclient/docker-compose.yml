name: ddclient
services:
  ddclient:
    image: ghcr.io/linuxserver-playground/ddclient:latest
    container_name: ddclient
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/ddclient/config:/config
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports: []
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: ddclient
  author: LinuxServer.io
  developer: Ddclient
  category: Network
  description:
    en_us: Ddclient is a Perl client used to update dynamic DNS entries for accounts on Dynamic DNS Network Service Provider. It was originally written by Paul Burry and is now mostly by wimpunk. It has the capability to update more than just dyndns and it can fetch your WAN-ipaddress in a few different ways.
  tagline:
    en_us: Ddclient is a Perl client used to update dynamic DNS entries for accounts on Dynamic DNS Network Service Provider
  title:
    en_us: Ddclient
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ddclient-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ddclient-logo.png
  store_app_id: ddclient
  index: /
  scheme: http
