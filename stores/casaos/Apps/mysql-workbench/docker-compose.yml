name: mysql-workbench
services:
  mysql-workbench:
    image: ghcr.io/linuxserver-playground/mysql-workbench:latest
    container_name: mysql-workbench
    restart: unless-stopped
    cap_add:
    - IPC_LOCK
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/mysql-workbench/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Mysql Workbench desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Mysql Workbench desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings.
x-casaos:
  architectures:
  - amd64
  main: mysql-workbench
  author: LinuxServer.io
  developer: Mysql-workbench
  category: Databases
  description:
    en_us: MySQL Workbench is a unified visual tool for database architects, developers, and DBAs. MySQL Workbench provides data modeling, SQL development, and comprehensive administration tools for server configuration, user administration, backup, and much more.
  tagline:
    en_us: MySQL Workbench is a unified visual tool for database architects, developers, and DBAs
  title:
    en_us: Mysql-workbench
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mysql-workbench-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mysql-workbench-icon.png
  store_app_id: mysql-workbench
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-mysql-workbench/builds/8.0.47-ls7/amd64/screenshot.png
  port_map: '3000'
