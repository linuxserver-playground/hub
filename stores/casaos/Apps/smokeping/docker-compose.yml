name: smokeping
services:
  smokeping:
    image: ghcr.io/linuxserver-playground/smokeping:latest
    container_name: smokeping
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - MASTER_URL=http://<master-host-ip>:80/smokeping/
    - SHARED_SECRET=password
    - CACHE_DIR=/tmp
    volumes:
    - /DATA/AppData/smokeping/config:/config
    - /DATA/AppData/smokeping/data:/data
    ports:
    - 80:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: MASTER_URL
        description:
          en_us: Specify the master url to connect to. Used when in slave mode.
      - container: SHARED_SECRET
        description:
          en_us: Specify the master shared secret for this host. Used when in slave mode.
      - container: CACHE_DIR
        description:
          en_us: Specify the cache directory for this host. Used when in slave mode.
      ports:
      - container: '80'
        description:
          en_us: Allows HTTP access to the internal webserver.
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
      - container: /data
        description:
          en_us: Storage location for db and application data (graphs etc)
x-casaos:
  architectures:
  - amd64
  - arm64
  main: smokeping
  author: LinuxServer.io
  developer: Smokeping
  category: Monitoring
  description:
    en_us: Smokeping keeps track of your network latency. For a full example of what this application is capable of visit UCDavis.
  tagline:
    en_us: Smokeping keeps track of your network latency
  title:
    en_us: Smokeping
  icon: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/smokeping-logo.png
  thumbnail: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/smokeping-logo.png
  store_app_id: smokeping
  index: /smokeping/smokeping.cgi
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-smokeping/builds/2.9.0-r0-ls8/amd64/screenshot.png
  port_map: '80'
