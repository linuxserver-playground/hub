name: shotcut
services:
  shotcut:
    image: ghcr.io/linuxserver-playground/shotcut:latest
    container_name: shotcut
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/shotcut/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Shotcut desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Shotcut desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Where Shotcut should store its config.
x-casaos:
  architectures:
  - amd64
  main: shotcut
  author: LinuxServer.io
  developer: Shotcut
  category: Video Editor
  description:
    en_us: Shotcut is a free, open source, cross-platform video editor.
  tagline:
    en_us: Shotcut is a free, open source, cross-platform video editor
  title:
    en_us: Shotcut
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shotcut-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/shotcut-logo.png
  store_app_id: shotcut
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-shotcut/builds/v26.9.27-ls10/amd64/screenshot.png
  port_map: '3000'
