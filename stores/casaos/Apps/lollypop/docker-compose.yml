name: lollypop
services:
  lollypop:
    image: ghcr.io/linuxserver-playground/lollypop:latest
    container_name: lollypop
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/lollypop/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Lollypop desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Lollypop desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores settings and downloaded metadata for music.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: lollypop
  author: LinuxServer.io
  developer: Lollypop
  category: Music
  description:
    en_us: Lollypop is a lightweight modern music player designed to work excellently on the GNOME desktop environment.
  tagline:
    en_us: Lollypop is a lightweight modern music player designed to work excellently on the GNOME desktop environment
  title:
    en_us: Lollypop
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lollypop-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lollypop-icon.png
  store_app_id: lollypop
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-lollypop/builds/1.4.45-r1-ls6/amd64/screenshot.png
  port_map: '3000'
