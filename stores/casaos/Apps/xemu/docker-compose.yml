name: xemu
services:
  xemu:
    image: ghcr.io/linuxserver-playground/xemu:latest
    container_name: xemu
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/xemu/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HTTP xemu desktop gui must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS xemu desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: xemu
  author: LinuxServer.io
  developer: Xemu
  category: Games
  description:
    en_us: xemu is a free and open-source application that emulates the original Microsoft Xbox game console, enabling people to play their original Xbox games on Windows, macOS, and Linux systems.
  tagline:
    en_us: xemu is a free and open-source application that emulates the original Microsoft Xbox game console, enabling people to play their original Xbox games on Windows, macOS, and Linux systems
  title:
    en_us: Xemu
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xemu-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/xemu-logo.png
  store_app_id: xemu
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-xemu/builds/v0.8.134-ls8/amd64/screenshot.png
  port_map: '3000'
