name: pycharm
services:
  pycharm:
    image: ghcr.io/linuxserver-playground/pycharm:latest
    container_name: pycharm
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/pycharm/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: PyCharm desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: PyCharm desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: pycharm
  author: LinuxServer.io
  developer: Pycharm
  category: Programming
  description:
    en_us: PyCharm offers out-of-the-box support for Python, databases, Jupyter, Git, Conda, PyTorch, TensorFlow, Hugging Face, Django, Flask, FastAPI, and more.
  tagline:
    en_us: PyCharm offers out-of-the-box support for Python, databases, Jupyter, Git, Conda, PyTorch, TensorFlow, Hugging Face, Django, Flask, FastAPI, and more
  title:
    en_us: Pycharm
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pycharm-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pycharm-logo.png
  store_app_id: pycharm
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-pycharm/builds/2026.3-ls10/amd64/screenshot.png
  port_map: '3000'
