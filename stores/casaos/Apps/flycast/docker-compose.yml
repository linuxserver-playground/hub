name: flycast
services:
  flycast:
    image: ghcr.io/linuxserver-playground/flycast:latest
    container_name: flycast
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/flycast/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HTTP Flycast desktop gui must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS Flycast desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: flycast
  author: LinuxServer.io
  developer: Flycast
  category: Games
  description:
    en_us: Flycast is a multi-platform Sega Dreamcast, Naomi, Naomi 2, and Atomiswave emulator derived from reicast.
  tagline:
    en_us: Flycast is a multi-platform Sega Dreamcast, Naomi, Naomi 2, and Atomiswave emulator derived from reicast
  title:
    en_us: Flycast
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/flycast-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/flycast-logo.png
  store_app_id: flycast
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-flycast/builds/v2.7-ls9/amd64/screenshot.png
  port_map: '3000'
