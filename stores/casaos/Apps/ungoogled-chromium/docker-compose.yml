name: ungoogled-chromium
services:
  ungoogled-chromium:
    image: ghcr.io/linuxserver-playground/ungoogled-chromium:latest
    container_name: ungoogled-chromium
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - CHROME_CLI=https://www.linuxserver.io/
    volumes:
    - /DATA/AppData/ungoogled-chromium/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: CHROME_CLI
        description:
          en_us: Specify one or multiple Chromium CLI flags, this string will be passed to the application in full.
      ports:
      - container: '3000'
        description:
          en_us: HTTP Ungoogled Chromium desktop gui, must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS Ungoogled Chromium desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: ungoogled-chromium
  author: LinuxServer.io
  developer: Ungoogled-chromium
  category: Web Browser
  description:
    en_us: Ungoogled Chromium is Google Chromium, sans dependency on Google web services.
  tagline:
    en_us: Ungoogled Chromium is Google Chromium, sans dependency on Google web services
  title:
    en_us: Ungoogled-chromium
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ungoogled-chromium-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ungoogled-chromium-logo.png
  store_app_id: ungoogled-chromium
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-ungoogled-chromium/builds/156.0.8078.79-1-ls8/amd64/screenshot.png
  port_map: '3000'
