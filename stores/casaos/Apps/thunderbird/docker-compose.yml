name: thunderbird
services:
  thunderbird:
    image: ghcr.io/linuxserver-playground/thunderbird:latest
    container_name: thunderbird
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/thunderbird/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Thunderbird desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: Thunderbird desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and files.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: thunderbird
  author: LinuxServer.io
  developer: Thunderbird
  category: Email
  description:
    en_us: Thunderbird is a free and open-source personal information manager primarily used as an e-mail client with a calendar and contactbook, as well as an RSS feed reader, chat client, and news client.
  tagline:
    en_us: Thunderbird is a free and open-source personal information manager primarily used as an e-mail client with a calendar and contactbook, as well as an RSS feed reader, chat client, and news client
  title:
    en_us: Thunderbird
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/thunderbird-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/thunderbird-logo.png
  store_app_id: thunderbird
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-thunderbird/builds/1140.17.0build3-0ubuntu0.24.04.1mt1-ls8/amd64/screenshot.png
  port_map: '3000'
