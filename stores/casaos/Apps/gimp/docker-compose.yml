name: gimp
services:
  gimp:
    image: ghcr.io/linuxserver-playground/gimp:latest
    container_name: gimp
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/gimp/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: GIMP desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: GIMP desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: gimp
  author: LinuxServer.io
  developer: Gimp
  category: Image Editor
  description:
    en_us: GIMP is a free and open-source raster graphics editor used for image manipulation (retouching) and image editing, free-form drawing, transcoding between different image file formats, and more specialized tasks. It is extensible by means of plugins, and scriptable.
  tagline:
    en_us: GIMP is a free and open-source raster graphics editor used for image manipulation (retouching) and image editing, free-form drawing, transcoding between different image file formats, and more specialized tasks
  title:
    en_us: Gimp
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/gimp-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/gimp-logo.png
  store_app_id: gimp
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-gimp/builds/9d573b95-ls3/amd64/screenshot.png
  port_map: '3000'
