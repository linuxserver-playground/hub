name: jellyfin
services:
  jellyfin:
    image: ghcr.io/linuxserver-playground/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - JELLYFIN_PublishedServerUrl=http://192.168.0.5
    volumes:
    - /DATA/AppData/jellyfin/config:/config
    - /DATA/AppData/jellyfin/data/tvshows:/data/tvshows
    - /DATA/AppData/jellyfin/data/movies:/data/movies
    ports:
    - 8096:8096
    - 8920:8920
    - 7359:7359/udp
    - 1900:1900/udp
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: JELLYFIN_PublishedServerUrl
        description:
          en_us: Set the autodiscovery response domain or IP address, include http(s)://.
      ports:
      - container: '8096'
        description:
          en_us: Http webUI.
      - container: '8920'
        description:
          en_us: Optional - Https webUI (you need to set up your own certificate).
      - container: '7359'
        description:
          en_us: Optional - Allows clients to discover Jellyfin on the local network.
      - container: '1900'
        description:
          en_us: Optional - Service discovery used by DNLA and clients.
      volumes:
      - container: /config
        description:
          en_us: Jellyfin data storage location. This can grow very large, 50gb+ is likely for a large collection.
      - container: /data/tvshows
        description:
          en_us: Media goes here. Add as many as needed e.g. /data/movies, /data/tv, etc.
      - container: /data/movies
        description:
          en_us: Media goes here. Add as many as needed e.g. /data/movies, /data/tv, etc.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: jellyfin
  author: LinuxServer.io
  developer: Jellyfin
  category: Media Servers
  description:
    en_us: 'Jellyfin is a Free Software Media System that puts you in control of managing and streaming your media. It is an alternative to the proprietary Emby and Plex, to provide media from a dedicated server to end-user devices via multiple apps. Jellyfin is descended from Emby''s 3.5.2 release and ported to the .NET Core framework to enable full cross-platform support. There are no strings attached, no premium licenses or features, and no hidden agendas: just a team who want to build something better and work together to achieve it.'
  tagline:
    en_us: Jellyfin is a Free Software Media System that puts you in control of managing and streaming your media
  title:
    en_us: Jellyfin
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/jellyfin-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/jellyfin-logo.png
  store_app_id: jellyfin
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-jellyfin/builds/12.4ubu2604-ls6/amd64/screenshot.png
  port_map: '8096'
