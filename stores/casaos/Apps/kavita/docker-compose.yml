name: kavita
services:
  kavita:
    image: ghcr.io/linuxserver-playground/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/kavita/config:/config
    - /DATA/AppData/kavita/data:/data
    ports:
    - 5000:5000
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '5000'
        description:
          en_us: web gui
      volumes:
      - container: /config
        description:
          en_us: Contains all relevant configuration files.
      - container: /data
        description:
          en_us: Media library containing manga, comics and books.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: kavita
  author: LinuxServer.io
  developer: Kavita
  category: Books
  description:
    en_us: Kavita is a fast, feature rich, cross platform reading server. Built with a focus for being a full solution for all your reading needs. Setup your own server and share your reading collection with your friends and family!
  tagline:
    en_us: Kavita is a fast, feature rich, cross platform reading server
  title:
    en_us: Kavita
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kavita-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kavita-logo.png
  store_app_id: kavita
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-kavita/builds/v0.9.1.4-ls7/amd64/screenshot.png
  port_map: '5000'
