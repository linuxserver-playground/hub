name: keepassxc
services:
  keepassxc:
    image: ghcr.io/linuxserver-playground/keepassxc:latest
    container_name: keepassxc
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/keepassxc/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: KeePassXC desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: KeePassXC desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: keepassxc
  author: LinuxServer.io
  developer: Keepassxc
  category: Password Manager
  description:
    en_us: KeePassXC is a free and open-source password manager. It started as a community fork of KeePassX (itself a cross-platform port of KeePass).
  tagline:
    en_us: KeePassXC is a free and open-source password manager
  title:
    en_us: Keepassxc
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/keepassxc-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/keepassxc-logo.png
  store_app_id: keepassxc
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-keepassxc/builds/2.7.12-r1-ls7/amd64/screenshot.png
  port_map: '3000'
