name: code-server
services:
  code-server:
    image: ghcr.io/linuxserver-playground/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - PASSWORD=password
    - HASHED_PASSWORD=
    - SUDO_PASSWORD=password
    - SUDO_PASSWORD_HASH=
    - PROXY_DOMAIN=code-server.my.domain
    - DEFAULT_WORKSPACE=/config/workspace
    - PWA_APPNAME=code-server
    volumes:
    - /DATA/AppData/code-server/config:/config
    ports:
    - 8443:8443
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: PASSWORD
        description:
          en_us: Optional web gui password, if PASSWORD or HASHEDPASSWORD is not provided, there will be no auth.
      - container: HASHED_PASSWORD
        description:
          en_us: Optional web gui password, overrides PASSWORD, instructions on how to create it is below.
      - container: SUDO_PASSWORD
        description:
          en_us: If this optional variable is set, user will have sudo access in the code-server terminal with the specified password.
      - container: SUDO_PASSWORD_HASH
        description:
          en_us: Optionally set sudo password via hash (takes priority over SUDOPASSWORD var). Format is $type$salt$hashed.
      - container: PROXY_DOMAIN
        description:
          en_us: If this optional variable is set, this domain will be proxied for subdomain proxying. See Documentation
      - container: DEFAULT_WORKSPACE
        description:
          en_us: If this optional variable is set, code-server will open this directory by default
      - container: PWA_APPNAME
        description:
          en_us: If this optional variable is set, the PWA app will the specified name.
      ports:
      - container: '8443'
        description:
          en_us: web gui
      volumes:
      - container: /config
        description:
          en_us: Contains all relevant configuration files.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: code-server
  author: LinuxServer.io
  developer: Code-server
  category: Programming
  description:
    en_us: Code-server is VS Code running on a remote server, accessible through the browser. - Code on your Chromebook, tablet, and laptop with a consistent dev environment. - If you have a Windows or Mac workstation, more easily develop for Linux. - Take advantage of large cloud servers to speed up tests, compilations, downloads, and more. - Preserve battery life when you're on the go. - All intensive computation runs on your server. - You're no longer running excess instances of Chrome.
  tagline:
    en_us: Code-server is VS Code running on a remote server, accessible through the browser
  title:
    en_us: Code-server
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/code-server-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/code-server-banner.png
  store_app_id: code-server
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-code-server/builds/4.145.2-ls8/amd64/screenshot.png
  port_map: '8443'
