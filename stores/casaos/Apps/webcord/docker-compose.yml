name: webcord
services:
  webcord:
    image: ghcr.io/linuxserver-playground/webcord:latest
    container_name: webcord
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/webcord/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: WebCord desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: WebCord desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: webcord
  author: LinuxServer.io
  developer: Webcord
  category: Chat
  description:
    en_us: WebCord can be summarized as a pack of security and privacy hardenings, Discord features reimplementations, Electron / Chromium / Discord bugs workarounds, stylesheets, internal pages and wrapped https://discord.com page, designed to conform with ToS as much as it is possible (or hide the changes that might violate it from Discord's eyes).
  tagline:
    en_us: WebCord can be summarized as a pack of security and privacy hardenings, Discord features reimplementations, Electron / Chromium / Discord bugs workarounds, stylesheets, internal pages and wrapped https://discord.com page, designed to conform with ToS as much as it is possible (or hide the changes that might violate it from Discord's eyes)
  title:
    en_us: Webcord
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webcord-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webcord-icon.png
  store_app_id: webcord
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-webcord/builds/v4.14.0-ls6/amd64/screenshot.png
  port_map: '3000'
