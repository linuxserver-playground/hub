name: vlc
services:
  vlc:
    image: ghcr.io/linuxserver-playground/vlc:latest
    container_name: vlc
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - VLC_CLI=--no-qt-minimal-view
    volumes:
    - /DATA/AppData/vlc/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: VLC_CLI
        description:
          en_us: Specify one or multiple VLC CLI flags, this string will be passed to the application in full.
      ports:
      - container: '3000'
        description:
          en_us: VLC Media Player desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: VLC Media Player desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: vlc
  author: LinuxServer.io
  developer: Vlc
  category: Media Management
  description:
    en_us: VLC Media Player is a free and open source cross-platform multimedia player and framework that delivers dependable performance across multiple devices.
  tagline:
    en_us: VLC Media Player is a free and open source cross-platform multimedia player and framework that delivers dependable performance across multiple devices
  title:
    en_us: Vlc
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vlc-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vlc-logo.png
  store_app_id: vlc
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-vlc/builds/3.0.24-ls7/amd64/screenshot.png
  port_map: '3000'
