name: wireguard
services:
  wireguard:
    image: ghcr.io/linuxserver-playground/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - SERVERURL=wireguard.domain.com
    - SERVERPORT=51820
    - PEERS=1
    - PEERDNS=auto
    - INTERNAL_SUBNET=10.13.13.0
    - ALLOWEDIPS=0.0.0.0/0
    - PERSISTENTKEEPALIVE_PEERS=
    - LOG_CONFS=true
    volumes:
    - /DATA/AppData/wireguard/config:/config
    - /DATA/AppData/wireguard/lib/modules:/lib/modules
    ports:
    - 51820:51820/udp
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: SERVERURL
        description:
          en_us: External IP or domain name for docker host. Used in server mode. If set to auto, the container will try to determine and set the external IP automatically
      - container: SERVERPORT
        description:
          en_us: External port for docker host. Used in server mode.
      - container: PEERS
        description:
          en_us: 'Number of peers to create confs for. Required for server mode. Can also be a list of names: myPC,myPhone,myTablet (alphanumeric only)'
      - container: PEERDNS
        description:
          en_us: DNS server set in peer/client configs (can be set as 8.8.8.8). Used in server mode. Defaults to auto, which uses wireguard docker host's DNS via included CoreDNS forward.
      - container: INTERNAL_SUBNET
        description:
          en_us: Internal subnet for the wireguard and server and peers (only change if it clashes). Used in server mode.
      - container: ALLOWEDIPS
        description:
          en_us: 'The IPs/Ranges that the peers will be able to reach using the VPN connection. If not specified the default value is: ''0.0.0.0/0, ::0/0'' This will cause ALL traffic to route through the VPN, if you want split tunneling, set this to only the IPs you would like to use the tunnel AND the ip of the server''s WG ip, such as 10.13.13.1.'
      - container: PERSISTENTKEEPALIVE_PEERS
        description:
          en_us: Set to all or a list of comma separated peers (ie. 1,4,laptop) for the wireguard server to send keepalive packets to listed peers every 25 seconds. Useful if server is accessed via domain name and has dynamic IP. Used only in server mode.
      - container: LOG_CONFS
        description:
          en_us: Generated QR codes will be displayed in the docker log. Set to false to skip log output.
      ports:
      - container: '51820'
        description:
          en_us: wireguard port
      volumes:
      - container: /config
        description:
          en_us: Contains all relevant configuration files.
      - container: /lib/modules
        description:
          en_us: Path to host kernel module for situations where it's not already loaded.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: wireguard
  author: LinuxServer.io
  developer: Wireguard
  category: Network
  description:
    en_us: WireGuard® is an extremely simple yet fast and modern VPN that utilizes state-of-the-art cryptography. It aims to be faster, simpler, leaner, and more useful than IPsec, while avoiding the massive headache. It intends to be considerably more performant than OpenVPN. WireGuard is designed as a general purpose VPN for running on embedded interfaces and super computers alike, fit for many different circumstances. Initially released for the Linux kernel, it is now cross-platform (Windows, macOS, BSD, iOS, Android) and widely deployable. It is currently under heavy development, but already it might be regarded as the most secure, easiest to use, and simplest VPN solution in the industry.
  tagline:
    en_us: WireGuard® is an extremely simple yet fast and modern VPN that utilizes state-of-the-art cryptography
  title:
    en_us: Wireguard
  icon: https://www.wireguard.com/img/wireguard.svg
  thumbnail: https://www.wireguard.com/img/wireguard.svg
  store_app_id: wireguard
  index: /
  scheme: http
  port_map: '51820'
