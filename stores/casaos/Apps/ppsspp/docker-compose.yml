name: ppsspp
services:
  ppsspp:
    image: ghcr.io/linuxserver-playground/ppsspp:latest
    container_name: ppsspp
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/ppsspp/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: PPSSPP desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: PPSSPP desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  main: ppsspp
  author: LinuxServer.io
  developer: Ppsspp
  category: Games
  description:
    en_us: PPSSPP is a free and open-source PSP emulator for Windows, macOS, Linux, iOS, Android, Nintendo Wii U, Nintendo Switch, BlackBerry 10, MeeGo, Pandora, Xbox Series and Symbian with a focus on speed and portability.
  tagline:
    en_us: PPSSPP is a free and open-source PSP emulator for Windows, macOS, Linux, iOS, Android, Nintendo Wii U, Nintendo Switch, BlackBerry 10, MeeGo, Pandora, Xbox Series and Symbian with a focus on speed and portability
  title:
    en_us: Ppsspp
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ppsspp-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ppsspp-logo.png
  store_app_id: ppsspp
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-ppsspp/builds/1.20.4-4-ls9/amd64/screenshot.png
  port_map: '3000'
