name: onlyoffice
services:
  onlyoffice:
    image: ghcr.io/linuxserver-playground/onlyoffice:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/onlyoffice/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: ONLYOFFICE desktop gui, must be proxied.
      - container: '3001'
        description:
          en_us: ONLYOFFICE desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and documents
x-casaos:
  architectures:
  - amd64
  main: onlyoffice
  author: LinuxServer.io
  developer: Onlyoffice
  category: Documents
  description:
    en_us: ONLYOFFICE provides a full range of tools to create, edit and collaborate on text documents, spreadsheets, presentations, PDF forms and regular PDF files on web, desktop and mobile platforms.
  tagline:
    en_us: ONLYOFFICE provides a full range of tools to create, edit and collaborate on text documents, spreadsheets, presentations, PDF forms and regular PDF files on web, desktop and mobile platforms
  title:
    en_us: Onlyoffice
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/onlyoffice-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/onlyoffice-logo.png
  store_app_id: onlyoffice
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-onlyoffice/builds/v10.0.0-ls6/amd64/screenshot.png
  port_map: '3000'
