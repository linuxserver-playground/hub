name: gzdoom
services:
  gzdoom:
    image: ghcr.io/linuxserver-playground/gzdoom:latest
    container_name: gzdoom
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/gzdoom/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HTTP GZDoom desktop gui must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS GZDoom desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: gzdoom
  author: LinuxServer.io
  developer: Gzdoom
  category: Games
  description:
    en_us: GZDoom is a feature centric port for all Doom engine games, based on ZDoom, adding an OpenGL renderer and powerful scripting capabilities.
  tagline:
    en_us: GZDoom is a feature centric port for all Doom engine games, based on ZDoom, adding an OpenGL renderer and powerful scripting capabilities
  title:
    en_us: Gzdoom
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/gzdoom-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/gzdoom-logo.png
  store_app_id: gzdoom
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-gzdoom/builds/g4.14.2-ls7/amd64/screenshot.png
  port_map: '3000'
