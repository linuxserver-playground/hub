name: freshrss
services:
  freshrss:
    image: ghcr.io/linuxserver-playground/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/freshrss/config:/config
    ports:
    - 80:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '80'
        description:
          en_us: WebUI
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: freshrss
  author: LinuxServer.io
  developer: Freshrss
  category: RSS
  description:
    en_us: Freshrss is a free, self-hostable aggregator for rss feeds.
  tagline:
    en_us: Freshrss is a free, self-hostable aggregator for rss feeds
  title:
    en_us: Freshrss
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/freshrss-banner.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/freshrss-banner.png
  store_app_id: freshrss
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-freshrss/builds/1.30.4-ls7/amd64/screenshot.png
  port_map: '80'
