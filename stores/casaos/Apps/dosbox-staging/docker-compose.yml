name: dosbox-staging
services:
  dosbox-staging:
    image: ghcr.io/linuxserver-playground/dosbox-staging:latest
    container_name: dosbox-staging
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/dosbox-staging/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: DOSBox Staging desktop gui HTTP, must be proxied.
      - container: '3001'
        description:
          en_us: DOSBox Staging desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores program settings and files.
x-casaos:
  architectures:
  - amd64
  main: dosbox-staging
  author: LinuxServer.io
  developer: Dosbox-staging
  category: Games
  description:
    en_us: DOSBox Staging is a modern continuation of DOSBox a free and open-source emulator that enables the execution of MS-DOS software, especially video games.
  tagline:
    en_us: DOSBox Staging is a modern continuation of DOSBox a free and open-source emulator that enables the execution of MS-DOS software, especially video games
  title:
    en_us: Dosbox-staging
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dosbox-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dosbox-logo.png
  store_app_id: dosbox-staging
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-dosbox-staging/builds/v0.83.0-ls9/amd64/screenshot.png
  port_map: '3000'
