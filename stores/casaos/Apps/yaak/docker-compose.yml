name: yaak
services:
  yaak:
    image: ghcr.io/linuxserver-playground/yaak:latest
    container_name: yaak
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/yaak/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Yaak desktop gui (for reverse proxy only).
      - container: '3001'
        description:
          en_us: Yaak desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Where yaak should store its config and data.
x-casaos:
  architectures:
  - amd64
  main: yaak
  author: LinuxServer.io
  developer: Yaak
  category: Programming
  description:
    en_us: Yaak is a desktop API client for organizing and executing REST, GraphQL, and gRPC requests. It's built using Tauri, Rust, and ReactJS.
  tagline:
    en_us: Yaak is a desktop API client for organizing and executing REST, GraphQL, and gRPC requests
  title:
    en_us: Yaak
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/yaak-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/yaak-logo.png
  store_app_id: yaak
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-yaak/builds/v2026.9.1-ls7/amd64/screenshot.png
  port_map: '3000'
