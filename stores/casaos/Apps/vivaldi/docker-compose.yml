name: vivaldi
services:
  vivaldi:
    image: ghcr.io/linuxserver-playground/vivaldi:latest
    container_name: vivaldi
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - VIVALDI_CLI=https://www.linuxserver.io/
    volumes:
    - /DATA/AppData/vivaldi/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: VIVALDI_CLI
        description:
          en_us: Specify one or multiple Vivaldi CLI flags, this string will be passed to the application in full.
      ports:
      - container: '3000'
        description:
          en_us: HTTP Vivaldi desktop gui, must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS Vivaldi desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: vivaldi
  author: LinuxServer.io
  developer: Vivaldi
  category: Web Browser
  description:
    en_us: Vivaldi is a Norwegian freeware, cross-platform web browser with a built-in email client developed by Vivaldi Technologies.
  tagline:
    en_us: Vivaldi is a Norwegian freeware, cross-platform web browser with a built-in email client developed by Vivaldi Technologies
  title:
    en_us: Vivaldi
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vivaldi-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vivaldi-logo.png
  store_app_id: vivaldi
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-vivaldi/builds/8.3.4191.30-1-ls7/amd64/screenshot.png
  port_map: '3000'
