name: rpcs3
services:
  rpcs3:
    image: ghcr.io/linuxserver-playground/rpcs3:latest
    container_name: rpcs3
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/rpcs3/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HTTP RPCS3 desktop gui must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS RPCS3 desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: rpcs3
  author: LinuxServer.io
  developer: Rpcs3
  category: Games
  description:
    en_us: RPCS3 is a multi-platform open-source Sony PlayStation 3 emulator and debugger written in C++ for Windows, Linux, macOS and FreeBSD.
  tagline:
    en_us: RPCS3 is a multi-platform open-source Sony PlayStation 3 emulator and debugger written in C++ for Windows, Linux, macOS and FreeBSD
  title:
    en_us: Rpcs3
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/rpcs3-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/rpcs3-logo.png
  store_app_id: rpcs3
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-rpcs3/builds/build-9b8974d32e73c897a5fcd6bdf69413ca7e436b01-ls20/amd64/screenshot.png
  port_map: '3000'
