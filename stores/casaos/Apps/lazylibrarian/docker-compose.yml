name: lazylibrarian
services:
  lazylibrarian:
    image: ghcr.io/linuxserver-playground/lazylibrarian:latest
    container_name: lazylibrarian
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - /DATA/AppData/lazylibrarian/config:/config
    - /DATA/AppData/lazylibrarian/downloads:/downloads
    - /DATA/AppData/lazylibrarian/books:/books
    ports:
    - 5299:5299
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: DOCKER_MODS
        description:
          en_us: Allows additional functionality to be added, e.g. the Calibredb import program (optional, more info below)
      ports:
      - container: '5299'
        description:
          en_us: The port for the LazyLibrarian webinterface
      volumes:
      - container: /config
        description:
          en_us: LazyLibrarian config
      - container: /downloads
        description:
          en_us: Download location
      - container: /books
        description:
          en_us: Books location
x-casaos:
  architectures:
  - amd64
  - arm64
  main: lazylibrarian
  author: LinuxServer.io
  developer: Lazylibrarian
  category: Books
  description:
    en_us: Lazylibrarian is a program to follow authors and grab metadata for all your digital reading needs. It uses a combination of Goodreads Librarything and optionally GoogleBooks as sources for author info and book info. This container is based on the DobyTang fork.
  tagline:
    en_us: Lazylibrarian is a program to follow authors and grab metadata for all your digital reading needs
  title:
    en_us: Lazylibrarian
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lazylibrarian-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lazylibrarian-icon.png
  store_app_id: lazylibrarian
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-lazylibrarian/builds/8b6ba443-ls9/amd64/screenshot.png
  port_map: '5299'
