name: foldingathome
services:
  foldingathome:
    image: ghcr.io/linuxserver-playground/foldingathome:latest
    container_name: foldingathome
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - ACCOUNT_TOKEN=
    - MACHINE_NAME=
    - CLI_ARGS=
    volumes:
    - /DATA/AppData/foldingathome/config:/config
    ports:
    - 7396:7396
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: ACCOUNT_TOKEN
        description:
          en_us: Register for an account on https://app.foldingathome.org and retrieve account token in settings. Required on first start.
      - container: MACHINE_NAME
        description:
          en_us: Assign a friendly name to this instance (no spaces). Required on first start.
      - container: CLI_ARGS
        description:
          en_us: Optionally pass additional cli arguments to fah-client on container start.
      ports:
      - container: '7396'
        description:
          en_us: Folding@home web gui (redirects to https://app.foldingathome.org).
      volumes:
      - container: /config
        description:
          en_us: Where Folding@home should store its database and config.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: foldingathome
  author: LinuxServer.io
  developer: Foldingathome
  category: Science
  description:
    en_us: Folding@home is a distributed computing project for simulating protein dynamics, including the process of protein folding and the movements of proteins implicated in a variety of diseases. It brings together citizen scientists who volunteer to run simulations of protein dynamics on their personal computers. Insights from this data are helping scientists to better understand biology, and providing new opportunities for developing therapeutics.
  tagline:
    en_us: Folding@home is a distributed computing project for simulating protein dynamics, including the process of protein folding and the movements of proteins implicated in a variety of diseases
  title:
    en_us: Foldingathome
  icon: https://foldingathome.org/wp-content/uploads/2016/09/folding-at-home-logo.png
  thumbnail: https://foldingathome.org/wp-content/uploads/2016/09/folding-at-home-logo.png
  store_app_id: foldingathome
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-foldingathome/builds/8.5.6-ls4/amd64/screenshot.png
  port_map: '7396'
