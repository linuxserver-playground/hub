name: resilio-sync
services:
  resilio-sync:
    image: ghcr.io/linuxserver-playground/resilio-sync:latest
    container_name: resilio-sync
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/resilio-sync/config:/config
    - /DATA/AppData/resilio-sync/downloads:/downloads
    - /DATA/AppData/resilio-sync/sync:/sync
    ports:
    - 8888:8888
    - 55555:55555
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '8888'
        description:
          en_us: WebUI
      - container: '55555'
        description:
          en_us: Sync Port.
      volumes:
      - container: /config
        description:
          en_us: Where resilio-sync should store its config file.
      - container: /downloads
        description:
          en_us: Folder for downloads/cache.
      - container: /sync
        description:
          en_us: Sync folders root.
x-casaos:
  architectures:
  - amd64
  - arm64
  main: resilio-sync
  author: LinuxServer.io
  developer: Resilio-sync
  category: Backup
  description:
    en_us: Resilio-sync (formerly BitTorrent Sync) uses the BitTorrent protocol to sync files and folders between all of your devices. There are both free and paid versions, this container supports both. There is an official sync image but we created this one as it supports user mapping to simplify permissions for volumes.
  tagline:
    en_us: Resilio-sync (formerly BitTorrent Sync) uses the BitTorrent protocol to sync files and folders between all of your devices
  title:
    en_us: Resilio-sync
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/resilio-sync-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/resilio-sync-logo.png
  store_app_id: resilio-sync
  index: /gui
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-resilio-sync/builds/3.1.2.1076-1-ls3/amd64/screenshot.png
  port_map: '8888'
