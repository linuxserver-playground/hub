name: bookstack
services:
  bookstack:
    image: ghcr.io/linuxserver-playground/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - APP_URL=
    - APP_KEY=
    - DB_HOST=
    - DB_PORT=3306
    - DB_USERNAME=
    - DB_PASSWORD=
    - DB_DATABASE=
    - QUEUE_CONNECTION=
    volumes:
    - /DATA/AppData/bookstack/config:/config
    ports:
    - 6875:80
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      - container: APP_URL
        description:
          en_us: The protocol, IP/URL, and port that your application will be accessed on (ie. http://192.168.1.1:6875 or https://bookstack.mydomain.com
      - container: APP_KEY
        description:
          en_us: Session encryption key. You will need to generate this with docker run -it --rm --entrypoint /bin/bash lscr.io/linuxserver/bookstack:latest appkey
      - container: DB_HOST
        description:
          en_us: The database instance hostname
      - container: DB_PORT
        description:
          en_us: Database port
      - container: DB_USERNAME
        description:
          en_us: Database user
      - container: DB_PASSWORD
        description:
          en_us: Database password (minimum 4 characters & non-alphanumeric passwords must be properly escaped.)
      - container: DB_DATABASE
        description:
          en_us: Database name
      - container: QUEUE_CONNECTION
        description:
          en_us: Set to database to enable async actions like sending email or triggering webhooks. See documentation.
      ports:
      - container: '80'
        description:
          en_us: http/s web interface.
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
x-casaos:
  architectures:
  - amd64
  - arm64
  main: bookstack
  author: LinuxServer.io
  developer: Bookstack
  category: Content Management
  description:
    en_us: Bookstack is a free and open source Wiki designed for creating beautiful documentation. Featuring a simple, but powerful WYSIWYG editor it allows for teams to create detailed and useful documentation with ease.
  tagline:
    en_us: Bookstack is a free and open source Wiki designed for creating beautiful documentation
  title:
    en_us: Bookstack
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bookstack-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bookstack-logo.png
  store_app_id: bookstack
  index: /
  scheme: http
  port_map: '6875'
