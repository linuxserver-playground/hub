name: duckstation
services:
  duckstation:
    image: ghcr.io/linuxserver-playground/duckstation:latest
    container_name: duckstation
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/duckstation/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: HTTP DuckStation desktop gui must be proxied.
      - container: '3001'
        description:
          en_us: HTTPS DuckStation desktop gui.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: duckstation
  author: LinuxServer.io
  developer: Duckstation
  category: Games
  description:
    en_us: DuckStation is a PS1 Emulator aiming for the best accuracy and game support.
  tagline:
    en_us: DuckStation is a PS1 Emulator aiming for the best accuracy and game support
  title:
    en_us: Duckstation
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/duckstation-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/duckstation-logo.png
  store_app_id: duckstation
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-duckstation/builds/latest-ls8/amd64/screenshot.png
  port_map: '3000'
