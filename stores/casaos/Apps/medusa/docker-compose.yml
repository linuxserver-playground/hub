name: medusa
services:
  medusa:
    image: ghcr.io/linuxserver-playground/medusa:latest
    container_name: medusa
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/medusa/config:/config
    - /DATA/AppData/medusa/downloads:/downloads
    - /DATA/AppData/medusa/tv:/tv
    ports:
    - 8081:8081
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '8081'
        description:
          en_us: The port for the Medusa webui
      volumes:
      - container: /config
        description:
          en_us: Persistent config files
      - container: /downloads
        description:
          en_us: Download location
      - container: /tv
        description:
          en_us: TV Shows location
x-casaos:
  architectures:
  - amd64
  - arm64
  main: medusa
  author: LinuxServer.io
  developer: Medusa
  category: Media Management
  description:
    en_us: Medusa is an automatic Video Library Manager for TV Shows. It watches for new episodes of your favorite shows, and when they are posted it does its magic.
  tagline:
    en_us: Medusa is an automatic Video Library Manager for TV Shows
  title:
    en_us: Medusa
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/medusa-icon.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/medusa-icon.png
  store_app_id: medusa
  index: /
  scheme: http
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-medusa/builds/v1.0.27-ls6/amd64/screenshot.png
  port_map: '8081'
