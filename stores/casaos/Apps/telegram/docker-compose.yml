name: telegram
services:
  telegram:
    image: ghcr.io/linuxserver-playground/telegram:latest
    container_name: telegram
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /DATA/AppData/telegram/config:/config
    ports:
    - 3000:3000
    - 3001:3001
    x-casaos:
      envs:
      - container: PUID
        description:
          en_us: for UserID - see below for explanation
      - container: PGID
        description:
          en_us: for GroupID - see below for explanation
      - container: TZ
        description:
          en_us: specify a timezone to use, see this list.
      ports:
      - container: '3000'
        description:
          en_us: Telegram desktop gui HTTP must be proxied.
      - container: '3001'
        description:
          en_us: Telegram desktop gui HTTPS.
      volumes:
      - container: /config
        description:
          en_us: Users home directory in the container, stores local files and settings
x-casaos:
  architectures:
  - amd64
  - arm64
  main: telegram
  author: LinuxServer.io
  developer: Telegram
  category: Chat
  description:
    en_us: Telegram is a cloud-based mobile and desktop messaging app.
  tagline:
    en_us: Telegram is a cloud-based mobile and desktop messaging app
  title:
    en_us: Telegram
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  store_app_id: telegram
  index: /
  scheme: https
  screenshot_link:
  - https://linuxserver-playground.github.io/docker-telegram/builds/7.4.4-ls12/amd64/screenshot.png
  port_map: '3000'
