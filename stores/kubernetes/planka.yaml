# Planka: generated by the hub from https://github.com/linuxserver-playground/docker-planka/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: planka-env
  labels:
    app.kubernetes.io/name: planka
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  BASE_URL: https://planka.example.com
  DATABASE_URL: postgresql://user:password@planka-db:5432/planka
  DEFAULT_ADMIN_EMAIL: demo@demo.demo
  DEFAULT_ADMIN_USERNAME: demo
  DEFAULT_ADMIN_PASSWORD: demo
  DEFAULT_ADMIN_NAME: Demo User
  SECRET_KEY: notasecretkey
  TRUST_PROXY: 'false'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planka-config
  labels:
    app.kubernetes.io/name: planka
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka
  labels:
    app.kubernetes.io/name: planka
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: planka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planka
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: planka
        image: ghcr.io/linuxserver-playground/planka:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: planka-env
        ports:
        - name: port-1337
          containerPort: 1337
          protocol: TCP
        volumeMounts:
        - name: planka-config
          mountPath: /config
      volumes:
      - name: planka-config
        persistentVolumeClaim:
          claimName: planka-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: planka
  labels:
    app.kubernetes.io/name: planka
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: planka
  ports:
  - name: port-1337
    port: 1337
    targetPort: 1337
    protocol: TCP
