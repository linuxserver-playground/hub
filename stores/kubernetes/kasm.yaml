# Kasm: generated by the hub from https://github.com/linuxserver-playground/docker-kasm/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - privileged: the image asks for --privileged; securityContext.privileged is set below.
#   - security_opt apparmor=rootlesskit: Some hosts require this on top of privileged for namespacing to work properly inside the DinD layer. (map to a seccompProfile or AppArmor annotation).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-env
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  KASM_PORT: '443'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kasm-opt
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasm
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kasm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasm
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: kasm
        image: ghcr.io/linuxserver-playground/kasm:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: kasm-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-443
          containerPort: 443
          protocol: TCP
        volumeMounts:
        - name: kasm-opt
          mountPath: /opt
        securityContext:
          privileged: true
      volumes:
      - name: kasm-opt
        persistentVolumeClaim:
          claimName: kasm-opt
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: kasm
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: kasm
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-443
    port: 443
    targetPort: 443
    protocol: TCP
