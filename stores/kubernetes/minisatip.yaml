# Minisatip: generated by the hub from https://github.com/linuxserver-playground/docker-minisatip/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/dvb: For passing through Tv-cards (needs a device plugin or hostPath; not emitted).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minisatip-env
  labels:
    app.kubernetes.io/name: minisatip
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  RUN_OPTS: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minisatip-config
  labels:
    app.kubernetes.io/name: minisatip
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minisatip
  labels:
    app.kubernetes.io/name: minisatip
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minisatip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minisatip
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: minisatip
        image: ghcr.io/linuxserver-playground/minisatip:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: minisatip-env
        ports:
        - name: port-8875
          containerPort: 8875
          protocol: TCP
        - name: port-554
          containerPort: 554
          protocol: TCP
        - name: port-1900
          containerPort: 1900
          protocol: UDP
        volumeMounts:
        - name: minisatip-config
          mountPath: /config
      volumes:
      - name: minisatip-config
        persistentVolumeClaim:
          claimName: minisatip-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: minisatip
  labels:
    app.kubernetes.io/name: minisatip
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: minisatip
  ports:
  - name: port-8875
    port: 8875
    targetPort: 8875
    protocol: TCP
  - name: port-554
    port: 554
    targetPort: 554
    protocol: TCP
  - name: port-1900
    port: 1900
    targetPort: 1900
    protocol: UDP
