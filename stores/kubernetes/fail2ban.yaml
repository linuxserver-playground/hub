# Fail2ban: generated by the hub from https://github.com/linuxserver-playground/docker-fail2ban/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability NET_ADMIN: Required for fail2ban to be able to modify iptables rules..
#   - capability NET_RAW: Required for fail2ban to be able to bind to any interface & use RAW sockets..
#   - network: host networking is required; hostNetwork is set and no Service is emitted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fail2ban-env
  labels:
    app.kubernetes.io/name: fail2ban
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fail2ban-config
  labels:
    app.kubernetes.io/name: fail2ban
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fail2ban-var-log:ro
  labels:
    app.kubernetes.io/name: fail2ban
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fail2ban
  labels:
    app.kubernetes.io/name: fail2ban
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fail2ban
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fail2ban
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: fail2ban
        image: ghcr.io/linuxserver-playground/fail2ban:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: fail2ban-env
        volumeMounts:
        - name: fail2ban-config
          mountPath: /config
        - name: fail2ban-var-log:ro
          mountPath: /var/log:ro
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
      hostNetwork: true
      volumes:
      - name: fail2ban-config
        persistentVolumeClaim:
          claimName: fail2ban-config
      - name: fail2ban-var-log:ro
        persistentVolumeClaim:
          claimName: fail2ban-var-log:ro
  strategy:
    type: Recreate
