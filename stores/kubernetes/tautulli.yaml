# Tautulli: generated by the hub from https://github.com/linuxserver-playground/docker-tautulli/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tautulli-env
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tautulli-config
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tautulli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tautulli
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: tautulli
        image: ghcr.io/linuxserver-playground/tautulli:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: tautulli-env
        ports:
        - name: port-8181
          containerPort: 8181
          protocol: TCP
        volumeMounts:
        - name: tautulli-config
          mountPath: /config
      volumes:
      - name: tautulli-config
        persistentVolumeClaim:
          claimName: tautulli-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: tautulli
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: tautulli
  ports:
  - name: port-8181
    port: 8181
    targetPort: 8181
    protocol: TCP
