# Piper: generated by the hub from https://github.com/linuxserver-playground/docker-piper/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: piper-env
  labels:
    app.kubernetes.io/name: piper
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  PIPER_VOICE: en_US-lessac-medium
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-config
  labels:
    app.kubernetes.io/name: piper
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  labels:
    app.kubernetes.io/name: piper
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: piper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piper
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: piper
        image: ghcr.io/linuxserver-playground/piper:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: piper-env
        ports:
        - name: port-10200
          containerPort: 10200
          protocol: TCP
        volumeMounts:
        - name: piper-config
          mountPath: /config
      volumes:
      - name: piper-config
        persistentVolumeClaim:
          claimName: piper-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: piper
  labels:
    app.kubernetes.io/name: piper
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: piper
  ports:
  - name: port-10200
    port: 10200
    targetPort: 10200
    protocol: TCP
