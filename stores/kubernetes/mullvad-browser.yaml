# Mullvad-browser: generated by the hub from https://github.com/linuxserver-playground/docker-mullvad-browser/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability NET_ADMIN: Neccessary for Wireguard to create its VPN interface..
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mullvad-browser-env
  labels:
    app.kubernetes.io/name: mullvad-browser
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mullvad-browser-config
  labels:
    app.kubernetes.io/name: mullvad-browser
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mullvad-browser
  labels:
    app.kubernetes.io/name: mullvad-browser
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mullvad-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mullvad-browser
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: mullvad-browser
        image: ghcr.io/linuxserver-playground/mullvad-browser:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: mullvad-browser-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: mullvad-browser-config
          mountPath: /config
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      volumes:
      - name: mullvad-browser-config
        persistentVolumeClaim:
          claimName: mullvad-browser-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: mullvad-browser
  labels:
    app.kubernetes.io/name: mullvad-browser
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: mullvad-browser
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
