# Steam: generated by the hub from https://github.com/linuxserver-playground/docker-steam/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - security_opt seccomp=unconfined: This is needed to allow bwrap to use namespacing for games. (map to a seccompProfile or AppArmor annotation).
#   - security_opt apparmor=unconfined: For Debian/Ubuntu hosts Steam needs elevated perms that AppArmor blocks. (map to a seccompProfile or AppArmor annotation).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: steam-env
  labels:
    app.kubernetes.io/name: steam
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steam-config
  labels:
    app.kubernetes.io/name: steam
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam
  labels:
    app.kubernetes.io/name: steam
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: steam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steam
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: steam
        image: ghcr.io/linuxserver-playground/steam:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: steam-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: steam-config
          mountPath: /config
      volumes:
      - name: steam-config
        persistentVolumeClaim:
          claimName: steam-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: steam
  labels:
    app.kubernetes.io/name: steam
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: steam
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
