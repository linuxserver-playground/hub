# Wireshark: generated by the hub from https://github.com/linuxserver-playground/docker-wireshark/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability NET_ADMIN: Required to allow packet capture..
#   - network: host networking is required; hostNetwork is set and no Service is emitted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireshark-env
  labels:
    app.kubernetes.io/name: wireshark
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireshark-config
  labels:
    app.kubernetes.io/name: wireshark
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireshark
  labels:
    app.kubernetes.io/name: wireshark
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wireshark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wireshark
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: wireshark
        image: ghcr.io/linuxserver-playground/wireshark:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: wireshark-env
        volumeMounts:
        - name: wireshark-config
          mountPath: /config
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      hostNetwork: true
      volumes:
      - name: wireshark-config
        persistentVolumeClaim:
          claimName: wireshark-config
  strategy:
    type: Recreate
