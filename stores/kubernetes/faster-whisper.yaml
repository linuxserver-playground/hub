# Faster-whisper: generated by the hub from https://github.com/linuxserver-playground/docker-faster-whisper/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: faster-whisper-env
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faster-whisper-config
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faster-whisper
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: faster-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faster-whisper
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: faster-whisper
        image: ghcr.io/linuxserver-playground/faster-whisper:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: faster-whisper-env
        ports:
        - name: port-10300
          containerPort: 10300
          protocol: TCP
        volumeMounts:
        - name: faster-whisper-config
          mountPath: /config
      volumes:
      - name: faster-whisper-config
        persistentVolumeClaim:
          claimName: faster-whisper-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: faster-whisper
  labels:
    app.kubernetes.io/name: faster-whisper
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: faster-whisper
  ports:
  - name: port-10300
    port: 10300
    targetPort: 10300
    protocol: TCP
