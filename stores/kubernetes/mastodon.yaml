# Mastodon: generated by the hub from https://github.com/linuxserver-playground/docker-mastodon/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mastodon-env
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  LOCAL_DOMAIN: example.com
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  DB_HOST: db
  DB_USER: mastodon
  DB_NAME: mastodon
  DB_PASS: mastodon
  DB_PORT: '5432'
  ES_ENABLED: 'false'
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ''
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ''
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ''
  SECRET_KEY_BASE: ''
  OTP_SECRET: ''
  VAPID_PRIVATE_KEY: ''
  VAPID_PUBLIC_KEY: ''
  SMTP_SERVER: mail.example.com
  SMTP_PORT: '25'
  SMTP_LOGIN: ''
  SMTP_PASSWORD: ''
  SMTP_FROM_ADDRESS: notifications@example.com
  S3_ENABLED: 'false'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mastodon-config
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastodon
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: mastodon
        image: ghcr.io/linuxserver-playground/mastodon:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: mastodon-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        - name: port-443
          containerPort: 443
          protocol: TCP
        volumeMounts:
        - name: mastodon-config
          mountPath: /config
      volumes:
      - name: mastodon-config
        persistentVolumeClaim:
          claimName: mastodon-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: mastodon
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: mastodon
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
  - name: port-443
    port: 443
    targetPort: 443
    protocol: TCP
