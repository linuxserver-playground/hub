# Calibre: generated by the hub from https://github.com/linuxserver-playground/docker-calibre/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - security_opt seccomp=unconfined: For Docker Engine only, many modern gui apps need this to function as syscalls are unkown to Docker. (map to a seccompProfile or AppArmor annotation).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-env
  labels:
    app.kubernetes.io/name: calibre
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config
  labels:
    app.kubernetes.io/name: calibre
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  labels:
    app.kubernetes.io/name: calibre
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: calibre
        image: ghcr.io/linuxserver-playground/calibre:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: calibre-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        - name: port-8181
          containerPort: 8181
          protocol: TCP
        - name: port-8081
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: calibre-config
          mountPath: /config
      volumes:
      - name: calibre-config
        persistentVolumeClaim:
          claimName: calibre-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: calibre
  labels:
    app.kubernetes.io/name: calibre
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: calibre
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: port-8181
    port: 8181
    targetPort: 8181
    protocol: TCP
  - name: port-8081
    port: 8081
    targetPort: 8081
    protocol: TCP
