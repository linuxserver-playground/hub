# Phpmyadmin: generated by the hub from https://github.com/linuxserver-playground/docker-phpmyadmin/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: phpmyadmin-env
  labels:
    app.kubernetes.io/name: phpmyadmin
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phpmyadmin-config
  labels:
    app.kubernetes.io/name: phpmyadmin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  labels:
    app.kubernetes.io/name: phpmyadmin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phpmyadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phpmyadmin
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: phpmyadmin
        image: ghcr.io/linuxserver-playground/phpmyadmin:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: phpmyadmin-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: phpmyadmin-config
          mountPath: /config
      volumes:
      - name: phpmyadmin-config
        persistentVolumeClaim:
          claimName: phpmyadmin-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  labels:
    app.kubernetes.io/name: phpmyadmin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: phpmyadmin
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
