# Ombi: generated by the hub from https://github.com/linuxserver-playground/docker-ombi/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ombi-env
  labels:
    app.kubernetes.io/name: ombi
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ombi-config
  labels:
    app.kubernetes.io/name: ombi
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ombi
  labels:
    app.kubernetes.io/name: ombi
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ombi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ombi
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: ombi
        image: ghcr.io/linuxserver-playground/ombi:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ombi-env
        ports:
        - name: port-3579
          containerPort: 3579
          protocol: TCP
        volumeMounts:
        - name: ombi-config
          mountPath: /config
      volumes:
      - name: ombi-config
        persistentVolumeClaim:
          claimName: ombi-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ombi
  labels:
    app.kubernetes.io/name: ombi
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: ombi
  ports:
  - name: port-3579
    port: 3579
    targetPort: 3579
    protocol: TCP
