# Apprise-api: generated by the hub from https://github.com/linuxserver-playground/docker-apprise-api/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apprise-api-env
  labels:
    app.kubernetes.io/name: apprise-api
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apprise-api-config
  labels:
    app.kubernetes.io/name: apprise-api
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise-api
  labels:
    app.kubernetes.io/name: apprise-api
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apprise-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apprise-api
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: apprise-api
        image: ghcr.io/linuxserver-playground/apprise-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: apprise-api-env
        ports:
        - name: port-8000
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: apprise-api-config
          mountPath: /config
      volumes:
      - name: apprise-api-config
        persistentVolumeClaim:
          claimName: apprise-api-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: apprise-api
  labels:
    app.kubernetes.io/name: apprise-api
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: apprise-api
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
