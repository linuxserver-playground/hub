# Duplicati: generated by the hub from https://github.com/linuxserver-playground/docker-duplicati/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: duplicati-env
  labels:
    app.kubernetes.io/name: duplicati
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  SETTINGS_ENCRYPTION_KEY: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-config
  labels:
    app.kubernetes.io/name: duplicati
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-backups
  labels:
    app.kubernetes.io/name: duplicati
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-source
  labels:
    app.kubernetes.io/name: duplicati
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicati
  labels:
    app.kubernetes.io/name: duplicati
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: duplicati
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duplicati
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: duplicati
        image: ghcr.io/linuxserver-playground/duplicati:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: duplicati-env
        ports:
        - name: port-8200
          containerPort: 8200
          protocol: TCP
        volumeMounts:
        - name: duplicati-config
          mountPath: /config
        - name: duplicati-backups
          mountPath: /backups
        - name: duplicati-source
          mountPath: /source
      volumes:
      - name: duplicati-config
        persistentVolumeClaim:
          claimName: duplicati-config
      - name: duplicati-backups
        persistentVolumeClaim:
          claimName: duplicati-backups
      - name: duplicati-source
        persistentVolumeClaim:
          claimName: duplicati-source
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: duplicati
  labels:
    app.kubernetes.io/name: duplicati
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: duplicati
  ports:
  - name: port-8200
    port: 8200
    targetPort: 8200
    protocol: TCP
