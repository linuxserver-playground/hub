# Manyfold: generated by the hub from https://github.com/linuxserver-playground/docker-manyfold/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manyfold-env
  labels:
    app.kubernetes.io/name: manyfold
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  DATABASE_URL: ''
  REDIS_URL: ''
  SECRET_KEY_BASE: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manyfold-config
  labels:
    app.kubernetes.io/name: manyfold
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold
  labels:
    app.kubernetes.io/name: manyfold
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: manyfold
        image: ghcr.io/linuxserver-playground/manyfold:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: manyfold-env
        ports:
        - name: port-3214
          containerPort: 3214
          protocol: TCP
        volumeMounts:
        - name: manyfold-config
          mountPath: /config
      volumes:
      - name: manyfold-config
        persistentVolumeClaim:
          claimName: manyfold-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold
  labels:
    app.kubernetes.io/name: manyfold
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: manyfold
  ports:
  - name: port-3214
    port: 3214
    targetPort: 3214
    protocol: TCP
