# Nzbget: generated by the hub from https://github.com/linuxserver-playground/docker-nzbget/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nzbget-env
  labels:
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-config
  labels:
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  labels:
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nzbget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nzbget
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: nzbget
        image: ghcr.io/linuxserver-playground/nzbget:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: nzbget-env
        ports:
        - name: port-6789
          containerPort: 6789
          protocol: TCP
        volumeMounts:
        - name: nzbget-config
          mountPath: /config
      volumes:
      - name: nzbget-config
        persistentVolumeClaim:
          claimName: nzbget-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
  labels:
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: nzbget
  ports:
  - name: port-6789
    port: 6789
    targetPort: 6789
    protocol: TCP
