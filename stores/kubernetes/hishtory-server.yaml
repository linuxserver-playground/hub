# Hishtory-server: generated by the hub from https://github.com/linuxserver-playground/docker-hishtory-server/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hishtory-server-env
  labels:
    app.kubernetes.io/name: hishtory-server
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hishtory-server
  labels:
    app.kubernetes.io/name: hishtory-server
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hishtory-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hishtory-server
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: hishtory-server
        image: ghcr.io/linuxserver-playground/hishtory-server:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: hishtory-server-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: hishtory-server
  labels:
    app.kubernetes.io/name: hishtory-server
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: hishtory-server
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
