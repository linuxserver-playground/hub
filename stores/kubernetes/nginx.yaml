# Nginx: generated by the hub from https://github.com/linuxserver-playground/docker-nginx/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-env
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-config
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: nginx
        image: ghcr.io/linuxserver-playground/nginx:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: nginx-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        - name: port-443
          containerPort: 443
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /config
      volumes:
      - name: nginx-config
        persistentVolumeClaim:
          claimName: nginx-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
  - name: port-443
    port: 443
    targetPort: 443
    protocol: TCP
