# Znc: generated by the hub from https://github.com/linuxserver-playground/docker-znc/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: znc-env
  labels:
    app.kubernetes.io/name: znc
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: znc-config
  labels:
    app.kubernetes.io/name: znc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: znc
  labels:
    app.kubernetes.io/name: znc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: znc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: znc
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: znc
        image: ghcr.io/linuxserver-playground/znc:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: znc-env
        ports:
        - name: port-6501
          containerPort: 6501
          protocol: TCP
        volumeMounts:
        - name: znc-config
          mountPath: /config
      volumes:
      - name: znc-config
        persistentVolumeClaim:
          claimName: znc-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: znc
  labels:
    app.kubernetes.io/name: znc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: znc
  ports:
  - name: port-6501
    port: 6501
    targetPort: 6501
    protocol: TCP
