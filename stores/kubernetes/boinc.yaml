# Boinc: generated by the hub from https://github.com/linuxserver-playground/docker-boinc/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/dri: Only needed if you want to use your Intel GPU (vaapi). (needs a device plugin or hostPath; not emitted).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boinc-env
  labels:
    app.kubernetes.io/name: boinc
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boinc-config
  labels:
    app.kubernetes.io/name: boinc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boinc
  labels:
    app.kubernetes.io/name: boinc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boinc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boinc
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: boinc
        image: ghcr.io/linuxserver-playground/boinc:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: boinc-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        - name: port-8181
          containerPort: 8181
          protocol: TCP
        volumeMounts:
        - name: boinc-config
          mountPath: /config
      volumes:
      - name: boinc-config
        persistentVolumeClaim:
          claimName: boinc-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: boinc
  labels:
    app.kubernetes.io/name: boinc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: boinc
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: port-8181
    port: 8181
    targetPort: 8181
    protocol: TCP
