# Mylar3: generated by the hub from https://github.com/linuxserver-playground/docker-mylar3/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mylar3-env
  labels:
    app.kubernetes.io/name: mylar3
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mylar3-config
  labels:
    app.kubernetes.io/name: mylar3
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mylar3-comics
  labels:
    app.kubernetes.io/name: mylar3
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mylar3-downloads
  labels:
    app.kubernetes.io/name: mylar3
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mylar3
  labels:
    app.kubernetes.io/name: mylar3
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mylar3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mylar3
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: mylar3
        image: ghcr.io/linuxserver-playground/mylar3:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: mylar3-env
        ports:
        - name: port-8090
          containerPort: 8090
          protocol: TCP
        volumeMounts:
        - name: mylar3-config
          mountPath: /config
        - name: mylar3-comics
          mountPath: /comics
        - name: mylar3-downloads
          mountPath: /downloads
      volumes:
      - name: mylar3-config
        persistentVolumeClaim:
          claimName: mylar3-config
      - name: mylar3-comics
        persistentVolumeClaim:
          claimName: mylar3-comics
      - name: mylar3-downloads
        persistentVolumeClaim:
          claimName: mylar3-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: mylar3
  labels:
    app.kubernetes.io/name: mylar3
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: mylar3
  ports:
  - name: port-8090
    port: 8090
    targetPort: 8090
    protocol: TCP
