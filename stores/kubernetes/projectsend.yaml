# Projectsend: generated by the hub from https://github.com/linuxserver-playground/docker-projectsend/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: projectsend-env
  labels:
    app.kubernetes.io/name: projectsend
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: projectsend-config
  labels:
    app.kubernetes.io/name: projectsend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: projectsend-data
  labels:
    app.kubernetes.io/name: projectsend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectsend
  labels:
    app.kubernetes.io/name: projectsend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projectsend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectsend
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: projectsend
        image: ghcr.io/linuxserver-playground/projectsend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: projectsend-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: projectsend-config
          mountPath: /config
        - name: projectsend-data
          mountPath: /data
      volumes:
      - name: projectsend-config
        persistentVolumeClaim:
          claimName: projectsend-config
      - name: projectsend-data
        persistentVolumeClaim:
          claimName: projectsend-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: projectsend
  labels:
    app.kubernetes.io/name: projectsend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: projectsend
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
