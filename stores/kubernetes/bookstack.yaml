# Bookstack: generated by the hub from https://github.com/linuxserver-playground/docker-bookstack/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstack-env
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  APP_URL: ''
  APP_KEY: ''
  DB_HOST: ''
  DB_PORT: '3306'
  DB_USERNAME: ''
  DB_PASSWORD: ''
  DB_DATABASE: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstack-config
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstack
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: bookstack
        image: ghcr.io/linuxserver-playground/bookstack:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: bookstack-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: bookstack-config
          mountPath: /config
      volumes:
      - name: bookstack-config
        persistentVolumeClaim:
          claimName: bookstack-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: bookstack
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: bookstack
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
