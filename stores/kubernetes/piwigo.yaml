# Piwigo: generated by the hub from https://github.com/linuxserver-playground/docker-piwigo/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: piwigo-env
  labels:
    app.kubernetes.io/name: piwigo
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-config
  labels:
    app.kubernetes.io/name: piwigo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-gallery
  labels:
    app.kubernetes.io/name: piwigo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piwigo
  labels:
    app.kubernetes.io/name: piwigo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: piwigo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piwigo
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: piwigo
        image: ghcr.io/linuxserver-playground/piwigo:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: piwigo-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: piwigo-config
          mountPath: /config
        - name: piwigo-gallery
          mountPath: /gallery
      volumes:
      - name: piwigo-config
        persistentVolumeClaim:
          claimName: piwigo-config
      - name: piwigo-gallery
        persistentVolumeClaim:
          claimName: piwigo-gallery
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: piwigo
  labels:
    app.kubernetes.io/name: piwigo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: piwigo
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
