# Airsonic-advanced: generated by the hub from https://github.com/linuxserver-playground/docker-airsonic-advanced/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/snd: Only needed to pass your host sound device to Airsonic's Java jukebox player. (needs a device plugin or hostPath; not emitted).
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airsonic-advanced-env
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airsonic-advanced-config
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airsonic-advanced-music
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airsonic-advanced-playlists
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airsonic-advanced-podcasts
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airsonic-advanced
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airsonic-advanced
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airsonic-advanced
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: airsonic-advanced
        image: ghcr.io/linuxserver-playground/airsonic-advanced:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: airsonic-advanced-env
        ports:
        - name: port-4040
          containerPort: 4040
          protocol: TCP
        volumeMounts:
        - name: airsonic-advanced-config
          mountPath: /config
        - name: airsonic-advanced-music
          mountPath: /music
        - name: airsonic-advanced-playlists
          mountPath: /playlists
        - name: airsonic-advanced-podcasts
          mountPath: /podcasts
      volumes:
      - name: airsonic-advanced-config
        persistentVolumeClaim:
          claimName: airsonic-advanced-config
      - name: airsonic-advanced-music
        persistentVolumeClaim:
          claimName: airsonic-advanced-music
      - name: airsonic-advanced-playlists
        persistentVolumeClaim:
          claimName: airsonic-advanced-playlists
      - name: airsonic-advanced-podcasts
        persistentVolumeClaim:
          claimName: airsonic-advanced-podcasts
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: airsonic-advanced
  labels:
    app.kubernetes.io/name: airsonic-advanced
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: airsonic-advanced
  ports:
  - name: port-4040
    port: 4040
    targetPort: 4040
    protocol: TCP
