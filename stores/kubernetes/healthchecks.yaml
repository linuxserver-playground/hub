# Healthchecks: generated by the hub from https://github.com/linuxserver-playground/docker-healthchecks/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthchecks-env
  labels:
    app.kubernetes.io/name: healthchecks
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  SECRET_KEY: ''
  SITE_ROOT: ''
  SITE_NAME: ''
  SUPERUSER_EMAIL: ''
  SUPERUSER_PASSWORD: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: healthchecks-config
  labels:
    app.kubernetes.io/name: healthchecks
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthchecks
  labels:
    app.kubernetes.io/name: healthchecks
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthchecks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthchecks
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: healthchecks
        image: ghcr.io/linuxserver-playground/healthchecks:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: healthchecks-env
        ports:
        - name: port-8000
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: healthchecks-config
          mountPath: /config
      volumes:
      - name: healthchecks-config
        persistentVolumeClaim:
          claimName: healthchecks-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: healthchecks
  labels:
    app.kubernetes.io/name: healthchecks
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: healthchecks
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
