# Homeassistant: generated by the hub from https://github.com/linuxserver-playground/docker-homeassistant/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/ttyUSB0: For passing through USB, serial or gpio devices. (needs a device plugin or hostPath; not emitted).
#   - network: host networking is required; hostNetwork is set and no Service is emitted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-env
  labels:
    app.kubernetes.io/name: homeassistant
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  labels:
    app.kubernetes.io/name: homeassistant
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homeassistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: homeassistant
        image: ghcr.io/linuxserver-playground/homeassistant:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: homeassistant-env
        volumeMounts:
        - name: homeassistant-config
          mountPath: /config
      hostNetwork: true
      volumes:
      - name: homeassistant-config
        persistentVolumeClaim:
          claimName: homeassistant-config
  strategy:
    type: Recreate
