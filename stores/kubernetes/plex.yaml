# Plex: generated by the hub from https://github.com/linuxserver-playground/docker-plex/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - network: host networking is required; hostNetwork is set and no Service is emitted.
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plex-env
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  VERSION: docker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-tv
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-movies
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: plex
        image: ghcr.io/linuxserver-playground/plex:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: plex-env
        volumeMounts:
        - name: plex-config
          mountPath: /config
        - name: plex-tv
          mountPath: /tv
        - name: plex-movies
          mountPath: /movies
      hostNetwork: true
      volumes:
      - name: plex-config
        persistentVolumeClaim:
          claimName: plex-config
      - name: plex-tv
        persistentVolumeClaim:
          claimName: plex-tv
      - name: plex-movies
        persistentVolumeClaim:
          claimName: plex-movies
  strategy:
    type: Recreate
