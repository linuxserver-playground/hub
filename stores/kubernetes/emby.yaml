# Emby: generated by the hub from https://github.com/linuxserver-playground/docker-emby/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/dri: Only needed if you want to use your Intel or AMD GPU for hardware accelerated video encoding (vaapi). (needs a device plugin or hostPath; not emitted).
#   - device /dev/video10: Only needed if you want to use your Raspberry Pi V4L2 video encoding. (needs a device plugin or hostPath; not emitted).
#   - device /dev/video11: Only needed if you want to use your Raspberry Pi V4L2 video encoding. (needs a device plugin or hostPath; not emitted).
#   - device /dev/video12: Only needed if you want to use your Raspberry Pi V4L2 video encoding. (needs a device plugin or hostPath; not emitted).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emby-env
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-config
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-data-tvshows
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-data-movies
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emby
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emby
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emby
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: emby
        image: ghcr.io/linuxserver-playground/emby:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: emby-env
        ports:
        - name: port-8096
          containerPort: 8096
          protocol: TCP
        volumeMounts:
        - name: emby-config
          mountPath: /config
        - name: emby-data-tvshows
          mountPath: /data/tvshows
        - name: emby-data-movies
          mountPath: /data/movies
      volumes:
      - name: emby-config
        persistentVolumeClaim:
          claimName: emby-config
      - name: emby-data-tvshows
        persistentVolumeClaim:
          claimName: emby-data-tvshows
      - name: emby-data-movies
        persistentVolumeClaim:
          claimName: emby-data-movies
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: emby
  labels:
    app.kubernetes.io/name: emby
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: emby
  ports:
  - name: port-8096
    port: 8096
    targetPort: 8096
    protocol: TCP
