# Xbackbone: generated by the hub from https://github.com/linuxserver-playground/docker-xbackbone/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xbackbone-env
  labels:
    app.kubernetes.io/name: xbackbone
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xbackbone-config
  labels:
    app.kubernetes.io/name: xbackbone
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xbackbone
  labels:
    app.kubernetes.io/name: xbackbone
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xbackbone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xbackbone
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: xbackbone
        image: ghcr.io/linuxserver-playground/xbackbone:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: xbackbone-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        - name: port-443
          containerPort: 443
          protocol: TCP
        volumeMounts:
        - name: xbackbone-config
          mountPath: /config
      volumes:
      - name: xbackbone-config
        persistentVolumeClaim:
          claimName: xbackbone-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: xbackbone
  labels:
    app.kubernetes.io/name: xbackbone
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: xbackbone
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
  - name: port-443
    port: 443
    targetPort: 443
    protocol: TCP
