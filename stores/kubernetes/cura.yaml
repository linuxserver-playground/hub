# Cura: generated by the hub from https://github.com/linuxserver-playground/docker-cura/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cura-env
  labels:
    app.kubernetes.io/name: cura
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cura-config
  labels:
    app.kubernetes.io/name: cura
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cura
  labels:
    app.kubernetes.io/name: cura
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cura
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cura
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: cura
        image: ghcr.io/linuxserver-playground/cura:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: cura-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: cura-config
          mountPath: /config
      volumes:
      - name: cura-config
        persistentVolumeClaim:
          claimName: cura-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: cura
  labels:
    app.kubernetes.io/name: cura
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: cura
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
