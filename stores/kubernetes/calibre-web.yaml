# Calibre-web: generated by the hub from https://github.com/linuxserver-playground/docker-calibre-web/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calibre-web-env
  labels:
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config
  labels:
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-books
  labels:
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: calibre-web
        image: ghcr.io/linuxserver-playground/calibre-web:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: calibre-web-env
        ports:
        - name: port-8083
          containerPort: 8083
          protocol: TCP
        volumeMounts:
        - name: calibre-web-config
          mountPath: /config
        - name: calibre-web-books
          mountPath: /books
      volumes:
      - name: calibre-web-config
        persistentVolumeClaim:
          claimName: calibre-web-config
      - name: calibre-web-books
        persistentVolumeClaim:
          claimName: calibre-web-books
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: calibre-web
  ports:
  - name: port-8083
    port: 8083
    targetPort: 8083
    protocol: TCP
