# Oscam: generated by the hub from https://github.com/linuxserver-playground/docker-oscam/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/ttyUSB0: For passing through smart card readers. (needs a device plugin or hostPath; not emitted).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oscam-env
  labels:
    app.kubernetes.io/name: oscam
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oscam-config
  labels:
    app.kubernetes.io/name: oscam
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oscam
  labels:
    app.kubernetes.io/name: oscam
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oscam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oscam
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: oscam
        image: ghcr.io/linuxserver-playground/oscam:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: oscam-env
        ports:
        - name: port-8888
          containerPort: 8888
          protocol: TCP
        volumeMounts:
        - name: oscam-config
          mountPath: /config
      volumes:
      - name: oscam-config
        persistentVolumeClaim:
          claimName: oscam-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: oscam
  labels:
    app.kubernetes.io/name: oscam
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: oscam
  ports:
  - name: port-8888
    port: 8888
    targetPort: 8888
    protocol: TCP
