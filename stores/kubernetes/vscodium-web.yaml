# Vscodium-web: generated by the hub from https://github.com/linuxserver-playground/docker-vscodium-web/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscodium-web-env
  labels:
    app.kubernetes.io/name: vscodium-web
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vscodium-web-config
  labels:
    app.kubernetes.io/name: vscodium-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscodium-web
  labels:
    app.kubernetes.io/name: vscodium-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vscodium-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vscodium-web
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: vscodium-web
        image: ghcr.io/linuxserver-playground/vscodium-web:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vscodium-web-env
        ports:
        - name: port-8000
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: vscodium-web-config
          mountPath: /config
      volumes:
      - name: vscodium-web-config
        persistentVolumeClaim:
          claimName: vscodium-web-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: vscodium-web
  labels:
    app.kubernetes.io/name: vscodium-web
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: vscodium-web
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
