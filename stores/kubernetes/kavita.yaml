# Kavita: generated by the hub from https://github.com/linuxserver-playground/docker-kavita/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kavita-env
  labels:
    app.kubernetes.io/name: kavita
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config
  labels:
    app.kubernetes.io/name: kavita
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  labels:
    app.kubernetes.io/name: kavita
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kavita
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavita
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: kavita
        image: ghcr.io/linuxserver-playground/kavita:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: kavita-env
        ports:
        - name: port-5000
          containerPort: 5000
          protocol: TCP
        volumeMounts:
        - name: kavita-config
          mountPath: /config
      volumes:
      - name: kavita-config
        persistentVolumeClaim:
          claimName: kavita-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: kavita
  labels:
    app.kubernetes.io/name: kavita
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: kavita
  ports:
  - name: port-5000
    port: 5000
    targetPort: 5000
    protocol: TCP
