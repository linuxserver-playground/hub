# Wikijs: generated by the hub from https://github.com/linuxserver-playground/docker-wikijs/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikijs-env
  labels:
    app.kubernetes.io/name: wikijs
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wikijs-config
  labels:
    app.kubernetes.io/name: wikijs
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wikijs-data
  labels:
    app.kubernetes.io/name: wikijs
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikijs
  labels:
    app.kubernetes.io/name: wikijs
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wikijs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wikijs
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: wikijs
        image: ghcr.io/linuxserver-playground/wikijs:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: wikijs-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: wikijs-config
          mountPath: /config
        - name: wikijs-data
          mountPath: /data
      volumes:
      - name: wikijs-config
        persistentVolumeClaim:
          claimName: wikijs-config
      - name: wikijs-data
        persistentVolumeClaim:
          claimName: wikijs-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: wikijs
  labels:
    app.kubernetes.io/name: wikijs
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: wikijs
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
