# Lychee: generated by the hub from https://github.com/linuxserver-playground/docker-lychee/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lychee-env
  labels:
    app.kubernetes.io/name: lychee
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  DB_CONNECTION: ''
  DB_HOST: ''
  DB_PORT: ''
  DB_USERNAME: ''
  DB_PASSWORD: ''
  DB_DATABASE: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lychee-config
  labels:
    app.kubernetes.io/name: lychee
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lychee-pictures
  labels:
    app.kubernetes.io/name: lychee
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lychee
  labels:
    app.kubernetes.io/name: lychee
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lychee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lychee
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: lychee
        image: ghcr.io/linuxserver-playground/lychee:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: lychee-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: lychee-config
          mountPath: /config
        - name: lychee-pictures
          mountPath: /pictures
      volumes:
      - name: lychee-config
        persistentVolumeClaim:
          claimName: lychee-config
      - name: lychee-pictures
        persistentVolumeClaim:
          claimName: lychee-pictures
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: lychee
  labels:
    app.kubernetes.io/name: lychee
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: lychee
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
