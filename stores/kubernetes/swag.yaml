# Swag: generated by the hub from https://github.com/linuxserver-playground/docker-swag/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability NET_ADMIN: Required for fail2Ban to be able to modify iptables rules..
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swag-env
  labels:
    app.kubernetes.io/name: swag
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  URL: example.com
  VALIDATION: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swag-config
  labels:
    app.kubernetes.io/name: swag
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swag
  labels:
    app.kubernetes.io/name: swag
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swag
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: swag
        image: ghcr.io/linuxserver-playground/swag:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: swag-env
        ports:
        - name: port-443
          containerPort: 443
          protocol: TCP
        volumeMounts:
        - name: swag-config
          mountPath: /config
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      volumes:
      - name: swag-config
        persistentVolumeClaim:
          claimName: swag-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: swag
  labels:
    app.kubernetes.io/name: swag
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: swag
  ports:
  - name: port-443
    port: 443
    targetPort: 443
    protocol: TCP
