# Htpcmanager: generated by the hub from https://github.com/linuxserver-playground/docker-htpcmanager/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: htpcmanager-env
  labels:
    app.kubernetes.io/name: htpcmanager
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: htpcmanager-config
  labels:
    app.kubernetes.io/name: htpcmanager
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: htpcmanager
  labels:
    app.kubernetes.io/name: htpcmanager
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: htpcmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: htpcmanager
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: htpcmanager
        image: ghcr.io/linuxserver-playground/htpcmanager:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: htpcmanager-env
        ports:
        - name: port-8085
          containerPort: 8085
          protocol: TCP
        volumeMounts:
        - name: htpcmanager-config
          mountPath: /config
      volumes:
      - name: htpcmanager-config
        persistentVolumeClaim:
          claimName: htpcmanager-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: htpcmanager
  labels:
    app.kubernetes.io/name: htpcmanager
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: htpcmanager
  ports:
  - name: port-8085
    port: 8085
    targetPort: 8085
    protocol: TCP
