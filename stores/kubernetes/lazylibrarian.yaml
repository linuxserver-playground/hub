# Lazylibrarian: generated by the hub from https://github.com/linuxserver-playground/docker-lazylibrarian/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-env
  labels:
    app.kubernetes.io/name: lazylibrarian
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lazylibrarian-config
  labels:
    app.kubernetes.io/name: lazylibrarian
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lazylibrarian-downloads
  labels:
    app.kubernetes.io/name: lazylibrarian
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
  labels:
    app.kubernetes.io/name: lazylibrarian
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lazylibrarian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lazylibrarian
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: lazylibrarian
        image: ghcr.io/linuxserver-playground/lazylibrarian:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: lazylibrarian-env
        ports:
        - name: port-5299
          containerPort: 5299
          protocol: TCP
        volumeMounts:
        - name: lazylibrarian-config
          mountPath: /config
        - name: lazylibrarian-downloads
          mountPath: /downloads
      volumes:
      - name: lazylibrarian-config
        persistentVolumeClaim:
          claimName: lazylibrarian-config
      - name: lazylibrarian-downloads
        persistentVolumeClaim:
          claimName: lazylibrarian-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: lazylibrarian
  labels:
    app.kubernetes.io/name: lazylibrarian
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: lazylibrarian
  ports:
  - name: port-5299
    port: 5299
    targetPort: 5299
    protocol: TCP
