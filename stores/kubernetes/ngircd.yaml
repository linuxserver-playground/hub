# Ngircd: generated by the hub from https://github.com/linuxserver-playground/docker-ngircd/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ngircd-env
  labels:
    app.kubernetes.io/name: ngircd
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ngircd-config
  labels:
    app.kubernetes.io/name: ngircd
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngircd
  labels:
    app.kubernetes.io/name: ngircd
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ngircd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ngircd
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: ngircd
        image: ghcr.io/linuxserver-playground/ngircd:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ngircd-env
        ports:
        - name: port-6667
          containerPort: 6667
          protocol: TCP
        volumeMounts:
        - name: ngircd-config
          mountPath: /config
      volumes:
      - name: ngircd-config
        persistentVolumeClaim:
          claimName: ngircd-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ngircd
  labels:
    app.kubernetes.io/name: ngircd
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: ngircd
  ports:
  - name: port-6667
    port: 6667
    targetPort: 6667
    protocol: TCP
