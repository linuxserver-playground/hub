# Flexget: generated by the hub from https://github.com/linuxserver-playground/docker-flexget/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flexget-env
  labels:
    app.kubernetes.io/name: flexget
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  FG_LOG_LEVEL: info
  FG_LOG_FILE: /config/flexget.log
  FG_CONFIG_FILE: /config/.flexget/config.yml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flexget-config
  labels:
    app.kubernetes.io/name: flexget
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexget
  labels:
    app.kubernetes.io/name: flexget
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flexget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexget
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: flexget
        image: ghcr.io/linuxserver-playground/flexget:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: flexget-env
        ports:
        - name: port-5050
          containerPort: 5050
          protocol: TCP
        volumeMounts:
        - name: flexget-config
          mountPath: /config
      volumes:
      - name: flexget-config
        persistentVolumeClaim:
          claimName: flexget-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: flexget
  labels:
    app.kubernetes.io/name: flexget
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: flexget
  ports:
  - name: port-5050
    port: 5050
    targetPort: 5050
    protocol: TCP
