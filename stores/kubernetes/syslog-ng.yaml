# Syslog-ng: generated by the hub from https://github.com/linuxserver-playground/docker-syslog-ng/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: syslog-ng-env
  labels:
    app.kubernetes.io/name: syslog-ng
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syslog-ng-config
  labels:
    app.kubernetes.io/name: syslog-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-ng
  labels:
    app.kubernetes.io/name: syslog-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syslog-ng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syslog-ng
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: syslog-ng
        image: ghcr.io/linuxserver-playground/syslog-ng:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: syslog-ng-env
        ports:
        - name: port-5514
          containerPort: 5514
          protocol: UDP
        - name: port-6601
          containerPort: 6601
          protocol: TCP
        - name: port-6514
          containerPort: 6514
          protocol: TCP
        volumeMounts:
        - name: syslog-ng-config
          mountPath: /config
      volumes:
      - name: syslog-ng-config
        persistentVolumeClaim:
          claimName: syslog-ng-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: syslog-ng
  labels:
    app.kubernetes.io/name: syslog-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: syslog-ng
  ports:
  - name: port-5514
    port: 5514
    targetPort: 5514
    protocol: UDP
  - name: port-6601
    port: 6601
    targetPort: 6601
    protocol: TCP
  - name: port-6514
    port: 6514
    targetPort: 6514
    protocol: TCP
