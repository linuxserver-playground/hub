# Syncthing: generated by the hub from https://github.com/linuxserver-playground/docker-syncthing/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: syncthing-env
  labels:
    app.kubernetes.io/name: syncthing
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config
  labels:
    app.kubernetes.io/name: syncthing
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data1
  labels:
    app.kubernetes.io/name: syncthing
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data2
  labels:
    app.kubernetes.io/name: syncthing
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  labels:
    app.kubernetes.io/name: syncthing
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syncthing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syncthing
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: syncthing
        image: ghcr.io/linuxserver-playground/syncthing:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: syncthing-env
        ports:
        - name: port-8384
          containerPort: 8384
          protocol: TCP
        - name: port-22000
          containerPort: 22000
          protocol: TCP
        - name: port-22000
          containerPort: 22000
          protocol: UDP
        - name: port-21027
          containerPort: 21027
          protocol: UDP
        volumeMounts:
        - name: syncthing-config
          mountPath: /config
        - name: syncthing-data1
          mountPath: /data1
        - name: syncthing-data2
          mountPath: /data2
      volumes:
      - name: syncthing-config
        persistentVolumeClaim:
          claimName: syncthing-config
      - name: syncthing-data1
        persistentVolumeClaim:
          claimName: syncthing-data1
      - name: syncthing-data2
        persistentVolumeClaim:
          claimName: syncthing-data2
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  labels:
    app.kubernetes.io/name: syncthing
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: syncthing
  ports:
  - name: port-8384
    port: 8384
    targetPort: 8384
    protocol: TCP
  - name: port-22000
    port: 22000
    targetPort: 22000
    protocol: TCP
  - name: port-22000
    port: 22000
    targetPort: 22000
    protocol: UDP
  - name: port-21027
    port: 21027
    targetPort: 21027
    protocol: UDP
