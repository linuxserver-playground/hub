# Pydio-cells: generated by the hub from https://github.com/linuxserver-playground/docker-pydio-cells/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pydio-cells-env
  labels:
    app.kubernetes.io/name: pydio-cells
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  EXTERNALURL: yourdomain.url
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pydio-cells-config
  labels:
    app.kubernetes.io/name: pydio-cells
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pydio-cells
  labels:
    app.kubernetes.io/name: pydio-cells
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pydio-cells
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pydio-cells
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: pydio-cells
        image: ghcr.io/linuxserver-playground/pydio-cells:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: pydio-cells-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: pydio-cells-config
          mountPath: /config
      volumes:
      - name: pydio-cells-config
        persistentVolumeClaim:
          claimName: pydio-cells-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: pydio-cells
  labels:
    app.kubernetes.io/name: pydio-cells
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: pydio-cells
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
