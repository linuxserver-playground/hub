# Thelounge: generated by the hub from https://github.com/linuxserver-playground/docker-thelounge/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thelounge-env
  labels:
    app.kubernetes.io/name: thelounge
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thelounge-config
  labels:
    app.kubernetes.io/name: thelounge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thelounge
  labels:
    app.kubernetes.io/name: thelounge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thelounge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thelounge
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: thelounge
        image: ghcr.io/linuxserver-playground/thelounge:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: thelounge-env
        ports:
        - name: port-9000
          containerPort: 9000
          protocol: TCP
        volumeMounts:
        - name: thelounge-config
          mountPath: /config
      volumes:
      - name: thelounge-config
        persistentVolumeClaim:
          claimName: thelounge-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: thelounge
  labels:
    app.kubernetes.io/name: thelounge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: thelounge
  ports:
  - name: port-9000
    port: 9000
    targetPort: 9000
    protocol: TCP
