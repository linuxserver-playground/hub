x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/emby-logo.png
  urls:
  - https://emby.media/
  - https://github.com/linuxserver-playground/docker-emby
services:
  emby:
    image: ghcr.io/linuxserver-playground/emby:latest
    container_name: emby
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${DATA_TVSHOWS_PATH:-./data/tvshows}:/data/tvshows
    - ${DATA_MOVIES_PATH:-./data/movies}:/data/movies
    ports:
    - ${PORT_8096:-8096}:8096
    restart: unless-stopped
