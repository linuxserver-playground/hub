x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mysql-workbench-icon.png
  urls:
  - https://www.mysql.com/products/workbench/
  - https://github.com/linuxserver-playground/docker-mysql-workbench
services:
  mysql-workbench:
    image: ghcr.io/linuxserver-playground/mysql-workbench:latest
    container_name: mysql-workbench
    cap_add:
    - IPC_LOCK
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
