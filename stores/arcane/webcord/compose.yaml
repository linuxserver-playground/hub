x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webcord-icon.png
  urls:
  - https://github.com/SpacingBat3/WebCord
  - https://github.com/linuxserver-playground/docker-webcord
services:
  webcord:
    image: ghcr.io/linuxserver-playground/webcord:latest
    container_name: webcord
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
