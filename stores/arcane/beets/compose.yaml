x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/beets-icon.png
  urls:
  - http://beets.io/
  - https://github.com/linuxserver-playground/docker-beets
services:
  beets:
    image: ghcr.io/linuxserver-playground/beets:latest
    container_name: beets
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${MUSIC_PATH:-./music}:/music
    - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
    - ${PORT_8337:-8337}:8337
    restart: unless-stopped
