x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mullvad-browser-logo.png
  urls:
  - https://mullvad.net/en/browser
  - https://github.com/linuxserver-playground/docker-mullvad-browser
services:
  mullvad-browser:
    image: ghcr.io/linuxserver-playground/mullvad-browser:latest
    container_name: mullvad-browser
    cap_add:
    - NET_ADMIN
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
