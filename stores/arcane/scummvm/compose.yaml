x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/scummvm-logo.png
  urls:
  - https://www.scummvm.org/
  - https://github.com/linuxserver-playground/docker-scummvm
services:
  scummvm:
    image: ghcr.io/linuxserver-playground/scummvm:latest
    container_name: scummvm
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    restart: unless-stopped
