x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mastodon-banner.png
  urls:
  - https://github.com/mastodon/mastodon/
  - https://github.com/linuxserver-playground/docker-mastodon
services:
  mastodon:
    image: ghcr.io/linuxserver-playground/mastodon:latest
    container_name: mastodon
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-example.com}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-mastodon}
      DB_NAME: ${DB_NAME:-mastodon}
      DB_PASS: ${DB_PASS}
      DB_PORT: ${DB_PORT:-5432}
      ES_ENABLED: ${ES_ENABLED:-false}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      OTP_SECRET: ${OTP_SECRET}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      SMTP_SERVER: ${SMTP_SERVER:-mail.example.com}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-notifications@example.com}
      S3_ENABLED: ${S3_ENABLED:-false}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-80}:80
    - ${PORT_443:-443}:443
    restart: unless-stopped
