x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/ungoogled-chromium-logo.png
  urls:
  - https://github.com/ungoogled-software/ungoogled-chromium
  - https://github.com/linuxserver-playground/docker-ungoogled-chromium
services:
  ungoogled-chromium:
    image: ghcr.io/linuxserver-playground/ungoogled-chromium:latest
    container_name: ungoogled-chromium
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
