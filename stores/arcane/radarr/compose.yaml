x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/radarr.png
  urls:
  - https://github.com/Radarr/Radarr
  - https://github.com/linuxserver-playground/docker-radarr
services:
  radarr:
    image: ghcr.io/linuxserver-playground/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_7878:-7878}:7878
    restart: unless-stopped
