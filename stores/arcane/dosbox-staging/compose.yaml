x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dosbox-logo.png
  urls:
  - https://www.dosbox-staging.org/
  - https://github.com/linuxserver-playground/docker-dosbox-staging
services:
  dosbox-staging:
    image: ghcr.io/linuxserver-playground/dosbox-staging:latest
    container_name: dosbox-staging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
