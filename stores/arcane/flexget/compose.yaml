x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/flexget-banner.png
  urls:
  - http://flexget.com/
  - https://github.com/linuxserver-playground/docker-flexget
services:
  flexget:
    image: ghcr.io/linuxserver-playground/flexget:latest
    container_name: flexget
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      FG_LOG_LEVEL: ${FG_LOG_LEVEL:-info}
      FG_LOG_FILE: ${FG_LOG_FILE:-/config/flexget.log}
      FG_CONFIG_FILE: ${FG_CONFIG_FILE:-/config/.flexget/config.yml}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_5050:-5050}:5050
    restart: unless-stopped
