x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/planka-logo.png
  urls:
  - https://github.com/plankanban/planka/
  - https://github.com/linuxserver-playground/docker-planka
services:
  planka:
    image: ghcr.io/linuxserver-playground/planka:latest
    container_name: planka
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      BASE_URL: ${BASE_URL:-https://planka.example.com}
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@planka-db:5432/planka}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-demo@demo.demo}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-demo}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Demo User}
      SECRET_KEY: ${SECRET_KEY}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_1337:-1337}:1337
    restart: unless-stopped
