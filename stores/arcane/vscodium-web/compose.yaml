x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscodium-icon.png
  urls:
  - https://vscodium.com/
  - https://github.com/linuxserver-playground/docker-vscodium-web
services:
  vscodium-web:
    image: ghcr.io/linuxserver-playground/vscodium-web:latest
    container_name: vscodium-web
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_8000:-8000}:8000
    restart: unless-stopped
