x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/heimdall-banner.png
  urls:
  - https://heimdall.site
  - https://github.com/linuxserver-playground/docker-heimdall
services:
  heimdall:
    image: ghcr.io/linuxserver-playground/heimdall:latest
    container_name: heimdall
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-80}:80
    - ${PORT_443:-443}:443
    restart: unless-stopped
