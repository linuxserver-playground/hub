x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/pcsx2-logo.png
  urls:
  - https://pcsx2.net/
  - https://github.com/linuxserver-playground/docker-pcsx2
services:
  pcsx2:
    image: ghcr.io/linuxserver-playground/pcsx2:latest
    container_name: pcsx2
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
