x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kimai-logo.png
  urls:
  - https://kimai.org/
  - https://github.com/linuxserver-playground/docker-kimai
services:
  kimai:
    image: ghcr.io/linuxserver-playground/kimai:latest
    container_name: kimai
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:-mysql://your_db_user:your_db_pass@your_db_host:3306/your_db_name?charset=your_db_charset&serverVersion=your_db_version}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-kimai.example.com}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-80}:80
    - ${PORT_443:-443}:443
    restart: unless-stopped
