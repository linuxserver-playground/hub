x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/zen-logo.png
  urls:
  - https://zen-browser.app/
  - https://github.com/linuxserver-playground/docker-zen
services:
  zen:
    image: ghcr.io/linuxserver-playground/zen:latest
    container_name: zen
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
