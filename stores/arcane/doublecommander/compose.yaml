x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/doublecommander-icon.png
  urls:
  - https://doublecmd.sourceforge.io/
  - https://github.com/linuxserver-playground/docker-doublecommander
services:
  doublecommander:
    image: ghcr.io/linuxserver-playground/doublecommander:latest
    container_name: doublecommander
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${DATA_PATH:-./data}:/data
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
