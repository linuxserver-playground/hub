x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/boa-logo.png
  urls:
  - https://boa.realm667.com/
  - https://github.com/linuxserver-playground/docker-blade-of-agony
services:
  blade-of-agony:
    image: ghcr.io/linuxserver-playground/blade-of-agony:latest
    container_name: blade-of-agony
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
