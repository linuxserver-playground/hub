x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kdenlive-logo.png
  urls:
  - https://kdenlive.org/
  - https://github.com/linuxserver-playground/docker-kdenlive
services:
  kdenlive:
    image: ghcr.io/linuxserver-playground/kdenlive:latest
    container_name: kdenlive
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    restart: unless-stopped
