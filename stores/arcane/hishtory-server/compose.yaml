x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/hishtory-server-icon.png
  urls:
  - https://github.com/ddworken/hishtory
  - https://github.com/linuxserver-playground/docker-hishtory-server
services:
  hishtory-server:
    image: ghcr.io/linuxserver-playground/hishtory-server:latest
    container_name: hishtory-server
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
    - ${PORT_8080:-8080}:8080
    restart: unless-stopped
