x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vscode-logo.png
  urls:
  - https://code.visualstudio.com/
  - https://github.com/linuxserver-playground/docker-vscode
services:
  vscode:
    image: ghcr.io/linuxserver-playground/vscode:latest
    container_name: vscode
    cap_add:
    - IPC_LOCK
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
