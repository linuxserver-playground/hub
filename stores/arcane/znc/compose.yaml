x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/znc-logo.png
  urls:
  - http://wiki.znc.in/ZNC
  - https://github.com/linuxserver-playground/docker-znc
services:
  znc:
    image: ghcr.io/linuxserver-playground/znc:latest
    container_name: znc
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_6501:-6501}:6501
    restart: unless-stopped
