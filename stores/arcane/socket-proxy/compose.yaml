x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/docker-logo.png
  urls:
  - https://github.com/linuxserver-playground/docker-socket-proxy
  - https://github.com/linuxserver-playground/docker-socket-proxy
services:
  socket-proxy:
    image: ghcr.io/linuxserver-playground/socket-proxy:latest
    container_name: socket-proxy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    restart: unless-stopped
