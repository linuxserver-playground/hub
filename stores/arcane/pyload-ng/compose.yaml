x-arcane:
  icon: https://github.com/linuxserver/docker-templates/raw/master/linuxserver.io/img/pyload-logo.png
  urls:
  - https://pyload.net/
  - https://github.com/linuxserver-playground/docker-pyload-ng
services:
  pyload-ng:
    image: ghcr.io/linuxserver-playground/pyload-ng:latest
    container_name: pyload-ng
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
    - ${PORT_8000:-8000}:8000
    restart: unless-stopped
