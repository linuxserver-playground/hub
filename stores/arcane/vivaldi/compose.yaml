x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/vivaldi-logo.png
  urls:
  - https://vivaldi.com/
  - https://github.com/linuxserver-playground/docker-vivaldi
services:
  vivaldi:
    image: ghcr.io/linuxserver-playground/vivaldi:latest
    container_name: vivaldi
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
