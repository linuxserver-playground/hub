x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/habridge-logo.png
  urls:
  - https://github.com/bwssytems/ha-bridge/
  - https://github.com/linuxserver-playground/docker-habridge
services:
  habridge:
    image: ghcr.io/linuxserver-playground/habridge:latest
    container_name: habridge
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      SEC_KEY: ${SEC_KEY}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_8080:-8080}:8080
    - ${PORT_50000:-50000}:50000
    restart: unless-stopped
