x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/kali-logo.png
  urls:
  - https://github.com/linuxserver/docker-kali-linux
  - https://github.com/linuxserver-playground/docker-kali-linux
services:
  kali-linux:
    image: ghcr.io/linuxserver-playground/kali-linux:latest
    container_name: kali-linux
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
