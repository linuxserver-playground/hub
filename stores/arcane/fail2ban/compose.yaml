x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/fail2ban-logo.png
  urls:
  - http://www.fail2ban.org/
  - https://github.com/linuxserver-playground/docker-fail2ban
services:
  fail2ban:
    image: ghcr.io/linuxserver-playground/fail2ban:latest
    container_name: fail2ban
    cap_add:
    - NET_ADMIN
    - NET_RAW
    network_mode: host
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${VAR_LOG_RO_PATH:-./var/log:ro}:/var/log:ro
    restart: unless-stopped
