x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/unifi-banner.png
  urls:
  - https://ui.com/
  - https://github.com/linuxserver-playground/docker-unifi-network-application
services:
  unifi-network-application:
    image: ghcr.io/linuxserver-playground/unifi-network-application:latest
    container_name: unifi-network-application
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      MONGO_USER: ${MONGO_USER:-unifi}
      MONGO_PASS: ${MONGO_PASS}
      MONGO_HOST: ${MONGO_HOST:-unifi-db}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DBNAME: ${MONGO_DBNAME:-unifi}
      MONGO_AUTHSOURCE: ${MONGO_AUTHSOURCE:-admin}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_8443:-8443}:8443
    - ${PORT_3478_UDP:-3478}:3478/udp
    - ${PORT_10001_UDP:-10001}:10001/udp
    - ${PORT_8080:-8080}:8080
    restart: unless-stopped
