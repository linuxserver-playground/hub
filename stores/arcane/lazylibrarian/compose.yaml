x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/lazylibrarian-icon.png
  urls:
  - https://lazylibrarian.gitlab.io/
  - https://github.com/linuxserver-playground/docker-lazylibrarian
services:
  lazylibrarian:
    image: ghcr.io/linuxserver-playground/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
    - ${PORT_5299:-5299}:5299
    restart: unless-stopped
