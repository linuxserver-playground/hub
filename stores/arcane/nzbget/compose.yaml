x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nzbget-banner.png
  urls:
  - http://nzbget.com/
  - https://github.com/linuxserver-playground/docker-nzbget
services:
  nzbget:
    image: ghcr.io/linuxserver-playground/nzbget:latest
    container_name: nzbget
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_6789:-6789}:6789
    restart: unless-stopped
