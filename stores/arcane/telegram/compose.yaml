x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/telegram-logo.png
  urls:
  - https://telegram.org/
  - https://github.com/linuxserver-playground/docker-telegram
services:
  telegram:
    image: ghcr.io/linuxserver-playground/telegram:latest
    container_name: telegram
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
