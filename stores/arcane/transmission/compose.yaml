x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/transmission.png
  urls:
  - https://www.transmissionbt.com/
  - https://github.com/linuxserver-playground/docker-transmission
services:
  transmission:
    image: ghcr.io/linuxserver-playground/transmission:latest
    container_name: transmission
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_9091:-9091}:9091
    - ${PORT_51413:-51413}:51413
    - ${PORT_51413_UDP:-51413}:51413/udp
    restart: unless-stopped
