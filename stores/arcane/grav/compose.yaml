x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grav-logo.png
  urls:
  - https://github.com/getgrav/grav/
  - https://github.com/linuxserver-playground/docker-grav
services:
  grav:
    image: ghcr.io/linuxserver-playground/grav:latest
    container_name: grav
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-80}:80
    restart: unless-stopped
