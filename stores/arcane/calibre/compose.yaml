x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/calibre-logo.png
  urls:
  - https://calibre-ebook.com/
  - https://github.com/linuxserver-playground/docker-calibre
services:
  calibre:
    image: ghcr.io/linuxserver-playground/calibre:latest
    container_name: calibre
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_8080:-8080}:8080
    - ${PORT_8181:-8181}:8181
    - ${PORT_8081:-8081}:8081
    shm_size: 1gb
    restart: unless-stopped
