x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/manyfold-logo.png
  urls:
  - https://github.com/manyfold3d/manyfold/
  - https://github.com/linuxserver-playground/docker-manyfold
services:
  manyfold:
    image: ghcr.io/linuxserver-playground/manyfold:latest
    container_name: manyfold
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3214:-3214}:3214
    restart: unless-stopped
