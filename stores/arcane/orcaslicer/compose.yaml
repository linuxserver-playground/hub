x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/orcaslicer-logo.png
  urls:
  - https://github.com/SoftFever/OrcaSlicer
  - https://github.com/linuxserver-playground/docker-orcaslicer
services:
  orcaslicer:
    image: ghcr.io/linuxserver-playground/orcaslicer:latest
    container_name: orcaslicer
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    restart: unless-stopped
