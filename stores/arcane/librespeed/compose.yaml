x-arcane:
  icon: https://raw.githubusercontent.com/librespeed/speedtest/master/.logo/logo3.png
  urls:
  - https://github.com/librespeed/speedtest
  - https://github.com/linuxserver-playground/docker-librespeed
services:
  librespeed:
    image: ghcr.io/linuxserver-playground/librespeed:latest
    container_name: librespeed
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      PASSWORD: ${PASSWORD}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-80}:80
    restart: unless-stopped
