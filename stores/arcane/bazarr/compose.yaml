x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bazarr.png
  urls:
  - https://www.bazarr.media/
  - https://github.com/linuxserver-playground/docker-bazarr
services:
  bazarr:
    image: ghcr.io/linuxserver-playground/bazarr:latest
    container_name: bazarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_6767:-6767}:6767
    restart: unless-stopped
