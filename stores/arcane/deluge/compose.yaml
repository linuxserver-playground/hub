x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/deluge-logo.png
  urls:
  - http://deluge-torrent.org/
  - https://github.com/linuxserver-playground/docker-deluge
services:
  deluge:
    image: ghcr.io/linuxserver-playground/deluge:latest
    container_name: deluge
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
    - ${PORT_8112:-8112}:8112
    - ${PORT_6881:-6881}:6881
    - ${PORT_6881_UDP:-6881}:6881/udp
    restart: unless-stopped
