x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/jackett-banner.png
  urls:
  - https://github.com/Jackett/Jackett
  - https://github.com/linuxserver-playground/docker-jackett
services:
  jackett:
    image: ghcr.io/linuxserver-playground/jackett:latest
    container_name: jackett
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
    - ${PORT_9117:-9117}:9117
    restart: unless-stopped
