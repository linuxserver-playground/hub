x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/sabnzbd-banner.png
  urls:
  - http://sabnzbd.org/
  - https://github.com/linuxserver-playground/docker-sabnzbd
services:
  sabnzbd:
    image: ghcr.io/linuxserver-playground/sabnzbd:latest
    container_name: sabnzbd
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_8080:-8080}:8080
    restart: unless-stopped
