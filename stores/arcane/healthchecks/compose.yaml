x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/healthchecks-logo.png
  urls:
  - https://github.com/healthchecks/healthchecks
  - https://github.com/linuxserver-playground/docker-healthchecks
services:
  healthchecks:
    image: ghcr.io/linuxserver-playground/healthchecks:latest
    container_name: healthchecks
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      SECRET_KEY: ${SECRET_KEY}
      SITE_ROOT: ${SITE_ROOT}
      SITE_NAME: ${SITE_NAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_8000:-8000}:8000
    restart: unless-stopped
