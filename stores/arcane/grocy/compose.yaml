x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/grocy-logo.png
  urls:
  - https://github.com/grocy/grocy
  - https://github.com/linuxserver-playground/docker-grocy
services:
  grocy:
    image: ghcr.io/linuxserver-playground/grocy:latest
    container_name: grocy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-9283}:80
    restart: unless-stopped
