x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/audiosilo-logo.png
  urls:
  - https://audiosilo.app
  - https://github.com/linuxserver-playground/docker-audiosilo
services:
  audiosilo:
    image: ghcr.io/linuxserver-playground/audiosilo:latest
    container_name: audiosilo
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${AUDIOBOOKS_RO_PATH:-./audiobooks:ro}:/audiobooks:ro
    ports:
    - ${PORT_8080:-8080}:8080
    restart: unless-stopped
