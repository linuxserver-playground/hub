x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/rpcs3-logo.png
  urls:
  - https://rpcs3.net/
  - https://github.com/linuxserver-playground/docker-rpcs3
services:
  rpcs3:
    image: ghcr.io/linuxserver-playground/rpcs3:latest
    container_name: rpcs3
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
