x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/freshrss-banner.png
  urls:
  - https://freshrss.org/
  - https://github.com/linuxserver-playground/docker-freshrss
services:
  freshrss:
    image: ghcr.io/linuxserver-playground/freshrss:latest
    container_name: freshrss
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_80:-80}:80
    restart: unless-stopped
