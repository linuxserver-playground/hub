x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/dogwalk-logo.png
  urls:
  - https://studio.blender.org/projects/dogwalk/
  - https://github.com/linuxserver-playground/docker-dogwalk
services:
  dogwalk:
    image: ghcr.io/linuxserver-playground/dogwalk:latest
    container_name: dogwalk
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
