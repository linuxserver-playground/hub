x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/bambustudio-logo.png
  urls:
  - https://bambulab.com/en/download/studio
  - https://github.com/linuxserver-playground/docker-bambustudio
services:
  bambustudio:
    image: ghcr.io/linuxserver-playground/bambustudio:latest
    container_name: bambustudio
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
