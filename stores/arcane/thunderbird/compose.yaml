x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/thunderbird-logo.png
  urls:
  - https://www.thunderbird.net/
  - https://github.com/linuxserver-playground/docker-thunderbird
services:
  thunderbird:
    image: ghcr.io/linuxserver-playground/thunderbird:latest
    container_name: thunderbird
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
