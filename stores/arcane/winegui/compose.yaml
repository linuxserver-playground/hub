x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/winegui-logo.png
  urls:
  - https://gitlab.melroy.org/melroy/winegui
  - https://github.com/linuxserver-playground/docker-winegui
services:
  winegui:
    image: ghcr.io/linuxserver-playground/winegui:latest
    container_name: winegui
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
