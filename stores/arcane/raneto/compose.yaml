x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/raneto-logo.png
  urls:
  - http://raneto.com/
  - https://github.com/linuxserver-playground/docker-raneto
services:
  raneto:
    image: ghcr.io/linuxserver-playground/raneto:latest
    container_name: raneto
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    ports:
    - ${PORT_3000:-3000}:3000
    restart: unless-stopped
