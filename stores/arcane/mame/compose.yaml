x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mame-logo.png
  urls:
  - https://www.mamedev.org/
  - https://github.com/linuxserver-playground/docker-mame
services:
  mame:
    image: ghcr.io/linuxserver-playground/mame:latest
    container_name: mame
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${MAME_RO_PATH:-./mame:ro}:/mame:ro
    ports:
    - ${PORT_3000:-3000}:3000
    - ${PORT_3001:-3001}:3001
    shm_size: 1gb
    restart: unless-stopped
