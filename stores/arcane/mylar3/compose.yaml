x-arcane:
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/mylar-icon.png
  urls:
  - https://github.com/MylarComics/mylar3
  - https://github.com/linuxserver-playground/docker-mylar3
services:
  mylar3:
    image: ghcr.io/linuxserver-playground/mylar3:latest
    container_name: mylar3
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
    - ${CONFIG_PATH:-./config}:/config
    - ${COMICS_PATH:-./comics}:/comics
    - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
    - ${PORT_8090:-8090}:8090
    restart: unless-stopped
