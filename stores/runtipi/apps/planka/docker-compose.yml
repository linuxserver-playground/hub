services:
  planka:
    image: ghcr.io/linuxserver-playground/planka:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      BASE_URL: ${PLANKA_BASE_URL}
      DATABASE_URL: ${PLANKA_DATABASE_URL}
      DEFAULT_ADMIN_EMAIL: ${PLANKA_DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_USERNAME: ${PLANKA_DEFAULT_ADMIN_USERNAME}
      DEFAULT_ADMIN_PASSWORD: ${PLANKA_DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${PLANKA_DEFAULT_ADMIN_NAME}
      SECRET_KEY: ${PLANKA_SECRET_KEY}
      TRUST_PROXY: ${PLANKA_TRUST_PROXY}
      DEFAULT_LANGUAGE: ${PLANKA_DEFAULT_LANGUAGE}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 1337
x-runtipi:
  schema_version: 2
