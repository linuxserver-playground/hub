services:
  sabnzbd:
    image: ghcr.io/linuxserver-playground/sabnzbd:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/incomplete-downloads:/incomplete-downloads
    - ${APP_DATA_DIR}/data/downloads:/downloads
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
