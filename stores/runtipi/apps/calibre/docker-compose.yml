services:
  calibre:
    image: ghcr.io/linuxserver-playground/calibre:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PASSWORD: ${CALIBRE_PASSWORD}
      CLI_ARGS: ${CALIBRE_CLI_ARGS}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 8181:8181
    - 8081:8081
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
