services:
  davos:
    image: ghcr.io/linuxserver-playground/davos:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/download:/download
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
