services:
  wireshark:
    image: ghcr.io/linuxserver-playground/wireshark:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    cap_add:
    - NET_ADMIN
    x-runtipi:
      is_main: true
      internal_port: 3001
x-runtipi:
  schema_version: 2
