services:
  mstream:
    image: ghcr.io/linuxserver-playground/mstream:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/music:/music
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
