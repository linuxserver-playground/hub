services:
  cops:
    image: ghcr.io/linuxserver-playground/cops:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/books:/books
    ports:
    - 443:443
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
