services:
  code-server:
    image: ghcr.io/linuxserver-playground/code-server:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PASSWORD: ${CODE_SERVER_PASSWORD}
      HASHED_PASSWORD: ${CODE_SERVER_HASHED_PASSWORD}
      SUDO_PASSWORD: ${CODE_SERVER_SUDO_PASSWORD}
      SUDO_PASSWORD_HASH: ${CODE_SERVER_SUDO_PASSWORD_HASH}
      PROXY_DOMAIN: ${CODE_SERVER_PROXY_DOMAIN}
      DEFAULT_WORKSPACE: ${CODE_SERVER_DEFAULT_WORKSPACE}
      PWA_APPNAME: ${CODE_SERVER_PWA_APPNAME}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8443
x-runtipi:
  schema_version: 2
