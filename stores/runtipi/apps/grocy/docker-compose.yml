services:
  grocy:
    image: ghcr.io/linuxserver-playground/grocy:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 9283:80
    x-runtipi:
      is_main: true
      internal_port: 9283
x-runtipi:
  schema_version: 2
