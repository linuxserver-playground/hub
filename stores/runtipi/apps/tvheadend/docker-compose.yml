services:
  tvheadend:
    image: ghcr.io/linuxserver-playground/tvheadend:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      RUN_OPTS: ${TVHEADEND_RUN_OPTS}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/recordings:/recordings
    ports:
    - 9982:9982
    x-runtipi:
      is_main: true
      internal_port: 9981
x-runtipi:
  schema_version: 2
