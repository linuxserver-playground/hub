services:
  bazarr:
    image: ghcr.io/linuxserver-playground/bazarr:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/movies:/movies
    - ${APP_DATA_DIR}/data/tv:/tv
    x-runtipi:
      is_main: true
      internal_port: 6767
x-runtipi:
  schema_version: 2
