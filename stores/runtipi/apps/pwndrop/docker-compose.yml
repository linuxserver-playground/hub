services:
  pwndrop:
    image: ghcr.io/linuxserver-playground/pwndrop:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      SECRET_PATH: ${PWNDROP_SECRET_PATH}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
