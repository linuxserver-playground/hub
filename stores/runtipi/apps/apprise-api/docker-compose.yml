services:
  apprise-api:
    image: ghcr.io/linuxserver-playground/apprise-api:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APPRISE_ATTACH_SIZE: ${APPRISE_API_APPRISE_ATTACH_SIZE}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/attachments:/attachments
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
