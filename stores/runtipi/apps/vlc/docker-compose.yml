services:
  vlc:
    image: ghcr.io/linuxserver-playground/vlc:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      VLC_CLI: ${VLC_VLC_CLI}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 3001:3001
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
