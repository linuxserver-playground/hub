services:
  ubooquity:
    image: ghcr.io/linuxserver-playground/ubooquity:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      MAXMEM: ${UBOOQUITY_MAXMEM}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/books:/books
    - ${APP_DATA_DIR}/data/comics:/comics
    - ${APP_DATA_DIR}/data/files:/files
    ports:
    - 2203:2203
    x-runtipi:
      is_main: true
      internal_port: 2202
x-runtipi:
  schema_version: 2
