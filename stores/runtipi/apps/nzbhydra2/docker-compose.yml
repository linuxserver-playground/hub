services:
  nzbhydra2:
    image: ghcr.io/linuxserver-playground/nzbhydra2:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    x-runtipi:
      is_main: true
      internal_port: 5076
x-runtipi:
  schema_version: 2
