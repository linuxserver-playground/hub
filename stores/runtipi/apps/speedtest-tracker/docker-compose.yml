services:
  speedtest-tracker:
    image: ghcr.io/linuxserver-playground/speedtest-tracker:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APP_KEY: ${SPEEDTEST_TRACKER_APP_KEY}
      APP_URL: ${SPEEDTEST_TRACKER_APP_URL}
      DB_CONNECTION: ${SPEEDTEST_TRACKER_DB_CONNECTION}
      SPEEDTEST_SCHEDULE: ${SPEEDTEST_TRACKER_SPEEDTEST_SCHEDULE}
      SPEEDTEST_SERVERS: ${SPEEDTEST_TRACKER_SPEEDTEST_SERVERS}
      DB_HOST: ${SPEEDTEST_TRACKER_DB_HOST}
      DB_PORT: ${SPEEDTEST_TRACKER_DB_PORT}
      DB_DATABASE: ${SPEEDTEST_TRACKER_DB_DATABASE}
      DB_USERNAME: ${SPEEDTEST_TRACKER_DB_USERNAME}
      DB_PASSWORD: ${SPEEDTEST_TRACKER_DB_PASSWORD}
      DISPLAY_TIMEZONE: ${SPEEDTEST_TRACKER_DISPLAY_TIMEZONE}
      PRUNE_RESULTS_OLDER_THAN: ${SPEEDTEST_TRACKER_PRUNE_RESULTS_OLDER_THAN}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
