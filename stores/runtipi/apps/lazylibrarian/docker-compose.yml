services:
  lazylibrarian:
    image: ghcr.io/linuxserver-playground/lazylibrarian:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DOCKER_MODS: ${LAZYLIBRARIAN_DOCKER_MODS}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/books:/books
    x-runtipi:
      is_main: true
      internal_port: 5299
x-runtipi:
  schema_version: 2
