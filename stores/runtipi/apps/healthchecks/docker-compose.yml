services:
  healthchecks:
    image: ghcr.io/linuxserver-playground/healthchecks:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      SECRET_KEY: ${HEALTHCHECKS_SECRET_KEY}
      SITE_ROOT: ${HEALTHCHECKS_SITE_ROOT}
      SITE_NAME: ${HEALTHCHECKS_SITE_NAME}
      SUPERUSER_EMAIL: ${HEALTHCHECKS_SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${HEALTHCHECKS_SUPERUSER_PASSWORD}
      ALLOWED_HOSTS: ${HEALTHCHECKS_ALLOWED_HOSTS}
      APPRISE_ENABLED: ${HEALTHCHECKS_APPRISE_ENABLED}
      CSRF_TRUSTED_ORIGINS: ${HEALTHCHECKS_CSRF_TRUSTED_ORIGINS}
      DEBUG: ${HEALTHCHECKS_DEBUG}
      DEFAULT_FROM_EMAIL: ${HEALTHCHECKS_DEFAULT_FROM_EMAIL}
      EMAIL_HOST: ${HEALTHCHECKS_EMAIL_HOST}
      EMAIL_PORT: ${HEALTHCHECKS_EMAIL_PORT}
      EMAIL_HOST_USER: ${HEALTHCHECKS_EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${HEALTHCHECKS_EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${HEALTHCHECKS_EMAIL_USE_TLS}
      INTEGRATIONS_ALLOW_PRIVATE_IPS: ${HEALTHCHECKS_INTEGRATIONS_ALLOW_PRIVATE_IPS}
      PING_EMAIL_DOMAIN: ${HEALTHCHECKS_PING_EMAIL_DOMAIN}
      RP_ID: ${HEALTHCHECKS_RP_ID}
      SITE_LOGO_URL: ${HEALTHCHECKS_SITE_LOGO_URL}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
