services:
  pyload-ng:
    image: ghcr.io/linuxserver-playground/pyload-ng:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
