services:
  duckdns:
    image: ghcr.io/linuxserver-playground/duckdns:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ${DUCKDNS_UPDATE_IP}
      LOG_FILE: ${DUCKDNS_LOG_FILE}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
