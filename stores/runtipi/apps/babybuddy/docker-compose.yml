services:
  babybuddy:
    image: ghcr.io/linuxserver-playground/babybuddy:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CSRF_TRUSTED_ORIGINS: ${BABYBUDDY_CSRF_TRUSTED_ORIGINS}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
