services:
  craft-apps:
    image: ghcr.io/linuxserver-playground/craft-apps:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 3001:3001
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
