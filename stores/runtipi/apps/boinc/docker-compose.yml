services:
  boinc:
    image: ghcr.io/linuxserver-playground/boinc:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PASSWORD: ${BOINC_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 8181:8181
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
