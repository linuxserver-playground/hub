services:
  thelounge:
    image: ghcr.io/linuxserver-playground/thelounge:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 9000
x-runtipi:
  schema_version: 2
