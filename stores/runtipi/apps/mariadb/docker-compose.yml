services:
  mariadb:
    image: ghcr.io/linuxserver-playground/mariadb:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MARIADB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_MYSQL_DATABASE}
      MYSQL_USER: ${MARIADB_MYSQL_USER}
      MYSQL_PASSWORD: ${MARIADB_MYSQL_PASSWORD}
      REMOTE_SQL: ${MARIADB_REMOTE_SQL}
      CLI_OPTS: ${MARIADB_CLI_OPTS}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3306
x-runtipi:
  schema_version: 2
