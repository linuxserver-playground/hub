services:
  resilio-sync:
    image: ghcr.io/linuxserver-playground/resilio-sync:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/sync:/sync
    ports:
    - 55555:55555
    x-runtipi:
      is_main: true
      internal_port: 8888
x-runtipi:
  schema_version: 2
