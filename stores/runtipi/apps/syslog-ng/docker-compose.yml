services:
  syslog-ng:
    image: ghcr.io/linuxserver-playground/syslog-ng:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      LOG_TO_STDOUT: ${SYSLOG_NG_LOG_TO_STDOUT}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/var/log:/var/log
    ports:
    - 514:5514/udp
    - 601:6601/tcp
    - 6514:6514/tcp
    x-runtipi:
      is_main: true
      internal_port: 514
x-runtipi:
  schema_version: 2
