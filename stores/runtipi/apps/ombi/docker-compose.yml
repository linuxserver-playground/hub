services:
  ombi:
    image: ghcr.io/linuxserver-playground/ombi:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      BASE_URL: ${OMBI_BASE_URL}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3579
x-runtipi:
  schema_version: 2
