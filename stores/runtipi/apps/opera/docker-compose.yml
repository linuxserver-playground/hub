services:
  opera:
    image: ghcr.io/linuxserver-playground/opera:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      OPERA_CLI: ${OPERA_OPERA_CLI}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    ports:
    - 3001:3001
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
