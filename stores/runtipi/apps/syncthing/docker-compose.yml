services:
  syncthing:
    image: ghcr.io/linuxserver-playground/syncthing:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/data1:/data1
    - ${APP_DATA_DIR}/data/data2:/data2
    ports:
    - 22000:22000/tcp
    - 22000:22000/udp
    - 21027:21027/udp
    x-runtipi:
      is_main: true
      internal_port: 8384
x-runtipi:
  schema_version: 2
