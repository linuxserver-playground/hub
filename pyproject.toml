[project]
name = "lsio-hub"
version = "0.1.0"
description = "The LinuxServer v2 hub: ingests build bundles, keeps the fleet data in git, serves a static API and generates every downstream artefact."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
  "fastapi==0.162.0",
  "httpx2==2.16.0",
  "jinja2==3.1.6",
  "lsio-builder @ git+https://github.com/linuxserver-playground/builder@main",
  "markdown-it-py==4.2.0",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "openapi-spec-validator==0.7.2",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "types-PyYAML==6.0.12.20260906",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lsio_hub", "lsio_hub.sources", "lsio_hub.generate"]

[tool.setuptools.package-data]
lsio_hub = ["templates/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["lsio_hub", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# lsio-builder ships no py.typed marker, so its (typed) modules are not visible to mypy as a library.
module = ["builder", "builder.*", "contracts"]
ignore_missing_imports = true
