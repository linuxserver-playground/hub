# Pwndrop: generated by the hub from https://github.com/linuxserver-playground/docker-pwndrop/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pwndrop-env
  labels:
    app.kubernetes.io/name: pwndrop
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pwndrop-config
  labels:
    app.kubernetes.io/name: pwndrop
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwndrop
  labels:
    app.kubernetes.io/name: pwndrop
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pwndrop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pwndrop
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: pwndrop
        image: ghcr.io/linuxserver-playground/pwndrop:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: pwndrop-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: pwndrop-config
          mountPath: /config
      volumes:
      - name: pwndrop-config
        persistentVolumeClaim:
          claimName: pwndrop-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: pwndrop
  labels:
    app.kubernetes.io/name: pwndrop
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: pwndrop
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
