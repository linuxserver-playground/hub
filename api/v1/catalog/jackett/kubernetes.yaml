# Jackett: generated by the hub from https://github.com/linuxserver-playground/docker-jackett/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jackett-env
  labels:
    app.kubernetes.io/name: jackett
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jackett-config
  labels:
    app.kubernetes.io/name: jackett
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jackett-downloads
  labels:
    app.kubernetes.io/name: jackett
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  labels:
    app.kubernetes.io/name: jackett
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jackett
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jackett
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: jackett
        image: ghcr.io/linuxserver-playground/jackett:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: jackett-env
        ports:
        - name: port-9117
          containerPort: 9117
          protocol: TCP
        volumeMounts:
        - name: jackett-config
          mountPath: /config
        - name: jackett-downloads
          mountPath: /downloads
      volumes:
      - name: jackett-config
        persistentVolumeClaim:
          claimName: jackett-config
      - name: jackett-downloads
        persistentVolumeClaim:
          claimName: jackett-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: jackett
  labels:
    app.kubernetes.io/name: jackett
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: jackett
  ports:
  - name: port-9117
    port: 9117
    targetPort: 9117
    protocol: TCP
