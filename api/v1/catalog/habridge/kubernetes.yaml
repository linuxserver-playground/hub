# Habridge: generated by the hub from https://github.com/linuxserver-playground/docker-habridge/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: habridge-env
  labels:
    app.kubernetes.io/name: habridge
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  SEC_KEY: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: habridge-config
  labels:
    app.kubernetes.io/name: habridge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habridge
  labels:
    app.kubernetes.io/name: habridge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: habridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: habridge
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: habridge
        image: ghcr.io/linuxserver-playground/habridge:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: habridge-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        - name: port-50000
          containerPort: 50000
          protocol: TCP
        volumeMounts:
        - name: habridge-config
          mountPath: /config
      volumes:
      - name: habridge-config
        persistentVolumeClaim:
          claimName: habridge-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: habridge
  labels:
    app.kubernetes.io/name: habridge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: habridge
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: port-50000
    port: 50000
    targetPort: 50000
    protocol: TCP
