# Davos: generated by the hub from https://github.com/linuxserver-playground/docker-davos/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: davos-env
  labels:
    app.kubernetes.io/name: davos
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: davos-config
  labels:
    app.kubernetes.io/name: davos
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: davos-download
  labels:
    app.kubernetes.io/name: davos
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: davos
  labels:
    app.kubernetes.io/name: davos
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: davos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: davos
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: davos
        image: ghcr.io/linuxserver-playground/davos:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: davos-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: davos-config
          mountPath: /config
        - name: davos-download
          mountPath: /download
      volumes:
      - name: davos-config
        persistentVolumeClaim:
          claimName: davos-config
      - name: davos-download
        persistentVolumeClaim:
          claimName: davos-download
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: davos
  labels:
    app.kubernetes.io/name: davos
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: davos
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
