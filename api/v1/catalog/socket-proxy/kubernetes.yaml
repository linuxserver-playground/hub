# Socket-proxy: generated by the hub from https://github.com/linuxserver-playground/docker-socket-proxy/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socket-proxy-env
  labels:
    app.kubernetes.io/name: socket-proxy
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-proxy
  labels:
    app.kubernetes.io/name: socket-proxy
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: socket-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: socket-proxy
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: socket-proxy
        image: ghcr.io/linuxserver-playground/socket-proxy:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: socket-proxy-env
  strategy:
    type: Recreate
