# Medusa: generated by the hub from https://github.com/linuxserver-playground/docker-medusa/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medusa-env
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medusa-config
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medusa-downloads
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medusa-tv
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medusa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medusa
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: medusa
        image: ghcr.io/linuxserver-playground/medusa:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: medusa-env
        ports:
        - name: port-8081
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: medusa-config
          mountPath: /config
        - name: medusa-downloads
          mountPath: /downloads
        - name: medusa-tv
          mountPath: /tv
      volumes:
      - name: medusa-config
        persistentVolumeClaim:
          claimName: medusa-config
      - name: medusa-downloads
        persistentVolumeClaim:
          claimName: medusa-downloads
      - name: medusa-tv
        persistentVolumeClaim:
          claimName: medusa-tv
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: medusa
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: medusa
  ports:
  - name: port-8081
    port: 8081
    targetPort: 8081
    protocol: TCP
