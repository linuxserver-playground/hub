---
services:
  intellij-idea:
    image: ghcr.io/linuxserver-playground/intellij-idea:latest
    container_name: intellij-idea
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
