# Diskover: generated by the hub from https://github.com/linuxserver-playground/docker-diskover/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: diskover-env
  labels:
    app.kubernetes.io/name: diskover
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  ES_HOST: elasticsearch
  ES_PORT: '9200'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: diskover-config
  labels:
    app.kubernetes.io/name: diskover
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: diskover-data
  labels:
    app.kubernetes.io/name: diskover
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diskover
  labels:
    app.kubernetes.io/name: diskover
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diskover
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diskover
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: diskover
        image: ghcr.io/linuxserver-playground/diskover:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: diskover-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: diskover-config
          mountPath: /config
        - name: diskover-data
          mountPath: /data
      volumes:
      - name: diskover-config
        persistentVolumeClaim:
          claimName: diskover-config
      - name: diskover-data
        persistentVolumeClaim:
          claimName: diskover-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: diskover
  labels:
    app.kubernetes.io/name: diskover
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: diskover
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
