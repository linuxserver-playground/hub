---
services:
  kali-linux:
    image: ghcr.io/linuxserver-playground/kali-linux:latest
    container_name: kali-linux
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/data:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
