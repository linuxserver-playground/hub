# Kimai: generated by the hub from https://github.com/linuxserver-playground/docker-kimai/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kimai-env
  labels:
    app.kubernetes.io/name: kimai
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  APP_SECRET: ''
  DATABASE_URL: mysql://your_db_user:your_db_pass@your_db_host:3306/your_db_name?charset=your_db_charset&serverVersion=your_db_version
  TRUSTED_HOSTS: kimai.example.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-config
  labels:
    app.kubernetes.io/name: kimai
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai
  labels:
    app.kubernetes.io/name: kimai
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kimai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kimai
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: kimai
        image: ghcr.io/linuxserver-playground/kimai:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: kimai-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        - name: port-443
          containerPort: 443
          protocol: TCP
        volumeMounts:
        - name: kimai-config
          mountPath: /config
      volumes:
      - name: kimai-config
        persistentVolumeClaim:
          claimName: kimai-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: kimai
  labels:
    app.kubernetes.io/name: kimai
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: kimai
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
  - name: port-443
    port: 443
    targetPort: 443
    protocol: TCP
