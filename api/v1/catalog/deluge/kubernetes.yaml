# Deluge: generated by the hub from https://github.com/linuxserver-playground/docker-deluge/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deluge-env
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-config
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-downloads
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deluge
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: deluge
        image: ghcr.io/linuxserver-playground/deluge:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: deluge-env
        ports:
        - name: port-8112
          containerPort: 8112
          protocol: TCP
        - name: port-6881
          containerPort: 6881
          protocol: TCP
        - name: port-6881
          containerPort: 6881
          protocol: UDP
        volumeMounts:
        - name: deluge-config
          mountPath: /config
        - name: deluge-downloads
          mountPath: /downloads
      volumes:
      - name: deluge-config
        persistentVolumeClaim:
          claimName: deluge-config
      - name: deluge-downloads
        persistentVolumeClaim:
          claimName: deluge-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: deluge
  labels:
    app.kubernetes.io/name: deluge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: deluge
  ports:
  - name: port-8112
    port: 8112
    targetPort: 8112
    protocol: TCP
  - name: port-6881
    port: 6881
    targetPort: 6881
    protocol: TCP
  - name: port-6881
    port: 6881
    targetPort: 6881
    protocol: UDP
