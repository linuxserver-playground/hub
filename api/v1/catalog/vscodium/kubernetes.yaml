# Vscodium: generated by the hub from https://github.com/linuxserver-playground/docker-vscodium/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability IPC_LOCK: Required for keyring functionality..
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscodium-env
  labels:
    app.kubernetes.io/name: vscodium
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vscodium-config
  labels:
    app.kubernetes.io/name: vscodium
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscodium
  labels:
    app.kubernetes.io/name: vscodium
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vscodium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vscodium
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: vscodium
        image: ghcr.io/linuxserver-playground/vscodium:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vscodium-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: vscodium-config
          mountPath: /config
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
      volumes:
      - name: vscodium-config
        persistentVolumeClaim:
          claimName: vscodium-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: vscodium
  labels:
    app.kubernetes.io/name: vscodium
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: vscodium
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
