# Jellyfin: generated by the hub from https://github.com/linuxserver-playground/docker-jellyfin/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-env
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-data-tvshows
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-data-movies
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: jellyfin
        image: ghcr.io/linuxserver-playground/jellyfin:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: jellyfin-env
        ports:
        - name: port-8096
          containerPort: 8096
          protocol: TCP
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-data-tvshows
          mountPath: /data/tvshows
        - name: jellyfin-data-movies
          mountPath: /data/movies
      volumes:
      - name: jellyfin-config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: jellyfin-data-tvshows
        persistentVolumeClaim:
          claimName: jellyfin-data-tvshows
      - name: jellyfin-data-movies
        persistentVolumeClaim:
          claimName: jellyfin-data-movies
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
  - name: port-8096
    port: 8096
    targetPort: 8096
    protocol: TCP
