---
services:
  blade-of-agony:
    image: ghcr.io/linuxserver-playground/blade-of-agony:latest
    container_name: blade-of-agony
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
