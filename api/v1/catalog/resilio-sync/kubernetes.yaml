# Resilio-sync: generated by the hub from https://github.com/linuxserver-playground/docker-resilio-sync/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resilio-sync-env
  labels:
    app.kubernetes.io/name: resilio-sync
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resilio-sync-config
  labels:
    app.kubernetes.io/name: resilio-sync
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resilio-sync-downloads
  labels:
    app.kubernetes.io/name: resilio-sync
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resilio-sync-sync
  labels:
    app.kubernetes.io/name: resilio-sync
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilio-sync
  labels:
    app.kubernetes.io/name: resilio-sync
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resilio-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resilio-sync
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: resilio-sync
        image: ghcr.io/linuxserver-playground/resilio-sync:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: resilio-sync-env
        ports:
        - name: port-8888
          containerPort: 8888
          protocol: TCP
        - name: port-55555
          containerPort: 55555
          protocol: TCP
        volumeMounts:
        - name: resilio-sync-config
          mountPath: /config
        - name: resilio-sync-downloads
          mountPath: /downloads
        - name: resilio-sync-sync
          mountPath: /sync
      volumes:
      - name: resilio-sync-config
        persistentVolumeClaim:
          claimName: resilio-sync-config
      - name: resilio-sync-downloads
        persistentVolumeClaim:
          claimName: resilio-sync-downloads
      - name: resilio-sync-sync
        persistentVolumeClaim:
          claimName: resilio-sync-sync
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: resilio-sync
  labels:
    app.kubernetes.io/name: resilio-sync
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: resilio-sync
  ports:
  - name: port-8888
    port: 8888
    targetPort: 8888
    protocol: TCP
  - name: port-55555
    port: 55555
    targetPort: 55555
    protocol: TCP
