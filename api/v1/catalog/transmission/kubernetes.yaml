# Transmission: generated by the hub from https://github.com/linuxserver-playground/docker-transmission/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-env
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transmission
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: transmission
        image: ghcr.io/linuxserver-playground/transmission:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: transmission-env
        ports:
        - name: port-9091
          containerPort: 9091
          protocol: TCP
        - name: port-51413
          containerPort: 51413
          protocol: TCP
        - name: port-51413
          containerPort: 51413
          protocol: UDP
        volumeMounts:
        - name: transmission-config
          mountPath: /config
      volumes:
      - name: transmission-config
        persistentVolumeClaim:
          claimName: transmission-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: transmission
  ports:
  - name: port-9091
    port: 9091
    targetPort: 9091
    protocol: TCP
  - name: port-51413
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: port-51413
    port: 51413
    targetPort: 51413
    protocol: UDP
