---
services:
  github-desktop:
    image: ghcr.io/linuxserver-playground/github-desktop:latest
    container_name: github-desktop
    cap_add:
      - IPC_LOCK
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/github-desktop/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
