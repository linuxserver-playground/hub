# Speedtest-tracker: generated by the hub from https://github.com/linuxserver-playground/docker-speedtest-tracker/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speedtest-tracker-env
  labels:
    app.kubernetes.io/name: speedtest-tracker
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  APP_KEY: ''
  APP_URL: ''
  DB_CONNECTION: sqlite
  SPEEDTEST_SCHEDULE: ''
  SPEEDTEST_SERVERS: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-config
  labels:
    app.kubernetes.io/name: speedtest-tracker
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
  labels:
    app.kubernetes.io/name: speedtest-tracker
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: speedtest-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speedtest-tracker
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: speedtest-tracker
        image: ghcr.io/linuxserver-playground/speedtest-tracker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: speedtest-tracker-env
        ports:
        - name: port-80
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: speedtest-tracker-config
          mountPath: /config
      volumes:
      - name: speedtest-tracker-config
        persistentVolumeClaim:
          claimName: speedtest-tracker-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-tracker
  labels:
    app.kubernetes.io/name: speedtest-tracker
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: speedtest-tracker
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
