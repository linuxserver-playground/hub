# Rsnapshot: generated by the hub from https://github.com/linuxserver-playground/docker-rsnapshot/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rsnapshot-env
  labels:
    app.kubernetes.io/name: rsnapshot
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rsnapshot-config
  labels:
    app.kubernetes.io/name: rsnapshot
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsnapshot
  labels:
    app.kubernetes.io/name: rsnapshot
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rsnapshot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rsnapshot
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: rsnapshot
        image: ghcr.io/linuxserver-playground/rsnapshot:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: rsnapshot-env
        volumeMounts:
        - name: rsnapshot-config
          mountPath: /config
      volumes:
      - name: rsnapshot-config
        persistentVolumeClaim:
          claimName: rsnapshot-config
  strategy:
    type: Recreate
