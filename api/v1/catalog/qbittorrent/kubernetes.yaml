# Qbittorrent: generated by the hub from https://github.com/linuxserver-playground/docker-qbittorrent/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-env
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  WEBUI_PORT: '8080'
  TORRENTING_PORT: '6881'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: qbittorrent
        image: ghcr.io/linuxserver-playground/qbittorrent:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: qbittorrent-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        - name: port-6881
          containerPort: 6881
          protocol: TCP
        - name: port-6881
          containerPort: 6881
          protocol: UDP
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
      volumes:
      - name: qbittorrent-config
        persistentVolumeClaim:
          claimName: qbittorrent-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: port-6881
    port: 6881
    targetPort: 6881
    protocol: TCP
  - name: port-6881
    port: 6881
    targetPort: 6881
    protocol: UDP
