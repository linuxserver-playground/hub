---
services:
  mame:
    image: ghcr.io/linuxserver-playground/mame:latest
    container_name: mame
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/config:/config
      - /path/to/mame/assets:/mame:ro
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
