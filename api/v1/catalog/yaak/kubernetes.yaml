# Yaak: generated by the hub from https://github.com/linuxserver-playground/docker-yaak/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yaak-env
  labels:
    app.kubernetes.io/name: yaak
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yaak-config
  labels:
    app.kubernetes.io/name: yaak
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaak
  labels:
    app.kubernetes.io/name: yaak
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yaak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yaak
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: yaak
        image: ghcr.io/linuxserver-playground/yaak:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: yaak-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: yaak-config
          mountPath: /config
      volumes:
      - name: yaak-config
        persistentVolumeClaim:
          claimName: yaak-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: yaak
  labels:
    app.kubernetes.io/name: yaak
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: yaak
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
