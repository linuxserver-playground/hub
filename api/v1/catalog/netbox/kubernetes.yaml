# Netbox: generated by the hub from https://github.com/linuxserver-playground/docker-netbox/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-env
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  SUPERUSER_EMAIL: ''
  SUPERUSER_PASSWORD: ''
  ALLOWED_HOST: ''
  DB_NAME: ''
  DB_USER: ''
  DB_PASSWORD: ''
  DB_HOST: ''
  DB_PORT: ''
  REDIS_HOST: ''
  REDIS_PORT: ''
  REDIS_USERNAME: ''
  REDIS_PASSWORD: ''
  REDIS_DB_TASK: ''
  REDIS_DB_CACHE: ''
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-config
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: netbox
        image: ghcr.io/linuxserver-playground/netbox:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: netbox-env
        ports:
        - name: port-8000
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: netbox-config
          mountPath: /config
      volumes:
      - name: netbox-config
        persistentVolumeClaim:
          claimName: netbox-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: netbox
  labels:
    app.kubernetes.io/name: netbox
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: netbox
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
