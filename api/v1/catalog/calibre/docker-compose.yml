---
services:
  calibre:
    image: ghcr.io/linuxserver-playground/calibre:latest
    container_name: calibre
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD= #optional
      - CLI_ARGS= #optional
    volumes:
      - /path/to/calibre/config:/config
    ports:
      - 8080:8080
      - 8181:8181
      - 8081:8081
    shm_size: "1gb"
    restart: unless-stopped
