---
services:
  vlc:
    image: ghcr.io/linuxserver-playground/vlc:latest
    container_name: vlc
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VLC_CLI=--no-qt-minimal-view #optional
    volumes:
      - /path/to/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
