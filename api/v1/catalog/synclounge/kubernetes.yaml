# Synclounge: generated by the hub from https://github.com/linuxserver-playground/docker-synclounge/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synclounge
  labels:
    app.kubernetes.io/name: synclounge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synclounge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synclounge
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: synclounge
        image: ghcr.io/linuxserver-playground/synclounge:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: port-8088
          containerPort: 8088
          protocol: TCP
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: synclounge
  labels:
    app.kubernetes.io/name: synclounge
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: synclounge
  ports:
  - name: port-8088
    port: 8088
    targetPort: 8088
    protocol: TCP
