---
services:
  opera:
    image: ghcr.io/linuxserver-playground/opera:latest
    container_name: opera
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - OPERA_CLI=https://www.linuxserver.io/ #optional
    volumes:
      - /path/to/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
