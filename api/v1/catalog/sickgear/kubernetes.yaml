# Sickgear: generated by the hub from https://github.com/linuxserver-playground/docker-sickgear/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sickgear-env
  labels:
    app.kubernetes.io/name: sickgear
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sickgear-config
  labels:
    app.kubernetes.io/name: sickgear
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sickgear-tv
  labels:
    app.kubernetes.io/name: sickgear
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sickgear-downloads
  labels:
    app.kubernetes.io/name: sickgear
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sickgear
  labels:
    app.kubernetes.io/name: sickgear
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sickgear
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sickgear
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: sickgear
        image: ghcr.io/linuxserver-playground/sickgear:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: sickgear-env
        ports:
        - name: port-8081
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: sickgear-config
          mountPath: /config
        - name: sickgear-tv
          mountPath: /tv
        - name: sickgear-downloads
          mountPath: /downloads
      volumes:
      - name: sickgear-config
        persistentVolumeClaim:
          claimName: sickgear-config
      - name: sickgear-tv
        persistentVolumeClaim:
          claimName: sickgear-tv
      - name: sickgear-downloads
        persistentVolumeClaim:
          claimName: sickgear-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: sickgear
  labels:
    app.kubernetes.io/name: sickgear
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: sickgear
  ports:
  - name: port-8081
    port: 8081
    targetPort: 8081
    protocol: TCP
