# Vscode: generated by the hub from https://github.com/linuxserver-playground/docker-vscode/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability IPC_LOCK: Required for keyring functionality..
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-env
  labels:
    app.kubernetes.io/name: vscode
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vscode-config
  labels:
    app.kubernetes.io/name: vscode
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode
  labels:
    app.kubernetes.io/name: vscode
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vscode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vscode
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: vscode
        image: ghcr.io/linuxserver-playground/vscode:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: vscode-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: vscode-config
          mountPath: /config
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
      volumes:
      - name: vscode-config
        persistentVolumeClaim:
          claimName: vscode-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: vscode
  labels:
    app.kubernetes.io/name: vscode
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: vscode
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
