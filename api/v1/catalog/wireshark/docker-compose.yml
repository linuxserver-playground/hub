---
services:
  wireshark:
    image: ghcr.io/linuxserver-playground/wireshark:latest
    container_name: wireshark
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/wireshark/config:/config
    ports:
      - 3000:3000 #optional
      - 3001:3001 #optional
    shm_size: "1gb"
    restart: unless-stopped
