---
services:
  dogwalk:
    image: ghcr.io/linuxserver-playground/dogwalk:latest
    container_name: dogwalk
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/dogwalk/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
