# Scummvm: generated by the hub from https://github.com/linuxserver-playground/docker-scummvm/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - security_opt seccomp=unconfined: For Docker Engine only, many modern gui apps need this to function on older hosts as syscalls are unknown to Docker. (map to a seccompProfile or AppArmor annotation).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scummvm-env
  labels:
    app.kubernetes.io/name: scummvm
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scummvm-config
  labels:
    app.kubernetes.io/name: scummvm
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scummvm
  labels:
    app.kubernetes.io/name: scummvm
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scummvm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scummvm
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: scummvm
        image: ghcr.io/linuxserver-playground/scummvm:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: scummvm-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        - name: port-3001
          containerPort: 3001
          protocol: TCP
        volumeMounts:
        - name: scummvm-config
          mountPath: /config
      volumes:
      - name: scummvm-config
        persistentVolumeClaim:
          claimName: scummvm-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: scummvm
  labels:
    app.kubernetes.io/name: scummvm
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: scummvm
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
