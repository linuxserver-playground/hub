# Audiosilo: generated by the hub from https://github.com/linuxserver-playground/docker-audiosilo/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audiosilo-env
  labels:
    app.kubernetes.io/name: audiosilo
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiosilo-config
  labels:
    app.kubernetes.io/name: audiosilo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiosilo-audiobooks:ro
  labels:
    app.kubernetes.io/name: audiosilo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiosilo
  labels:
    app.kubernetes.io/name: audiosilo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiosilo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiosilo
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: audiosilo
        image: ghcr.io/linuxserver-playground/audiosilo:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: audiosilo-env
        ports:
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: audiosilo-config
          mountPath: /config
        - name: audiosilo-audiobooks:ro
          mountPath: /audiobooks:ro
      volumes:
      - name: audiosilo-config
        persistentVolumeClaim:
          claimName: audiosilo-config
      - name: audiosilo-audiobooks:ro
        persistentVolumeClaim:
          claimName: audiosilo-audiobooks:ro
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: audiosilo
  labels:
    app.kubernetes.io/name: audiosilo
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: audiosilo
  ports:
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
