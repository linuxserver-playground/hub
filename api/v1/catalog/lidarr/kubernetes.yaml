# Lidarr: generated by the hub from https://github.com/linuxserver-playground/docker-lidarr/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lidarr-env
  labels:
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  labels:
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: lidarr
        image: ghcr.io/linuxserver-playground/lidarr:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: lidarr-env
        ports:
        - name: port-8686
          containerPort: 8686
          protocol: TCP
        volumeMounts:
        - name: lidarr-config
          mountPath: /config
      volumes:
      - name: lidarr-config
        persistentVolumeClaim:
          claimName: lidarr-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  labels:
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: lidarr
  ports:
  - name: port-8686
    port: 8686
    targetPort: 8686
    protocol: TCP
