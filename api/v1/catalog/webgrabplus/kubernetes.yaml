# Webgrabplus: generated by the hub from https://github.com/linuxserver-playground/docker-webgrabplus/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webgrabplus-env
  labels:
    app.kubernetes.io/name: webgrabplus
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgrabplus-config
  labels:
    app.kubernetes.io/name: webgrabplus
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgrabplus-data
  labels:
    app.kubernetes.io/name: webgrabplus
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgrabplus
  labels:
    app.kubernetes.io/name: webgrabplus
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webgrabplus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webgrabplus
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: webgrabplus
        image: ghcr.io/linuxserver-playground/webgrabplus:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: webgrabplus-env
        volumeMounts:
        - name: webgrabplus-config
          mountPath: /config
        - name: webgrabplus-data
          mountPath: /data
      volumes:
      - name: webgrabplus-config
        persistentVolumeClaim:
          claimName: webgrabplus-config
      - name: webgrabplus-data
        persistentVolumeClaim:
          claimName: webgrabplus-data
  strategy:
    type: Recreate
