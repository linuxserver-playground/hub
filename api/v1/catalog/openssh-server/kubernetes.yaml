# Openssh-server: generated by the hub from https://github.com/linuxserver-playground/docker-openssh-server/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openssh-server-env
  labels:
    app.kubernetes.io/name: openssh-server
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openssh-server-config
  labels:
    app.kubernetes.io/name: openssh-server
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openssh-server
  labels:
    app.kubernetes.io/name: openssh-server
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openssh-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openssh-server
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: openssh-server
        image: ghcr.io/linuxserver-playground/openssh-server:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: openssh-server-env
        ports:
        - name: port-2222
          containerPort: 2222
          protocol: TCP
        volumeMounts:
        - name: openssh-server-config
          mountPath: /config
      volumes:
      - name: openssh-server-config
        persistentVolumeClaim:
          claimName: openssh-server-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: openssh-server
  labels:
    app.kubernetes.io/name: openssh-server
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: openssh-server
  ports:
  - name: port-2222
    port: 2222
    targetPort: 2222
    protocol: TCP
