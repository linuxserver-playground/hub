# Tvheadend: generated by the hub from https://github.com/linuxserver-playground/docker-tvheadend/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - device /dev/dri: Only needed if you want to use your AMD/Intel GPU for hardware accelerated video encoding (vaapi). (needs a device plugin or hostPath; not emitted).
#   - device /dev/dvb: Only needed if you want to pass through a DVB card to the container. If you use IPTV or HDHomeRun you can leave it out. (needs a device plugin or hostPath; not emitted).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tvheadend-env
  labels:
    app.kubernetes.io/name: tvheadend
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvheadend-config
  labels:
    app.kubernetes.io/name: tvheadend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvheadend-recordings
  labels:
    app.kubernetes.io/name: tvheadend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvheadend
  labels:
    app.kubernetes.io/name: tvheadend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tvheadend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tvheadend
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: tvheadend
        image: ghcr.io/linuxserver-playground/tvheadend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: tvheadend-env
        ports:
        - name: port-9981
          containerPort: 9981
          protocol: TCP
        - name: port-9982
          containerPort: 9982
          protocol: TCP
        volumeMounts:
        - name: tvheadend-config
          mountPath: /config
        - name: tvheadend-recordings
          mountPath: /recordings
      volumes:
      - name: tvheadend-config
        persistentVolumeClaim:
          claimName: tvheadend-config
      - name: tvheadend-recordings
        persistentVolumeClaim:
          claimName: tvheadend-recordings
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: tvheadend
  labels:
    app.kubernetes.io/name: tvheadend
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: tvheadend
  ports:
  - name: port-9981
    port: 9981
    targetPort: 9981
    protocol: TCP
  - name: port-9982
    port: 9982
    targetPort: 9982
    protocol: TCP
