# Bazarr: generated by the hub from https://github.com/linuxserver-playground/docker-bazarr/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bazarr-env
  labels:
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  labels:
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  labels:
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: bazarr
        image: ghcr.io/linuxserver-playground/bazarr:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: bazarr-env
        ports:
        - name: port-6767
          containerPort: 6767
          protocol: TCP
        volumeMounts:
        - name: bazarr-config
          mountPath: /config
      volumes:
      - name: bazarr-config
        persistentVolumeClaim:
          claimName: bazarr-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  labels:
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: bazarr
  ports:
  - name: port-6767
    port: 6767
    targetPort: 6767
    protocol: TCP
