---
services:
  blender:
    image: ghcr.io/linuxserver-playground/blender:latest
    container_name: blender
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/blender/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
