# Kometa: generated by the hub from https://github.com/linuxserver-playground/docker-kometa/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kometa-env
  labels:
    app.kubernetes.io/name: kometa
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kometa-config
  labels:
    app.kubernetes.io/name: kometa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kometa
  labels:
    app.kubernetes.io/name: kometa
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kometa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kometa
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: kometa
        image: ghcr.io/linuxserver-playground/kometa:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: kometa-env
        volumeMounts:
        - name: kometa-config
          mountPath: /config
      volumes:
      - name: kometa-config
        persistentVolumeClaim:
          claimName: kometa-config
  strategy:
    type: Recreate
