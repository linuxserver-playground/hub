# Modmanager: generated by the hub from https://github.com/linuxserver-playground/docker-modmanager/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modmanager-env
  labels:
    app.kubernetes.io/name: modmanager
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modmanager
  labels:
    app.kubernetes.io/name: modmanager
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modmanager
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: modmanager
        image: ghcr.io/linuxserver-playground/modmanager:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: modmanager-env
  strategy:
    type: Recreate
