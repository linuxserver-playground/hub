# Pyload-ng: generated by the hub from https://github.com/linuxserver-playground/docker-pyload-ng/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyload-ng-env
  labels:
    app.kubernetes.io/name: pyload-ng
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pyload-ng-config
  labels:
    app.kubernetes.io/name: pyload-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pyload-ng-downloads
  labels:
    app.kubernetes.io/name: pyload-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyload-ng
  labels:
    app.kubernetes.io/name: pyload-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pyload-ng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyload-ng
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: pyload-ng
        image: ghcr.io/linuxserver-playground/pyload-ng:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: pyload-ng-env
        ports:
        - name: port-8000
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: pyload-ng-config
          mountPath: /config
        - name: pyload-ng-downloads
          mountPath: /downloads
      volumes:
      - name: pyload-ng-config
        persistentVolumeClaim:
          claimName: pyload-ng-config
      - name: pyload-ng-downloads
        persistentVolumeClaim:
          claimName: pyload-ng-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: pyload-ng
  labels:
    app.kubernetes.io/name: pyload-ng
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: pyload-ng
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
