# Mariadb: generated by the hub from https://github.com/linuxserver-playground/docker-mariadb/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-env
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  MYSQL_ROOT_PASSWORD: ROOT_ACCESS_PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-config
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: mariadb
        image: ghcr.io/linuxserver-playground/mariadb:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: mariadb-env
        ports:
        - name: port-3306
          containerPort: 3306
          protocol: TCP
        volumeMounts:
        - name: mariadb-config
          mountPath: /config
      volumes:
      - name: mariadb-config
        persistentVolumeClaim:
          claimName: mariadb-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: mariadb
  ports:
  - name: port-3306
    port: 3306
    targetPort: 3306
    protocol: TCP
