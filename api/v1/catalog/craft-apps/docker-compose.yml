---
services:
  craft-apps:
    image: ghcr.io/linuxserver-playground/craft-apps:latest
    container_name: craft-apps
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/craft-apps/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
