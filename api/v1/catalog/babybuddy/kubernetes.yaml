# Babybuddy: generated by the hub from https://github.com/linuxserver-playground/docker-babybuddy/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: babybuddy-env
  labels:
    app.kubernetes.io/name: babybuddy
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,https://babybuddy.domain.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: babybuddy-config
  labels:
    app.kubernetes.io/name: babybuddy
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: babybuddy
  labels:
    app.kubernetes.io/name: babybuddy
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: babybuddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: babybuddy
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: babybuddy
        image: ghcr.io/linuxserver-playground/babybuddy:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: babybuddy-env
        ports:
        - name: port-8000
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: babybuddy-config
          mountPath: /config
      volumes:
      - name: babybuddy-config
        persistentVolumeClaim:
          claimName: babybuddy-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: babybuddy
  labels:
    app.kubernetes.io/name: babybuddy
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: babybuddy
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
