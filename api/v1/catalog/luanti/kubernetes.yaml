# Luanti: generated by the hub from https://github.com/linuxserver-playground/docker-luanti/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: luanti-env
  labels:
    app.kubernetes.io/name: luanti
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: luanti-config-.minetest
  labels:
    app.kubernetes.io/name: luanti
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luanti
  labels:
    app.kubernetes.io/name: luanti
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: luanti
  template:
    metadata:
      labels:
        app.kubernetes.io/name: luanti
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: luanti
        image: ghcr.io/linuxserver-playground/luanti:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: luanti-env
        ports:
        - name: port-30000
          containerPort: 30000
          protocol: UDP
        volumeMounts:
        - name: luanti-config-.minetest
          mountPath: /config/.minetest
      volumes:
      - name: luanti-config-.minetest
        persistentVolumeClaim:
          claimName: luanti-config-.minetest
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: luanti
  labels:
    app.kubernetes.io/name: luanti
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: luanti
  ports:
  - name: port-30000
    port: 30000
    targetPort: 30000
    protocol: UDP
