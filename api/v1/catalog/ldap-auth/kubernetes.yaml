# Ldap-auth: generated by the hub from https://github.com/linuxserver-playground/docker-ldap-auth/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-auth-env
  labels:
    app.kubernetes.io/name: ldap-auth
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-auth
  labels:
    app.kubernetes.io/name: ldap-auth
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ldap-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldap-auth
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: ldap-auth
        image: ghcr.io/linuxserver-playground/ldap-auth:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ldap-auth-env
        ports:
        - name: port-8888
          containerPort: 8888
          protocol: TCP
        - name: port-9000
          containerPort: 9000
          protocol: TCP
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ldap-auth
  labels:
    app.kubernetes.io/name: ldap-auth
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: ldap-auth
  ports:
  - name: port-8888
    port: 8888
    targetPort: 8888
    protocol: TCP
  - name: port-9000
    port: 9000
    targetPort: 9000
    protocol: TCP
