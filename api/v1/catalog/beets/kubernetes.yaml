# Beets: generated by the hub from https://github.com/linuxserver-playground/docker-beets/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-env
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beets-config
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beets-music
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beets-downloads
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beets
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: beets
        image: ghcr.io/linuxserver-playground/beets:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: beets-env
        ports:
        - name: port-8337
          containerPort: 8337
          protocol: TCP
        volumeMounts:
        - name: beets-config
          mountPath: /config
        - name: beets-music
          mountPath: /music
        - name: beets-downloads
          mountPath: /downloads
      volumes:
      - name: beets-config
        persistentVolumeClaim:
          claimName: beets-config
      - name: beets-music
        persistentVolumeClaim:
          claimName: beets-music
      - name: beets-downloads
        persistentVolumeClaim:
          claimName: beets-downloads
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: beets
  labels:
    app.kubernetes.io/name: beets
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: beets
  ports:
  - name: port-8337
    port: 8337
    targetPort: 8337
    protocol: TCP
