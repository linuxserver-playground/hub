---
services:
  steam:
    image: ghcr.io/linuxserver-playground/steam:latest
    container_name: steam
    security_opt:
      - seccomp:unconfined #optional
      - apparmor:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
