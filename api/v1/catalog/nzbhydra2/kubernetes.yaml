# Nzbhydra2: generated by the hub from https://github.com/linuxserver-playground/docker-nzbhydra2/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nzbhydra2-env
  labels:
    app.kubernetes.io/name: nzbhydra2
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbhydra2-config
  labels:
    app.kubernetes.io/name: nzbhydra2
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbhydra2
  labels:
    app.kubernetes.io/name: nzbhydra2
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nzbhydra2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nzbhydra2
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: nzbhydra2
        image: ghcr.io/linuxserver-playground/nzbhydra2:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: nzbhydra2-env
        ports:
        - name: port-5076
          containerPort: 5076
          protocol: TCP
        volumeMounts:
        - name: nzbhydra2-config
          mountPath: /config
      volumes:
      - name: nzbhydra2-config
        persistentVolumeClaim:
          claimName: nzbhydra2-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: nzbhydra2
  labels:
    app.kubernetes.io/name: nzbhydra2
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: nzbhydra2
  ports:
  - name: port-5076
    port: 5076
    targetPort: 5076
    protocol: TCP
