---
services:
  weixin:
    image: ghcr.io/linuxserver-playground/weixin:latest
    container_name: weixin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/weixin/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped
