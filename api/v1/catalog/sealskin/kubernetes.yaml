# Sealskin: generated by the hub from https://github.com/linuxserver-playground/docker-sealskin/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sealskin-env
  labels:
    app.kubernetes.io/name: sealskin
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sealskin-config
  labels:
    app.kubernetes.io/name: sealskin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sealskin-storage
  labels:
    app.kubernetes.io/name: sealskin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sealskin-var-run-docker.sock
  labels:
    app.kubernetes.io/name: sealskin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealskin
  labels:
    app.kubernetes.io/name: sealskin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealskin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealskin
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: sealskin
        image: ghcr.io/linuxserver-playground/sealskin:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: sealskin-env
        ports:
        - name: port-8443
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: sealskin-config
          mountPath: /config
        - name: sealskin-storage
          mountPath: /storage
        - name: sealskin-var-run-docker.sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: sealskin-config
        persistentVolumeClaim:
          claimName: sealskin-config
      - name: sealskin-storage
        persistentVolumeClaim:
          claimName: sealskin-storage
      - name: sealskin-var-run-docker.sock
        persistentVolumeClaim:
          claimName: sealskin-var-run-docker.sock
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: sealskin
  labels:
    app.kubernetes.io/name: sealskin
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: sealskin
  ports:
  - name: port-8443
    port: 8443
    targetPort: 8443
    protocol: TCP
