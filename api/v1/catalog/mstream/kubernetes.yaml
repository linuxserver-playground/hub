# Mstream: generated by the hub from https://github.com/linuxserver-playground/docker-mstream/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mstream-env
  labels:
    app.kubernetes.io/name: mstream
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mstream-config
  labels:
    app.kubernetes.io/name: mstream
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mstream-music
  labels:
    app.kubernetes.io/name: mstream
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mstream
  labels:
    app.kubernetes.io/name: mstream
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mstream
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: mstream
        image: ghcr.io/linuxserver-playground/mstream:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: mstream-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: mstream-config
          mountPath: /config
        - name: mstream-music
          mountPath: /music
      volumes:
      - name: mstream-config
        persistentVolumeClaim:
          claimName: mstream-config
      - name: mstream-music
        persistentVolumeClaim:
          claimName: mstream-music
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: mstream
  labels:
    app.kubernetes.io/name: mstream
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: mstream
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
