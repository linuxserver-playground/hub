# Ubooquity: generated by the hub from https://github.com/linuxserver-playground/docker-ubooquity/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ubooquity-env
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubooquity-config
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubooquity-books
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubooquity-comics
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubooquity-files
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubooquity
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ubooquity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ubooquity
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: ubooquity
        image: ghcr.io/linuxserver-playground/ubooquity:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ubooquity-env
        ports:
        - name: port-2202
          containerPort: 2202
          protocol: TCP
        - name: port-2203
          containerPort: 2203
          protocol: TCP
        volumeMounts:
        - name: ubooquity-config
          mountPath: /config
        - name: ubooquity-books
          mountPath: /books
        - name: ubooquity-comics
          mountPath: /comics
        - name: ubooquity-files
          mountPath: /files
      volumes:
      - name: ubooquity-config
        persistentVolumeClaim:
          claimName: ubooquity-config
      - name: ubooquity-books
        persistentVolumeClaim:
          claimName: ubooquity-books
      - name: ubooquity-comics
        persistentVolumeClaim:
          claimName: ubooquity-comics
      - name: ubooquity-files
        persistentVolumeClaim:
          claimName: ubooquity-files
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ubooquity
  labels:
    app.kubernetes.io/name: ubooquity
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: ubooquity
  ports:
  - name: port-2202
    port: 2202
    targetPort: 2202
    protocol: TCP
  - name: port-2203
    port: 2203
    targetPort: 2203
    protocol: TCP
