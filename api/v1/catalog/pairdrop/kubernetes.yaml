# Pairdrop: generated by the hub from https://github.com/linuxserver-playground/docker-pairdrop/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
#   - runAsNonRoot is supported by this image (set runAsUser and drop PUID/PGID).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pairdrop-env
  labels:
    app.kubernetes.io/name: pairdrop
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pairdrop
  labels:
    app.kubernetes.io/name: pairdrop
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pairdrop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pairdrop
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: pairdrop
        image: ghcr.io/linuxserver-playground/pairdrop:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: pairdrop-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: pairdrop
  labels:
    app.kubernetes.io/name: pairdrop
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: pairdrop
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
