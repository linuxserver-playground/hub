---
services:
  xbackbone:
    image: ghcr.io/linuxserver-playground/xbackbone:latest
    container_name: xbackbone
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/xbackbone/config:/config
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
