# Wireguard: generated by the hub from https://github.com/linuxserver-playground/docker-wireguard/blob/master/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
# Security notes:
#   - capability NET_ADMIN: Neccessary for Wireguard to create its VPN interface..
#   - capability SYS_MODULE (optional): Neccessary for loading Wireguard kernel module if it's not already loaded..
#   - readOnlyRootFilesystem is supported by this image; enable it once /config and /tmp are mounted.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-env
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-config
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wireguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wireguard
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: wireguard
        image: ghcr.io/linuxserver-playground/wireguard:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: wireguard-env
        ports:
        - name: port-51820
          containerPort: 51820
          protocol: UDP
        volumeMounts:
        - name: wireguard-config
          mountPath: /config
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      volumes:
      - name: wireguard-config
        persistentVolumeClaim:
          claimName: wireguard-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: wireguard
  ports:
  - name: port-51820
    port: 51820
    targetPort: 51820
    protocol: UDP
