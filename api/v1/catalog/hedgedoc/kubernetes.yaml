# Hedgedoc: generated by the hub from https://github.com/linuxserver-playground/docker-hedgedoc/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hedgedoc-env
  labels:
    app.kubernetes.io/name: hedgedoc
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  DB_HOST: <hostname or ip>
  DB_PORT: '3306'
  DB_USER: hedgedoc
  DB_PASS: <secret password>
  DB_NAME: hedgedoc
  CMD_DOMAIN: localhost
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hedgedoc-config
  labels:
    app.kubernetes.io/name: hedgedoc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hedgedoc
  labels:
    app.kubernetes.io/name: hedgedoc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hedgedoc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hedgedoc
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: hedgedoc
        image: ghcr.io/linuxserver-playground/hedgedoc:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: hedgedoc-env
        ports:
        - name: port-3000
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: hedgedoc-config
          mountPath: /config
      volumes:
      - name: hedgedoc-config
        persistentVolumeClaim:
          claimName: hedgedoc-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: hedgedoc
  labels:
    app.kubernetes.io/name: hedgedoc
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: hedgedoc
  ports:
  - name: port-3000
    port: 3000
    targetPort: 3000
    protocol: TCP
