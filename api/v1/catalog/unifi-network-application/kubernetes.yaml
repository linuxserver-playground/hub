# Unifi-network-application: generated by the hub from https://github.com/linuxserver-playground/docker-unifi-network-application/blob/main/image.yml
# Storage sizes are placeholders; secrets belong in a Secret, not this ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unifi-network-application-env
  labels:
    app.kubernetes.io/name: unifi-network-application
    app.kubernetes.io/managed-by: linuxserver-hub
data:
  PUID: '1000'
  PGID: '1000'
  TZ: Etc/UTC
  MONGO_USER: unifi
  MONGO_PASS: ''
  MONGO_HOST: unifi-db
  MONGO_PORT: '27017'
  MONGO_DBNAME: unifi
  MONGO_AUTHSOURCE: admin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-network-application-config
  labels:
    app.kubernetes.io/name: unifi-network-application
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-network-application
  labels:
    app.kubernetes.io/name: unifi-network-application
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unifi-network-application
        app.kubernetes.io/managed-by: linuxserver-hub
    spec:
      containers:
      - name: unifi-network-application
        image: ghcr.io/linuxserver-playground/unifi-network-application:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: unifi-network-application-env
        ports:
        - name: port-8443
          containerPort: 8443
          protocol: TCP
        - name: port-3478
          containerPort: 3478
          protocol: UDP
        - name: port-10001
          containerPort: 10001
          protocol: UDP
        - name: port-8080
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: unifi-network-application-config
          mountPath: /config
      volumes:
      - name: unifi-network-application-config
        persistentVolumeClaim:
          claimName: unifi-network-application-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-network-application
  labels:
    app.kubernetes.io/name: unifi-network-application
    app.kubernetes.io/managed-by: linuxserver-hub
spec:
  selector:
    app.kubernetes.io/name: unifi-network-application
  ports:
  - name: port-8443
    port: 8443
    targetPort: 8443
    protocol: TCP
  - name: port-3478
    port: 3478
    targetPort: 3478
    protocol: UDP
  - name: port-10001
    port: 10001
    targetPort: 10001
    protocol: UDP
  - name: port-8080
    port: 8080
    targetPort: 8080
    protocol: TCP
