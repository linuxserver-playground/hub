# The release path: finds every release data/ lacks, commits data/, builds the API and the generated artefacts and
# publishes everything to GitHub Pages. It runs when the control plane sends a repository_dispatch of type
# `image-released` (its payload is only a hint), on every push to main, on demand, and when the hourly refresh
# (refresh.yml) has committed new observed data. Nothing slow runs here: stars, GHCR tags, the mods index and the
# vulnerability scans are refresh.yml's, so a release never queues behind them.
#
# GITHUB_TOKEN is enough for the data and the Pages site: the hub only reads public repositories and releases in
# its own organisation. The Unraid, Umbrel and Runtipi stores are pushed to their own repositories (they read a
# git repository and want the store at its root) with an installation token of the GitHub App whose id and private
# key are the STORE_APP_ID and STORE_APP_PRIVATE_KEY secrets; the app needs contents: write on those repositories.
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [image-released]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      store_credentials: ${{ steps.store.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip when the job starts, not the commit the run was created for: a run waits in the
          # concurrency group while the one ahead of it commits data/, and starting from that older commit made
          # both rewrite the same lines of the same files, so the later commit could not rebase.
          ref: ${{ github.ref }}

      - name: Check for store credentials
        # Jobs cannot read secrets in their `if`, so the build job reports whether the store app is configured.
        id: store
        env:
          CONFIGURED: ${{ secrets.STORE_APP_ID != '' && secrets.STORE_APP_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          [ "$CONFIGURED" = "true" ] || echo "::notice::STORE_APP_ID / STORE_APP_PRIVATE_KEY not set; the Umbrel and Runtipi store repositories are not updated"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Ingest every pending release
        # The event's release is only a hint. GitHub keeps one pending run in the concurrency group and drops older
        # ones, so each run reconciles the whole organisation: every image.yml and the newest releases of every
        # repository over GraphQL (about 15 s), then the assets of whatever is new. A dropped event loses nothing,
        # and a burst of releases is picked up by whichever run comes next.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m lsio_hub.ingest --reconcile

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update data"
            # main may have moved since the checkout (code pushes, refresh.yml's data commits). The ingest and the
            # refresh never write the same file (lsio_hub/store.py), so the rebase is clean. Retried because
            # another push can land between the rebase and our push.
            for attempt in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              git rebase --abort 2>/dev/null || true  # a failed rebase must not wedge the next attempt
              [ "$attempt" = 4 ] && exit 1
              sleep $((attempt * 5))
            done
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: Restore unpacked build reports
        # Report tarballs and file trees come from the Releases; a cache keeps re-runs from downloading them again.
        uses: actions/cache@v4
        with:
          path: out/builds
          key: build-reports-${{ github.run_id }}
          restore-keys: build-reports-

      - name: Build the API and every generated artefact
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Independent: the API renders on every core while the generators download the new report tarballs.
          python -m lsio_hub.build &
          api=$!
          python -m lsio_hub.generate
          wait "$api"
          # dist/ is the API and docs page; out/ merges onto the site root: /stores/<platform>/ and /builds/.
          cp -r out/. dist/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Keep the root-level stores for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: stores
          path: |
            out/stores/unraid
            out/stores/umbrel
            out/stores/runtipi
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  prune-caches:
    # Every run saves out/builds/ under its own key (a cache entry cannot be updated) and restores the newest, so
    # older entries only crowd the repository's 10 GB and evict each other. Keeps the two newest; beside the deploy,
    # not in front of it.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key build-reports- --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' | while read -r id; do gh cache delete -R "$GITHUB_REPOSITORY" "$id"; done

  publish-stores:
    # Unraid, Umbrel and Runtipi read a git repository and want the store at its root, so each gets a repository
    # of its own: the import URL is the repository URL. Skipped until the store app's secrets exist; not on pull requests,
    # those have no business pushing anywhere.
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.store_credentials == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        store: [unraid, umbrel, runtipi]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          name: stores
          path: out/stores

      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STORE_APP_ID }}
          private-key: ${{ secrets.STORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.store }}-store

      - name: Push the generated store
        env:
          STORE_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/publish_store.sh "${{ matrix.store }}" "out/stores/${{ matrix.store }}" "${{ github.repository_owner }}/${{ matrix.store }}-store" main
