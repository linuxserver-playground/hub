# Refreshes data/, commits it, builds the API and the generated artefacts and publishes everything to GitHub
# Pages: hourly (reconcile every repository and release, poll stars and GHCR tags, refresh the mods index),
# on every push to main (committed data only), on demand, and when the control plane sends a
# repository_dispatch of type `image-released` with {"repository": "owner/name", "tag": "<tag>"}.
#
# GITHUB_TOKEN is enough for the data and the Pages site: the hub only reads public repositories and releases in
# its own organisation. The Unraid, Umbrel and Runtipi stores are pushed to their own repositories (they read a
# git repository and want the store at its root) with an installation token of the GitHub App whose id and private
# key are the STORE_APP_ID and STORE_APP_PRIVATE_KEY secrets; the app needs contents: write on those repositories.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [image-released]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      store_credentials: ${{ steps.store.outputs.configured }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for store credentials
        # Jobs cannot read secrets in their `if`, so the build job reports whether the store app is configured.
        id: store
        env:
          CONFIGURED: ${{ secrets.STORE_APP_ID != '' && secrets.STORE_APP_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          [ "$CONFIGURED" = "true" ] || echo "::notice::STORE_APP_ID / STORE_APP_PRIVATE_KEY not set; the Umbrel and Runtipi store repositories are not updated"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Ingest one release
        if: github.event_name == 'repository_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python -m lsio_hub.ingest
          --repo "${{ github.event.client_payload.repository }}"
          --tag "${{ github.event.client_payload.tag }}"

      - name: Install grype
        # Pinned; the observe step scans the newest build of each branch with it (skipped gracefully without it).
        id: grype
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GRYPE_VERSION: 0.121.0
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          curl -sSfL -o grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tgz" | sha256sum -c -
          sudo tar -xzf grype.tgz -C /usr/local/bin grype
          rm grype.tgz
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the grype vulnerability database
        # One cache entry a day: the poller updates the database at most once per 24 h, the hourly runs reuse it.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ steps.grype.outputs.date }}
          restore-keys: grype-db-

      - name: Reconcile, observe and refresh the mods index
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m lsio_hub.ingest --reconcile
          python -m lsio_hub.observe
          python -m lsio_hub.mods

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update data"
            # main may have moved since the checkout; only this step writes data/, so the rebase is clean.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: Restore unpacked build reports
        # Report tarballs and file trees come from the Releases; a cache keeps re-runs from downloading them again.
        uses: actions/cache@v4
        with:
          path: out/builds
          key: build-reports-${{ github.run_id }}
          restore-keys: build-reports-

      - name: Build the API and every generated artefact
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m lsio_hub.build
          python -m lsio_hub.generate
          # dist/ is the API and docs page; out/ merges onto the site root: /stores/<platform>/ and /builds/.
          cp -r out/. dist/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Keep the root-level stores for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: stores
          path: |
            out/stores/unraid
            out/stores/umbrel
            out/stores/runtipi
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish-stores:
    # Unraid, Umbrel and Runtipi read a git repository and want the store at its root, so each gets a repository
    # of its own: the import URL is the repository URL. Skipped until the store app's secrets exist; not on pull requests,
    # those have no business pushing anywhere.
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.store_credentials == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        store: [unraid, umbrel, runtipi]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          name: stores
          path: out/stores

      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STORE_APP_ID }}
          private-key: ${{ secrets.STORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.store }}-store

      - name: Push the generated store
        env:
          STORE_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/publish_store.sh "${{ matrix.store }}" "out/stores/${{ matrix.store }}" "${{ github.repository_owner }}/${{ matrix.store }}-store" main
