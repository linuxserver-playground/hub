# The release path: finds every release data/ lacks, publishes data/ to the data branch, builds the API and the
# generated artefacts and publishes them to GitHub Pages from the gh-pages branch. Only the control plane starts it,
# on its slots (control's deploys.py: at most nine an hour, and only when something changed since the last run: a
# live release, a push to main, the hourly refresh's new data, a repository created or deleted); `force` names the
# releases to ingest again. Nothing slow runs here: stars, the mods index and the pushes to the store repositories are
# refresh.yml's, so a release never queues behind them. Dispatching it by hand works, but every run outside
# control's slots counts against Pages' ten builds an hour; ask control instead (/api/status.json `deploys`).
#
# One job. Every job is a separate wait for one of the organisation's 20 runner slots, and during a burst of image
# builds each of those waits was up to 22 minutes (docs/github-runners.md in the workspace), so the Pages publish runs
# as a step of the same job instead of a job of its own.
#
# The heavy files of each build (screenshots, logs, file trees, SBOMs, the vulnerability scan) are on the image
# repository's own Pages, which its build deploys; the hub links there and downloads none of them, so this deploy
# holds only the API and the generated text.
#
# GITHUB_TOKEN is enough: the hub only reads public repositories and releases in its own organisation.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: Comma-separated owner/repo@tag releases to ingest again even when held
        type: string
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The job is deploy-run.yml, which Labs' hub calls too. Calling it adds no runner job.
    uses: ./.github/workflows/deploy-run.yml
    with:
      force: ${{ inputs.force }}
    secrets: inherit
