# The release path: finds every release data/ lacks, publishes data/ to the data branch, builds the API and the
# generated artefacts and publishes everything to GitHub Pages. It runs when the control plane sends a
# repository_dispatch of type `image-released` (its payload is only a hint), on every push to main, on demand, and
# when the hourly refresh (refresh.yml) has published new observed data. Nothing slow runs here: stars, the
# mods index and the pushes to the store repositories are refresh.yml's, so a release never queues behind them.
#
# One job. Every job is a separate wait for one of the organisation's 20 runner slots, and during a burst of image
# builds each of those waits was up to 22 minutes (docs/github-runners.md in the workspace), so the Pages deploy runs
# as a step of the same job instead of a job of its own.
#
# The heavy files of each build (screenshots, logs, file trees, SBOMs, the vulnerability scan) are on the image
# repository's own Pages, which its build deploys; the hub links there and downloads none of them, so this deploy
# holds only the API and the generated text.
#
# GITHUB_TOKEN is enough: the hub only reads public repositories and releases in its own organisation.
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [image-released]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip when the job starts, not the commit the run was created for: a run can wait in the
          # concurrency group behind code pushes.
          ref: ${{ github.ref }}

      - name: Check out the data
        # The data branch holds one commit, the current data, with no history (scripts/commit_data.sh). Checked out
        # by name, so a run that waited in the concurrency group starts from what the run ahead of it published.
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Ingest every pending release
        # The event's release is only a hint. GitHub keeps one pending run in the concurrency group and drops older
        # ones, so each run reconciles the whole organisation: every image.yml and the newest releases of every
        # repository over GraphQL (about 15 s), then the assets of whatever is new. A dropped event loses nothing,
        # and a burst of releases is picked up by whichever run comes next.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m lsio_hub.ingest --reconcile

      - name: Publish the refreshed data
        # Replaces the data branch's one commit. refresh.yml may publish at the same moment; the script merges onto
        # whichever commit landed first. DATA_ALLOW_SHRINK lets one intended big drop in files through.
        env:
          ALLOW_SHRINK: ${{ vars.DATA_ALLOW_SHRINK }}
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/commit_data.sh

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the API and every generated artefact
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Independent: the API renders on every core while the generators write the stores and the redirects.
          python -m lsio_hub.build &
          api=$!
          python -m lsio_hub.generate
          wait "$api"
          # dist/ is the API and docs page; out/ merges onto the site root: /stores/<platform>/ and /builds/ (redirects).
          cp -r out/. dist/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
