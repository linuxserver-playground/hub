# The Refresh job, callable so another organisation's hub runs the same code for its own org (see deploy-run.yml).
# An org without docker-mods and proot-apps passes indexes: false; one without the store credentials only observes.
name: Refresh (job)

on:
  workflow_call:
    inputs:
      indexes:
        description: Refresh the mods and PRoot Apps indexes
        type: boolean
        default: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: linuxserver-playground/hub
          ref: ${{ github.repository == 'linuxserver-playground/hub' && github.ref || 'main' }}

      - name: Check out the data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Check out the version resolver
        # The mod builds' own resolver (workflows scripts/resolve_version.py at the tag the builds use): the mods
        # index resolves each extra version line with it to find that line's newest build (lsio_hub/mods.py).
        uses: actions/checkout@v7
        with:
          repository: linuxserver-playground/workflows
          ref: v1
          path: .lsio-workflows
          persist-credentials: false
          sparse-checkout: scripts/resolve_version.py
          sparse-checkout-cone-mode: false

      - name: Observe and refresh the mods and PRoot Apps indexes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_ORG: ${{ github.repository_owner }}
          INDEXES: ${{ inputs.indexes }}
          RESOLVE_VERSION: .lsio-workflows/scripts/resolve_version.py
        run: |
          python -m lsio_hub.observe
          if [ "$INDEXES" = "true" ]; then
            python -m lsio_hub.mods
            python -m lsio_hub.prootapps
          fi

      - name: Publish and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_SHRINK: ${{ vars.DATA_ALLOW_SHRINK }}
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git -C data rev-parse HEAD)
          # deploy.yml publishes data/ at any time too, but never a file this job writes (scripts/commit_data.sh).
          scripts/commit_data.sh
          if [ "$(git -C data rev-parse HEAD)" = "$before" ]; then
            echo "Nothing changed"
            exit 0
          fi
          # A push with GITHUB_TOKEN starts no workflow, so the deploy is asked for.
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Check for store credentials
        # Steps cannot read secrets in their `if`, so this step reports whether the store app is configured.
        id: store
        env:
          CONFIGURED: ${{ secrets.STORE_APP_ID != '' && secrets.STORE_APP_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          [ "$CONFIGURED" = "true" ] || echo "::notice::STORE_APP_ID / STORE_APP_PRIVATE_KEY not set; the store repositories are not updated"

      - id: pages
        if: steps.store.outputs.configured == 'true'
        uses: actions/configure-pages@v6

      - name: Generate the stores that live in git
        # The same generators, on the same data/, as the Deploy's /stores/<platform>/ (now including this run's commit).
        if: steps.store.outputs.configured == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          HUB_ORG: ${{ github.repository_owner }}
          HUB_WEBSITE: ${{ vars.SITE_URL }}
        run: python -m lsio_hub.generate --only unraid,umbrel,runtipi

      - id: token
        if: steps.store.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.STORE_APP_ID }}
          private-key: ${{ secrets.STORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unraid-store,umbrel-store,runtipi-store

      - name: Push the generated stores
        # Unraid, Umbrel and Runtipi read a git repository and want the store at its root, so each has a repository of
        # its own; the import URL is the repository URL. Each push is independent: one failing does not stop the others.
        if: steps.store.outputs.configured == 'true'
        env:
          STORE_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          failed=0
          for store in unraid umbrel runtipi; do
            scripts/publish_store.sh "$store" "out/stores/$store" "$OWNER/$store-store" main || failed=1
          done
          exit "$failed"
