# The hourly refresh: stars, archived flags and GHCR tags (observe), the vulnerability scans on the database's clock
# (the scan runs at the end of observe), the mods index with what the mods package holds per mod, the PRoot Apps
# index (proot-apps' metadata.yml), and the store repositories. None of it is on a release's path, so it runs apart
# from deploy.yml and never makes a release wait: it commits the files it owns (observed.json, mods.json, proot-apps.json, their status files and the vulns files; see
# lsio_hub/store.py), asks deploy.yml to publish them, and
# then pushes the Unraid, Umbrel and Runtipi stores. The control plane dispatches it every hour too, because GitHub
# skips many runs of an hourly cron.
#
# The stores were a three-job matrix after every Deploy, which during a burst of releases was three more waits for a
# runner slot per hub run. Store clients read their repository at most daily, so an hour's lag costs nothing. The
# Pages copy under /stores/<platform>/ is still rendered by every Deploy. The pushes use an installation token of
# the GitHub App whose id and private key are the STORE_APP_ID and STORE_APP_PRIVATE_KEY secrets; the app needs
# contents: write on the three store repositories.
name: Refresh

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # dispatching deploy.yml
  pages: read  # the Pages URL the store templates link to

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Check out the version resolver
        # The mod builds' own resolver (workflows scripts/resolve_version.py at the tag the builds use): the mods
        # index resolves each extra version line with it to find that line's newest build (lsio_hub/mods.py).
        uses: actions/checkout@v7
        with:
          repository: linuxserver-playground/workflows
          ref: v1
          path: .lsio-workflows
          persist-credentials: false
          sparse-checkout: scripts/resolve_version.py
          sparse-checkout-cone-mode: false

      - name: Install grype
        # Pinned; observe scans the newest build of each branch with it (skipped gracefully without it).
        id: grype
        env:
          GRYPE_VERSION: 0.121.0
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          curl -sSfL -o grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tgz" | sha256sum -c -
          sudo tar -xzf grype.tgz -C /usr/local/bin grype
          rm grype.tgz
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the grype vulnerability database
        # One cache entry a day: the scan updates the database at most once per 24 h, the hourly runs reuse it.
        uses: actions/cache@v6
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ steps.grype.outputs.date }}
          restore-keys: grype-db-

      - name: Observe, scan and refresh the mods and PRoot Apps indexes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_VERSION: .lsio-workflows/scripts/resolve_version.py
        run: |
          python -m lsio_hub.observe
          python -m lsio_hub.mods
          python -m lsio_hub.prootapps

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Update data"
          # deploy.yml commits data/ at any time too, but never a file this job writes, so the rebase is clean.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            git rebase --abort 2>/dev/null || true
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 5))
          done
          # A push with GITHUB_TOKEN starts no workflow, so the deploy is asked for.
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Check for store credentials
        # Steps cannot read secrets in their `if`, so this step reports whether the store app is configured.
        id: store
        env:
          CONFIGURED: ${{ secrets.STORE_APP_ID != '' && secrets.STORE_APP_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          [ "$CONFIGURED" = "true" ] || echo "::notice::STORE_APP_ID / STORE_APP_PRIVATE_KEY not set; the store repositories are not updated"

      - id: pages
        if: steps.store.outputs.configured == 'true'
        uses: actions/configure-pages@v6

      - name: Generate the stores that live in git
        # The same generators, on the same data/, as the Deploy's /stores/<platform>/ (now including this run's commit).
        if: steps.store.outputs.configured == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m lsio_hub.generate --offline --only unraid,umbrel,runtipi

      - id: token
        if: steps.store.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.STORE_APP_ID }}
          private-key: ${{ secrets.STORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unraid-store,umbrel-store,runtipi-store

      - name: Push the generated stores
        # Unraid, Umbrel and Runtipi read a git repository and want the store at its root, so each has a repository of
        # its own; the import URL is the repository URL. Each push is independent: one failing does not stop the others.
        if: steps.store.outputs.configured == 'true'
        env:
          STORE_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          failed=0
          for store in unraid umbrel runtipi; do
            scripts/publish_store.sh "$store" "out/stores/$store" "$OWNER/$store-store" main || failed=1
          done
          exit "$failed"
