# The Deploy job, callable so another organisation's hub (Labs: linuxserverlabs-playground/hub) runs the same
# code for its own org. The code is always this repository's; the data branch, the Pages site and the org are the
# caller's. deploy.yml says when it runs and why it is one job.
name: Deploy (job)

on:
  workflow_call:
    inputs:
      generators:
        description: Comma-separated generators (lsio_hub.generate --only); empty runs them all
        type: string
        default: ''
      force:
        description: Comma-separated owner/repo@tag releases to ingest again even when held (control's hint)
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This repository's code. Here, the branch tip when the job starts, not the commit the run was created
          # for: a run can wait in the concurrency group behind code pushes. From another org's hub, main.
          repository: linuxserver-playground/hub
          ref: ${{ github.repository == 'linuxserver-playground/hub' && github.ref || 'main' }}

      - name: Check out the data
        # The data branch holds one commit, the current data, with no history (scripts/commit_data.sh). Checked out
        # by name, so a run that waited in the concurrency group starts from what the run ahead of it published.
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Ingest every pending release
        # Each run reconciles the whole organisation: every image.yml and the newest releases of every repository over
        # GraphQL (about 15 s), then the assets of whatever is new, so the releases since the last run all land here.
        # The releases control names (`force`) still matter for one case: a rebuild of an already released head
        # republishes under its tag, and --force ingests that tag again at once (a replaced build.json is otherwise
        # noticed by its upload time, an hour after the held record).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_ORG: ${{ github.repository_owner }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          IFS=, read -ra releases <<<"$FORCE"
          for release in "${releases[@]}"; do
            if [ -n "$release" ]; then args+=(--force "$release"); fi
          done
          python -m lsio_hub.ingest --reconcile "${args[@]}"

      - name: Publish the refreshed data
        # Replaces the data branch's one commit. refresh.yml may publish at the same moment; the script merges onto
        # whichever commit landed first. DATA_ALLOW_SHRINK lets one intended big drop in files through.
        env:
          ALLOW_SHRINK: ${{ vars.DATA_ALLOW_SHRINK }}
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/commit_data.sh

      - id: pages
        # The site's origin and base path, read from the repository's Pages settings.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)
          origin=$(sed -E 's#^(https?://[^/]+).*#\1#' <<<"$url")
          base=$(sed -E 's#^https?://[^/]+##; s#/$##' <<<"$url")
          echo "origin=${origin}" >>"$GITHUB_OUTPUT"
          echo "base_path=${base}" >>"$GITHUB_OUTPUT"

      - name: Build the API and every generated artefact
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          HUB_ORG: ${{ github.repository_owner }}
          HUB_WEBSITE: ${{ vars.SITE_URL }}
          GENERATORS: ${{ inputs.generators }}
        run: |
          # Independent: the API renders on every core while the generators write the stores and the redirects.
          python -m lsio_hub.build &
          api=$!
          python -m lsio_hub.generate ${GENERATORS:+--only "$GENERATORS"}
          wait "$api"
          # dist/ is the API and docs page; out/ merges onto the site root: /stores/<platform>/ and /builds/ (redirects).
          cp -r out/. dist/
          # /deploy.json names this run and digests the rest, so the publish can tell a change and the check (and
          # control) which deploy Pages serves.
          scripts/pages_publish.sh stamp dist

      # A Pages build that reports success is not trusted: the check asks the site for this deploy's stamp and fails
      # when it never shows. A red run is what control heals (it requests the next Deploy slot with backoff,
      # recover.py), and a Deploy that finds gh-pages already holding its build asks Pages to build it again.
      # Control reads a failure in either step as Pages' (recover.py, DEPLOY_PAGES_STEPS): keep the names in step.
      - name: Publish to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pages_publish.sh publish dist

      - name: Check that Pages serves the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pages_publish.sh check
