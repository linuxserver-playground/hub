# The Deploy job, callable so another organisation's hub (Labs: linuxserverlabs-playground/hub) runs the same
# code for its own org. The code is always this repository's; the data branch, the Pages site and the org are the
# caller's. deploy.yml says when it runs and why it is one job.
name: Deploy (job)

on:
  workflow_call:
    inputs:
      generators:
        description: Comma-separated generators (lsio_hub.generate --only); empty runs them all
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This repository's code. Here, the branch tip when the job starts, not the commit the run was created
          # for: a run can wait in the concurrency group behind code pushes. From another org's hub, main.
          repository: linuxserver-playground/hub
          ref: ${{ github.repository == 'linuxserver-playground/hub' && github.ref || 'main' }}

      - name: Check out the data
        # The data branch holds one commit, the current data, with no history (scripts/commit_data.sh). Checked out
        # by name, so a run that waited in the concurrency group starts from what the run ahead of it published.
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Ingest every pending release
        # The event's release is only a hint. GitHub keeps one pending run in the concurrency group and drops older
        # ones, so each run reconciles the whole organisation: every image.yml and the newest releases of every
        # repository over GraphQL (about 15 s), then the assets of whatever is new. A dropped event loses nothing,
        # and a burst of releases is picked up by whichever run comes next. The hint still matters for one case: a
        # rebuild of an already released head republishes under its tag, and --force ingests that tag again at
        # once (a replaced build.json is otherwise noticed by its upload time, an hour after the held record).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_ORG: ${{ github.repository_owner }}
          FORCE: ${{ github.event.client_payload.tag && format('{0}@{1}', github.event.client_payload.repository, github.event.client_payload.tag) || '' }}
        run: python -m lsio_hub.ingest --reconcile ${FORCE:+--force "$FORCE"}

      - name: Publish the refreshed data
        # Replaces the data branch's one commit. refresh.yml may publish at the same moment; the script merges onto
        # whichever commit landed first. DATA_ALLOW_SHRINK lets one intended big drop in files through.
        env:
          ALLOW_SHRINK: ${{ vars.DATA_ALLOW_SHRINK }}
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/commit_data.sh

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the API and every generated artefact
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          HUB_ORG: ${{ github.repository_owner }}
          HUB_WEBSITE: ${{ vars.SITE_URL }}
          GENERATORS: ${{ inputs.generators }}
        run: |
          # Independent: the API renders on every core while the generators write the stores and the redirects.
          python -m lsio_hub.build &
          api=$!
          python -m lsio_hub.generate ${GENERATORS:+--only "$GENERATORS"}
          wait "$api"
          # dist/ is the API and docs page; out/ merges onto the site root: /stores/<platform>/ and /builds/ (redirects).
          cp -r out/. dist/
          # /deploy.json names this run, so the checks below (and control) can tell which deploy Pages serves.
          scripts/pages_serves.sh stamp dist

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # deploy-pages reports success when GitHub accepts the deployment, not when the site serves it, and on
      # 2026-11-04 GitHub accepted five in a row that never went live (scripts/pages_serves.sh). So ask the site for
      # this run's stamp and deploy again when it is not there, three deploys in all, then fail: a red run is what
      # control heals (it dispatches this workflow again with backoff, recover.py) and what keeps hub-updated from
      # sending the site to rebuild from data Pages does not serve.
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check that Pages serves the deploy
        id: check
        continue-on-error: true
        run: scripts/pages_serves.sh check "${{ steps.deployment.outputs.page_url }}"

      - name: Upload the Pages artifact again
        id: upload2
        if: steps.check.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-2
          path: dist

      - name: Deploy to Pages again
        id: deployment2
        if: steps.upload2.outcome == 'success'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-2

      - name: Check that Pages serves the second deploy
        id: check2
        if: steps.deployment2.outcome == 'success'
        continue-on-error: true
        run: scripts/pages_serves.sh check "${{ steps.deployment2.outputs.page_url }}"

      - name: Upload the Pages artifact a last time
        id: upload3
        if: steps.check2.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-3
          path: dist

      - name: Deploy to Pages a last time
        id: deployment3
        if: steps.upload3.outcome == 'success'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-3

      # Control reads a failure in any step from the first upload on as Pages' (recover.py, HUB_PAGES_STEPS): keep
      # the step names in step with it. Failing here means Pages still serves an older deploy after three.
      - name: Check that Pages serves the last deploy
        if: steps.deployment3.outcome == 'success'
        run: scripts/pages_serves.sh check "${{ steps.deployment3.outputs.page_url }}"
